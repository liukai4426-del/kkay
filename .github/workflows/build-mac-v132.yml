name: Build KAYTRADE Intel Mac 1.3.2
on:
  push:
    branches:
      - codex/v1-3-2-strategy
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Create application icon
        run: python build_icon.py
      - name: Test preserved execution and safety regressions
        run: |
          python -m unittest -v \
            test_engine \
            test_v11.Network test_v11.History \
            test_v13.V13StructureAndSafetyTests test_v13.V13LimitFillSafetyTests \
            test_candles test_v122 test_v132
      - name: Verify V1.3.2 scoring and UI wiring
        run: |
          python -m py_compile strategy.py engine.py candles.py app.py visual.py desktop.py
          python - <<'PY'
          from pathlib import Path
          s=Path('strategy.py').read_text(); e=Path('engine.py').read_text(); a=Path('app.py').read_text()
          for token in ('SCORE_MAX = 10.0','NORMAL_THRESHOLD = 4.0','5m + 15m RSI 极值共振','4H 对应支撑/阻力'):
              assert token in s, token
          assert "score_threshold:float=4.0" in e
          assert "self.x.candles('4H')" in e
          assert 'KAYTRADE 1.3.2' in a
          assert 'maximum=10' in a
          print('V1.3.2 wiring OK')
          PY
      - name: Build KAYTRADE Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Check macOS compatibility metadata
        run: python verify_bundle.py
      - name: Test packaged KAYTRADE UI without network or orders
        run: |
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$RUNNER_TEMP/kaytrade-smoke.txt"
          test -s "$RUNNER_TEMP/kaytrade-smoke.txt"
          cat "$RUNNER_TEMP/kaytrade-smoke.txt"
          codesign --verify --deep --strict dist/KAYTRADE.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create KAYTRADE 1.3.2 installer disk image
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.1.md installer/RELEASE-1.3.1.md
          cp RELEASE-1.3.2.md installer/RELEASE-1.3.2.md
          cp "$RUNNER_TEMP/kaytrade-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.2 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.2-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.2-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.2-Intel-test
          path: |
            KAYTRADE-1.3.2-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
