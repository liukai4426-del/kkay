name: Backtest KAYTRADE V1.3.8 Final BTC 30D Entry4 Single Signal
on:
  push:
    branches: [research/v138-final-btc-30d-entry4-single-signal]
    paths:
      - research_v138_final_30d_entry4_single_signal_backtest.py
      - .github/workflows/backtest-v138-final-btc-30d-entry4-single-signal.yml
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research backtest
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v138_final_30d_backtest.py research_v138_final_30d_entry5_backtest.py research_v138_final_30d_entry4_single_signal_backtest.py
      - name: Verify one-variable comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research_v138_final_30d_entry4_single_signal_backtest.py').read_text(); base=Path('research_v138_final_3m_backtest.py').read_text()
          assert '>=4.0' in s and 'signal_tiers' in s and "'add_on_enabled':False" in s
          assert '2026,8,13,10,57' in s and '2026,9,12,10,57' in s
          for token in ('front_r >= 1.3','trigger_ok and macd5 and hstate != "opposite" and space_ok','LOSS_PAUSE_MS = 6 * 60 * 60 * 1000'):
              assert token in base, token
          print('PASS: exact-window A/B; only opening threshold changed 5.0 -> 4.0; single signal, no add-on')
          PY
      - name: Run backtest
        run: python research_v138_final_30d_entry4_single_signal_backtest.py
      - name: Show summary
        run: cat backtest_output_v138_final_30d_entry4_single_signal/metrics.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V138-FINAL-BTC-30D-ENTRY4-SINGLE-SIGNAL
          path: backtest_output_v138_final_30d_entry4_single_signal/
          retention-days: 14
