name: Build KAYTRADE Intel Mac 1.4.5 Layout Fix
on:
  push:
    branches: [codex/v1-4-5-layout-fix]
    paths:
      - candles.py
      - engine.py
      - exchange.py
      - app.py
      - strategy.py
      - visual.py
      - desktop.py
      - build_icon.py
      - OKXLocal.spec
      - assets/kaytrade-v142-logo.png
      - v135_patch.py
      - v135_execution_patch.py
      - v135_flatten_noop_hotfix.py
      - v135_auto_entry_guard.py
      - v136_runtime.py
      - v136_entry_fix.py
      - v137_strategy_patch.py
      - v137_cancel_fix.py
      - v138_strategy_patch.py
      - v139_position_patch.py
      - v140_score_dialog_patch.py
      - v141_dialog_signal_positions_patch.py
      - v141_history_return_chart_patch.py
      - v141_exit_limit_patch.py
      - v142_visual_patch.py
      - v143_score_arbitration_patch.py
      - v143_visual_polish_patch.py
      - v144_ui_polish_patch.py
      - v145_layout_fix_patch.py
      - test_v141_dialog_signal_positions.py
      - test_v141_history_return_chart.py
      - test_v141_exit_limit.py
      - test_v142_visual.py
      - test_v143_score_arbitration.py
      - test_v143_visual_polish.py
      - test_v144_ui_polish.py
      - test_v145_layout_fix.py
      - RELEASE-1.4.5.md
      - .github/workflows/build-mac-v145.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v145-strategy-safety-layout-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.4.5 runtime
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py v137_strategy_patch.py v137_cancel_fix.py v138_strategy_patch.py v139_position_patch.py v140_score_dialog_patch.py v141_dialog_signal_positions_patch.py v141_history_return_chart_patch.py v141_exit_limit_patch.py v142_visual_patch.py v143_score_arbitration_patch.py v143_visual_polish_patch.py v144_ui_polish_patch.py v145_layout_fix_patch.py test_v145_layout_fix.py
      - name: Run preserved safety and strategy tests
        run: |
          python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
          python -m unittest -v test_v137_strategy test_v137_cancel_fix
          python -m unittest -v test_v138_strategy
          python -m unittest -v test_v139_position
          python -m unittest -v test_v140_score_dialog
          python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit
      - name: Run V1.4.2 through V1.4.4 regression tests
        run: python -m unittest -v test_v142_visual test_v143_score_arbitration test_v143_visual_polish test_v144_ui_polish
      - name: Run V1.4.5 layout tests
        run: python -m unittest -v test_v145_layout_fix
      - name: Verify V1.4.5 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v145_layout_fix_patch.py').read_text()
          assert 'v145_layout_fix_patch.py' in spec
          assert "CFBundleShortVersionString': '1.4.5'" in spec
          assert "CFBundleVersion': '145'" in spec
          for token in ('relwidth=1.0','relheight=1.0','_rebuild_connection_page','_v145_main_layout','账户连接'):
              assert token in patch, token
          print('PASS: V1.4.5 full-width layout runtime wired')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.4.1 through V1.4.5 tests on Intel Mac
        run: |
          python -m py_compile v141_dialog_signal_positions_patch.py v141_history_return_chart_patch.py v141_exit_limit_patch.py v142_visual_patch.py v143_score_arbitration_patch.py v143_visual_polish_patch.py v144_ui_polish_patch.py v145_layout_fix_patch.py test_v141_dialog_signal_positions.py test_v141_history_return_chart.py test_v141_exit_limit.py test_v142_visual.py test_v143_score_arbitration.py test_v143_visual_polish.py test_v144_ui_polish.py test_v145_layout_fix.py
          python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit test_v142_visual test_v143_score_arbitration test_v143_visual_polish test_v144_ui_polish test_v145_layout_fix
      - name: V1.4.5 full-width UI smoke test
        run: |
          python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch
          import v145_layout_fix_patch as v145
          import app
          root=tk.Tk()
          root.geometry('1400x900')
          try:
              with patch.object(app.App,'worker',lambda self: None):
                  ui=app.App(root,Path(tempfile.mkdtemp(prefix='kaytrade145-')))
                  root.geometry('1400x900')
                  root.update_idletasks(); root.update()
                  assert '1.4.5' in root.title()
                  assert getattr(ui,'_v145_layout_full_width',False)
                  assert getattr(ui,'_v145_connection_rebuilt',False)
                  ui.book.select(0)
                  root.update_idletasks(); root.update()
                  page=ui._v145_connection_page
                  surface=ui._v145_connection_surface
                  book_width=max(1,ui.book.winfo_width())
                  page_width=max(1,page.winfo_width())
                  surface_width=max(1,surface.winfo_width())
                  print('book/page/surface widths:',book_width,page_width,surface_width)
                  assert page_width >= book_width*0.94, (book_width,page_width)
                  assert surface_width >= page_width*0.94, (page_width,surface_width)
                  assert len(ui.connection_widgets)==5
                  assert all(w.winfo_width() >= 500 for w in ui.connection_widgets), [w.winfo_width() for w in ui.connection_widgets]
                  ui.book.select(3)
                  root.update_idletasks(); root.update()
                  dash=ui.book.pages[3]
                  assert dash.winfo_width() >= ui.book.winfo_width()*0.94
                  ui.finished.set(); ui.lock.close()
          finally:
              root.destroy()
          print('PASS: V1.4.5 main pages and Account Connection expand across the application')
          PY
      - name: Create application icon from selected logo
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.4.5'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.4.5.md installer/RELEASE-1.4.5.md
          printf 'PASS: V1.4.5 full-width layout repair + V1.4.4 visual polish + V1.4.3 trading logic preserved\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.4.5 -srcfolder installer -ov -format UDZO KAYTRADE-1.4.5-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.4.5-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.4.5-Intel-test
          path: |
            KAYTRADE-1.4.5-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
