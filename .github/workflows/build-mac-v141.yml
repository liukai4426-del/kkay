name: Build KAYTRADE Intel Mac 1.4.1 Dialog Signal Positions
on:
  push:
    branches: [codex/v1-4-1-dialog-signal-positions]
    paths:
      - candles.py
      - engine.py
      - exchange.py
      - app.py
      - strategy.py
      - visual.py
      - desktop.py
      - OKXLocal.spec
      - v135_patch.py
      - v135_execution_patch.py
      - v135_flatten_noop_hotfix.py
      - v135_auto_entry_guard.py
      - v136_runtime.py
      - v136_entry_fix.py
      - v137_strategy_patch.py
      - v137_cancel_fix.py
      - v138_strategy_patch.py
      - v139_position_patch.py
      - v140_score_dialog_patch.py
      - v141_dialog_signal_positions_patch.py
      - v141_history_return_chart_patch.py
      - v141_exit_limit_patch.py
      - test_v141_dialog_signal_positions.py
      - test_v141_history_return_chart.py
      - test_v141_exit_limit.py
      - RELEASE-1.4.1.md
      - .github/workflows/build-mac-v141.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v141-strategy-and-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.4.1 runtime
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py v137_strategy_patch.py v137_cancel_fix.py v138_strategy_patch.py v139_position_patch.py v140_score_dialog_patch.py v141_dialog_signal_positions_patch.py v141_history_return_chart_patch.py v141_exit_limit_patch.py test_v141_dialog_signal_positions.py test_v141_history_return_chart.py test_v141_exit_limit.py
      - name: Run preserved safety and strategy tests
        run: |
          python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
          python -m unittest -v test_v137_strategy test_v137_cancel_fix
          python -m unittest -v test_v138_strategy
          python -m unittest -v test_v139_position
          python -m unittest -v test_v140_score_dialog
      - name: Run V1.4.1 tests
        run: python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit
      - name: Verify V1.4.1 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v141_dialog_signal_positions_patch.py').read_text()
          chart=Path('v141_history_return_chart_patch.py').read_text()
          exits=Path('v141_exit_limit_patch.py').read_text()
          assert 'v141_dialog_signal_positions_patch.py' in spec
          assert 'v141_history_return_chart_patch.py' in spec
          assert 'v141_exit_limit_patch.py' in spec
          assert "CFBundleShortVersionString': '1.4.1'" in spec
          for token in ('first_signal_notional','second_signal_notional','third_signal_notional','{1:1,2:1,3:1}','_centered_modal','第一信号仓位','第二信号仓位','第三信号仓位'):
              assert token in patch, token
          for token in ('累计收益率','策略资金预算','收益率','日期','_history_points'):
              assert token in chart, token
          for token in ("tpOrdPx':tp_trigger","slOrdPx':sl_trigger",'_matching_leg_for_exit_child','限价止盈/止损已触发但尚未完全成交'):
              assert token in exits, token
          print('PASS: V1.4.1 runtime, signal caps, dialogs, return chart and trigger-limit TP/SL wired')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.4.1 tests on Intel Mac
        run: |
          python -m py_compile v141_dialog_signal_positions_patch.py v141_history_return_chart_patch.py v141_exit_limit_patch.py test_v141_dialog_signal_positions.py test_v141_history_return_chart.py test_v141_exit_limit.py
          python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit
      - name: V1.4.1 UI source smoke test
        run: |
          python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch
          import v141_dialog_signal_positions_patch as v141
          import v141_history_return_chart_patch as hchart
          import v141_exit_limit_patch as exits
          import v138_strategy_patch as v138
          import app
          root=tk.Tk()
          try:
              with patch.object(app.App,'worker',lambda self: None):
                  ui=app.App(root,Path(tempfile.mkdtemp(prefix='kaytrade141-')))
                  root.update()
                  assert '1.4.1' in root.title()
                  assert 'max_initial_notional' not in ui.fields
                  assert 'max_notional' not in ui.fields
                  for key in ('first_signal_notional','second_signal_notional','third_signal_notional'):
                      assert key in ui.fields
                      assert float(ui.fields[key].get())>0
                  settings=ui.settings()
                  assert settings.first_signal_notional>0
                  assert settings.second_signal_notional>0
                  assert settings.third_signal_notional>0
                  assert v141._tier_limit(1)==1 and v141._tier_limit(2)==1 and v141._tier_limit(3)==1
                  texts=[]
                  for w in v138._widgets(root):
                      try:texts.append(str(w.cget('text') or ''))
                      except Exception:pass
                  assert any(x.startswith('第一信号仓位 USDT') for x in texts)
                  assert any(x.startswith('第二信号仓位 USDT') for x in texts)
                  assert any(x.startswith('第三信号仓位 USDT') for x in texts)
                  modal=v141._centered_modal(root,'连接成功','账户连接与只读状态核对已完成。',True)
                  root.update()
                  assert str(modal.cget('background'))==app.PANEL
                  buttons=[w for w in v138._widgets(modal) if isinstance(w,app.RoundedButton)]
                  assert len(buttons)==1 and buttons[0].variant=='accent' and buttons[0].text=='确认'
                  assert buttons[0].pack_info().get('anchor')=='center'
                  labels=[w for w in v138._widgets(modal) if isinstance(w,tk.Label)]
                  assert labels and all((w.pack_info().get('anchor')=='center') for w in labels if w.winfo_manager()=='pack')
                  modal.destroy(); root.update()
                  ui._v141_history_return_capital=1000.0
                  ui._v141_history_return_points=[('2026-09-10T12:00:00Z',1.0),('2026-09-11T12:00:00Z',-0.5),('2026-09-12T12:00:00Z',2.0)]
                  ui.draw_curve(); root.update()
                  chart_text=[str(ui.chart.itemcget(item,'text')) for item in ui.chart.find_all() if ui.chart.type(item)=='text']
                  assert any('累计收益率' in text for text in chart_text)
                  assert any('%' in text for text in chart_text)
                  assert any('09-10' in text for text in chart_text)
                  assert any('日期' in text for text in chart_text)
                  payload=exits._limit_attached_payload('/api/v5/trade/order',{'attachAlgoOrds':[{'attachAlgoClOrdId':'smoke','tpTriggerPx':'120','tpOrdPx':'-1','slTriggerPx':'90','slOrdPx':'-1'}]})
                  bracket=payload['attachAlgoOrds'][0]
                  assert bracket['tpOrdPx']=='120' and bracket['slOrdPx']=='90'
                  ui.finished.set(); ui.lock.close()
          finally:
              root.destroy()
          print('PASS: V1.4.1 UI, return chart and trigger-limit TP/SL smoke test')
          PY
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.4.1'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.4.1.md installer/RELEASE-1.4.1.md
          printf 'PASS: V1.4.1 signal positions + centered dialogs + dated return chart + trigger-limit TP/SL + Intel build\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.4.1 -srcfolder installer -ov -format UDZO KAYTRADE-1.4.1-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.4.1-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.4.1-Intel-test
          path: |
            KAYTRADE-1.4.1-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
