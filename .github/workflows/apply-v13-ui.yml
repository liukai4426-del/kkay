name: Apply KAYTRADE V1.3 UI
on:
  push:
    branches:
      - codex/v1-3-strategy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply confirmed KAYTRADE UI patch
        run: python ui_v13_patch.py
      - name: Run strategy and safety regression tests
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Validate Python syntax
        run: python -m py_compile app.py visual.py desktop.py verify_bundle.py
      - name: Commit UI source changes
        run: |
          git checkout -- .github/workflows/apply-v13-ui.yml .github/workflows/build-mac.yml
          rm -f ui_v13_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'KAYTRADE V1.3: visual system upgrade [skip ci]'
          git push origin HEAD:codex/v1-3-strategy
