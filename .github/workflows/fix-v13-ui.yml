name: Fix V1.3 UI Smoke
on:
  push:
    branches:
      - codex/v1-3-strategy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply V1.3 UI smoke migration
        run: python fix_v13_ui_smoke.py
      - name: Run source regression tests
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Commit UI migration
        run: |
          git checkout -- .github/workflows/fix-v13-ui.yml
          rm -f fix_v13_ui_smoke.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'V1.3: align UI and packaged smoke test [skip ci]'
          git push origin HEAD:codex/v1-3-strategy
