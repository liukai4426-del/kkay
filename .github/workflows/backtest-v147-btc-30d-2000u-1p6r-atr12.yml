name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D 2000U 1.6R ATR1.2
on:
  push:
    branches: [research/v147-btc-30d-2000u-1p6r-atr12]
    paths:
      - research_v147_1p6r_atr12_backtest.py
      - research_v147_1m_2000u_backtest.py
      - research_v146_backtest.py
      - .github/workflows/backtest-v147-btc-30d-2000u-1p6r-atr12.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research scenario
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py research_v147_1p6r_atr12_backtest.py
      - name: Verify requested geometry and comparison period
        run: |
          python - <<'PY'
          import research_v147_1p6r_atr12_backtest as s
          assert s.STOP_ATR == 1.2
          assert s.REWARD_R == 1.6
          assert s.v.CAPITAL == 2000.0
          assert s.START.isoformat() == '2026-08-13T07:40:00+00:00'
          assert s.END.isoformat() == '2026-09-12T07:40:00+00:00'
          # Unit-check true geometry using a 100-point ATR.
          class Dummy:
              meta={'tickSz':0.1,'ctVal':0.01,'ctMult':1.0,'minSz':0.01,'lotSz':0.01}
              active=None
              def available(self, price): return 2000.0
          p=s.plan_1p6r(Dummy(),'做多',1,5.0,70000.0,100.0,2000.0,60.0)
          assert p is not None
          entry,qty,notional,sl,tp,est,multiple=p
          assert abs((entry-sl)-120.0) <= 0.11
          assert abs((tp-entry)-192.0) <= 0.11
          assert abs((tp-entry)/(entry-sl)-1.6) < 0.01
          print('PASS: true 1.6:1 TP/SL, stop=15m ATR x1.2, target=ATR x1.92, same 30-day sample')
          PY
      - name: Run V1.4.7 BTC 30-day 1.6R ATR1.2 backtest
        run: python research_v147_1p6r_atr12_backtest.py
      - name: Show result summary
        if: success()
        run: |
          cat backtest_output_v147_1p6r_atr12/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_1p6r_atr12/V147_BTC_SWAP_30D_2000U_1P6R_ATR12_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-2000U-1P6R-ATR12-BACKTEST
          path: |
            backtest_output_v147_1p6r_atr12/V147_BTC_SWAP_30D_2000U_1P6R_ATR12_Backtest_Report.md
            backtest_output_v147_1p6r_atr12/V147_BTC_SWAP_30D_2000U_1P6R_ATR12_Trades.csv
            backtest_output_v147_1p6r_atr12/V147_BTC_SWAP_30D_2000U_1P6R_ATR12_Cycles.csv
            backtest_output_v147_1p6r_atr12/V147_BTC_SWAP_30D_2000U_1P6R_ATR12_DailyEquity.csv
            backtest_output_v147_1p6r_atr12/metrics.json
          if-no-files-found: error
          retention-days: 14
