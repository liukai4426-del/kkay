name: Backtest KAYTRADE V1.6.8 30m BOLL + ADX Hard Gate 180D

on:
  push:
    branches: [research/v168-adx-hardgate-only-180d]
    paths:
      - run_v168_adx_hardgate_30m_180d.py
      - run_v168_180d_backtest_r2.py
      - run_v168_adx_30m_backtest.py
      - .github/workflows/backtest-v168-30m-adx-hardgate-180d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore identical 180D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-180d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-180d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Compile and verify exact strategy lock
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            research_backtest_data_cache.py run_v168_180d_backtest_r2.py \
            run_v168_adx_30m_backtest.py run_v168_adx_hardgate_30m_180d.py
          python - <<'PY'
          import run_v168_adx_hardgate_30m_180d as x
          x.configure()
          x.verify_lock()
          assert x.HistoricalV168ThirtyMinAdxHardGateModel.ENTRY_WINDOW_MS == 1800000
          assert x.HistoricalV168ThirtyMinAdxHardGateModel.THRESHOLD == 6.0
          assert x.ADX_THRESHOLD == 25.0
          assert x.base.EMA_FAST == 9 and x.base.EMA_SLOW == 26
          print('PASS: V1.6.8 R2 + BOLL 30m + ADX Hard Gate only; EMA score preserved; ADX score OFF')
          PY

      - name: Run 180D backtest
        run: time python run_v168_adx_hardgate_30m_180d.py

      - name: Verify result payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v168_30m_adx_hardgate_180d/result_v168_30m_adx_hardgate_180d.json')
          d=json.loads(p.read_text())
          s=d['strategy_lock']
          assert d['window']['days'] == 180
          assert s['baseline'] == 'V1.6.8 Build1680 R2'
          assert s['boll_signal_lifetime_ms'] == 1800000
          assert s['boll_outer_score'] == 2.0
          assert s['5m_adx_score_enabled'] is False
          assert s['5m_adx_score'] == 0.0
          assert s['5m_adx_hard_gate'] is True
          assert 'PRESERVED' in s['1h_ema']
          assert s['score_threshold'] == 6.0
          assert s['break_even'] is False and s['early_exit'] is False
          assert d['correction']['strategy_deltas'] == [
              '15m BOLL trigger lifecycle 15m -> 30m',
              '5m ADX14 strong-opposite Hard Gate only',
          ]
          trades=int(d['metrics']['trades'] or 0)
          assert trades > 0, 'ANOMALY: zero trades; inspect 30m/ADX hard-gate path before longer run'
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.8-30m-BOLL-ADX-HardGate-180D-2000U
          path: backtest_output_v168_30m_adx_hardgate_180d/
          if-no-files-found: error
          retention-days: 30
