name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D 2000U MIN5

on:
  push:
    branches:
      - research/v147-btc-30d-2000u-min5
    paths:
      - 'research_v146_backtest.py'
      - 'research_v147_1m_2000u_backtest.py'
      - 'research_v147_min5_backtest.py'
      - '.github/workflows/backtest-v147-btc-30d-2000u-min5.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research scenario
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py research_v147_min5_backtest.py
      - name: Verify requested threshold and fixed comparison period
        run: |
          python - <<'PY'
          import research_v147_min5_backtest as s
          assert s.MIN_ENTRY_SCORE == 5.0
          assert s.v.STOP_ATR == 1.0
          assert s.v.REWARD_R == 2.0
          assert s.v.CAPITAL == 2000.0
          assert s.START.isoformat() == '2026-08-13T07:40:00+00:00'
          assert s.END.isoformat() == '2026-09-12T07:40:00+00:00'
          print('PASS: only minimum entry score changes 4.0 -> 5.0; 1:2 ATR1.0 and same 30-day sample retained')
          PY
      - name: Run V1.4.7 BTC 30-day MIN5 backtest
        run: python research_v147_min5_backtest.py
      - name: Show result summary
        run: |
          cat backtest_output_v147_min5/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_min5/V147_BTC_SWAP_30D_2000U_MIN5_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-2000U-MIN5-BACKTEST
          path: |
            backtest_output_v147_min5/V147_BTC_SWAP_30D_2000U_MIN5_Backtest_Report.md
            backtest_output_v147_min5/V147_BTC_SWAP_30D_2000U_MIN5_Trades.csv
            backtest_output_v147_min5/V147_BTC_SWAP_30D_2000U_MIN5_Cycles.csv
            backtest_output_v147_min5/V147_BTC_SWAP_30D_2000U_MIN5_DailyEquity.csv
            backtest_output_v147_min5/metrics.json
          if-no-files-found: error
          retention-days: 14
