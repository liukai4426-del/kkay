name: Backtest KAYTRADE V1.4.6 BTC SWAP 3M 1R1R
on:
  push:
    branches: [research/v146-btc-3m-1r1r]
    paths:
      - research_v146_backtest.py
      - research_v146_backtest_1r1r.py
      - .github/workflows/backtest-v146-btc-3m-1r1r.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile 1R1R research backtest
        run: python -m py_compile research_v146_backtest.py research_v146_backtest_1r1r.py
      - name: Run V1.4.6 BTC-USDT-SWAP 1R1R three-month backtest
        env:
          BACKTEST_OUT: backtest_output_1r1r
        run: python research_v146_backtest_1r1r.py
      - name: Show report summary
        if: success()
        run: |
          cat backtest_output_1r1r/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_1r1r/V146_BTC_SWAP_3M_1R1R_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAYTRADE-V146-BTC-SWAP-3M-1R1R-BACKTEST
          path: |
            backtest_output_1r1r/V146_BTC_SWAP_3M_1R1R_Backtest_Report.md
            backtest_output_1r1r/V146_BTC_SWAP_3M_Trades.csv
            backtest_output_1r1r/V146_BTC_SWAP_3M_Cycles.csv
            backtest_output_1r1r/V146_BTC_SWAP_3M_DailyEquity.csv
            backtest_output_1r1r/metrics.json
          if-no-files-found: error
          retention-days: 14
