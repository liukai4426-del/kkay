name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D 2000U TIER1-2-4

on:
  push:
    branches:
      - research/v147-btc-30d-2000u-tier124
    paths:
      - 'research_v146_backtest.py'
      - 'research_v147_1m_2000u_backtest.py'
      - 'research_v147_tier124_backtest.py'
      - '.github/workflows/backtest-v147-btc-30d-2000u-tier124.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research scenario
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py research_v147_tier124_backtest.py
      - name: Verify requested sizing and fixed comparison period
        run: |
          python - <<'PY'
          import research_v147_tier124_backtest as s
          assert s.MIN_ENTRY_SCORE == 4.0
          assert s.TIER_CAP == {1: 500.0, 2: 1000.0, 3: 2000.0}
          assert s.v.STOP_ATR == 1.0
          assert s.v.REWARD_R == 2.0
          assert s.v.CAPITAL == 2000.0
          assert s.START.isoformat() == '2026-08-13T07:40:00+00:00'
          assert s.END.isoformat() == '2026-09-12T07:40:00+00:00'
          print('PASS: min score 4.0 retained; tier caps 500/1000/2000 = 1:2:4; all other comparison parameters retained')
          PY
      - name: Run V1.4.7 BTC 30-day tier 1-2-4 backtest
        run: python research_v147_tier124_backtest.py
      - name: Show result summary
        run: |
          cat backtest_output_v147_tier124/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_tier124/V147_BTC_SWAP_30D_2000U_TIER124_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-2000U-TIER124-BACKTEST
          path: |
            backtest_output_v147_tier124/V147_BTC_SWAP_30D_2000U_TIER124_Backtest_Report.md
            backtest_output_v147_tier124/V147_BTC_SWAP_30D_2000U_TIER124_Trades.csv
            backtest_output_v147_tier124/V147_BTC_SWAP_30D_2000U_TIER124_Cycles.csv
            backtest_output_v147_tier124/V147_BTC_SWAP_30D_2000U_TIER124_DailyEquity.csv
            backtest_output_v147_tier124/metrics.json
          if-no-files-found: error
          retention-days: 14
