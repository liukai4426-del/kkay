name: Build KAYTRADE Intel Mac 1.5.4
on:
  push:
    branches: [codex/v1-5-4-update]
    paths:
      - '**.py'
      - OKXLocal.spec
      - RELEASE-1.5.4.md
      - .github/workflows/build-mac-v154.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v154-strategy-ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.5.4 runtime
        run: >-
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py
          v151_strategy_patch.py v152_model.py v152_strategy_patch.py v152_safety_patch.py
          v152_ui_busy_fix.py v152_backtest_core.py v153_model.py v153_runtime_patch.py
          v153_backtest_core.py v154_model.py v154_runtime_patch.py
          test_v154_strategy.py test_v154_ui_scroll.py
      - name: Run preserved execution regressions
        run: |
          python -m unittest -v test_engine test_candles
          python -m unittest -v test_v135_execution test_v135_safety2 test_v135_order_state
          python -m unittest -v test_v136_runtime test_v137_strategy test_v138_strategy
          python -m unittest -v test_v141_exit_limit test_v143_score_arbitration
          python -m unittest -v test_v146_ui_fix test_v147_strategy
          python -m unittest -v test_v150_strategy
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v152_ui_busy_fix
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v153_ui_scroll
      - name: Run V1.5.4 tests
        run: |
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_ui_scroll
      - name: Verify V1.5.4 production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import inspect
          import app
          import engine
          import v137_strategy_patch as v137
          import v138_strategy_patch as v138
          import v152_strategy_patch as v152_runtime
          import v153_runtime_patch as v153_runtime
          import v154_model as model
          import v154_runtime_patch as runtime
          spec=Path('OKXLocal.spec').read_text()
          assert model.VERSION == '1.5.4'
          assert model.THRESHOLD == 6.0
          assert model.ENTRY_WINDOW_MS == 60000
          assert model.FRONT_MIN_R == 1.5
          assert model.COST_MAX_R == 0.30
          assert engine.Engine._kaytrade_v154_applied
          assert app.App._kaytrade_v154_smooth_scroll_applied
          assert v138._submit_initial is runtime._submit_initial_market
          assert v137._v137_make_plan is runtime._v154_make_plan
          assert v152_runtime.model is model
          assert v153_runtime.model is model
          assert v153_runtime.VERSION == '1.5.4'
          submit=inspect.getsource(runtime._submit_initial_market)
          assert '"ordType": "market"' in submit and '"ordType": "limit"' not in submit
          assert 'v154_runtime_patch.py' in spec
          assert "CFBundleShortVersionString': '1.5.4'" in spec
          assert "CFBundleVersion': '154'" in spec
          print('PASS: V1.5.4 first-minute BOLL + MARKET entry + smooth hidden scrolling are wired')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.5.4 tests on Intel Mac
        run: |
          python -m py_compile v152_model.py v152_strategy_patch.py v152_safety_patch.py v152_ui_busy_fix.py v153_model.py v153_runtime_patch.py v154_model.py v154_runtime_patch.py test_v154_strategy.py test_v154_ui_scroll.py build_icon.py
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v152_ui_busy_fix
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v153_ui_scroll
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_ui_scroll
      - name: Create application icon
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.5.4'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.5.4.md installer/RELEASE-1.5.4.md
          printf 'PASS: V1.5.4 keeps the V1.5.3 BOLL strategy core; execution is limited to the first minute after a closed 5m BOLL signal; initial entry is MARKET with taker/slippage-aware budgeting; 1H ATR stop and full 2R TP remain; hidden wheel/trackpad scrolling is coalesced, and run-log history does not jump to bottom while being reviewed.\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.5.4 -srcfolder installer -ov -format UDZO KAYTRADE-1.5.4-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.5.4-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.5.4-Intel-test
          path: |
            KAYTRADE-1.5.4-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
