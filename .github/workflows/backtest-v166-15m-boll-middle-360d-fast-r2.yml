name: Backtest V1.6.6 15m BOLL Middle 360D Fast R2

on:
  push:
    branches: [research/v166-15m-boll-middle-360d-fast]
    paths:
      - run_v166_15m_boll_middle_360d_fast.py
      - run_v166_15m_boll_middle_360d_fast_r2.py
      - .github/workflows/backtest-v166-15m-boll-middle-360d-fast-r2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore 360D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-okx-btc-360d-end-20260914-market-v1

      - name: Materialize audited simulator
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

      - name: Compile and verify R2 research lock
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py run_v1544_180d_fixed.py \
            v152_model.py v153_model.py v154_model.py v160_model.py v161_model.py v162_model.py v163_model.py v164_model.py v165_model.py \
            run_v160_365d_2000u.py run_v165_1000d_2000u.py run_v166_entry_expansion_4way_360d.py \
            research_backtest_data_cache.py run_v166_15m_boll_middle_360d_fast.py run_v166_15m_boll_middle_360d_fast_r2.py
          python - <<'PY'
          import run_v166_15m_boll_middle_360d_fast as x
          import run_v166_15m_boll_middle_360d_fast_r2 as r2
          assert x.DAYS == 360
          assert x.BOLL_WINDOW_MS == 900000
          assert x.THRESHOLD == 6.0
          assert x.prod.RSI_MIN == 30.0 and x.prod.RSI_MAX == 70.0
          assert x.slow.base.BE_ENABLED is False
          assert r2.RESULT_NAME == 'result_15m_boll_middle_360d.json'
          print('PASS: 15m BOLL middle R2 lock; strategy variables unchanged')
          PY

      - name: Run corrected optimized 360D backtest
        run: time python run_v166_15m_boll_middle_360d_fast_r2.py

      - name: Verify corrected outputs and anomaly lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v166_15m_boll_middle_360d_fast_r2/result_15m_boll_middle_360d.json')
          d=json.loads(p.read_text())
          assert d['window']['days'] == 360
          assert d['changes']['boll_timeframe'] == '15m'
          assert d['changes']['middle_path'] == 'restored'
          assert d['unchanged']['score_threshold'] == 6.0
          assert d['unchanged']['4h'] == 'aligned required'
          assert d['unchanged']['macd'] == 'formal 5m improvement required'
          assert d['correction']['revision'] == 'R2'
          assert d['correction']['execution_window_bug_fixed'] is True
          assert d['correction']['strategy_variables_changed'] is False
          trades = int(d['metrics']['trades'])
          if trades <= 0:
              raise RuntimeError('ANOMALY: corrected Middle R2 still produced zero trades')
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.6-15M-BOLL-MIDDLE-360D-FAST-R2
          path: backtest_output_v166_15m_boll_middle_360d_fast_r2/
          if-no-files-found: error
          retention-days: 30
