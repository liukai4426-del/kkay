name: Retry V1.2.3 per-signal confluence scoring
on:
  push:
    branches:
      - codex/v1-2-3-scoring
    paths:
      - .github/workflows/v123-signal-confluence-retry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-2-3-scoring
      - name: Write 19-point scoring strategy
        shell: bash
        run: |
          cat > strategy.py <<'PYFILE'
          """V1.2.3 closed-candle scoring: per-signal multi-timeframe confluence, 19-point maximum."""
          import math
          from core import indicators


          def _period(rows, current, previous, buy):
              c, prev = rows[-1], rows[-2]
              kdj = (current['j'] <= 30 and current['cross_up']) if buy else (current['j'] >= 70 and current['cross_down'])
              ema = (prev['c'] <= previous['ema20'] and c['c'] > current['ema20']) if buy else (prev['c'] >= previous['ema20'] and c['c'] < current['ema20'])
              reversal = (c['c'] > c['o'] and c['c'] > prev['h']) if buy else (c['c'] < c['o'] and c['c'] < prev['l'])
              return dict(kdj=kdj, ema=ema, reversal=reversal, confirmed=kdj or ema or reversal)


          def _volume_boll_return(rows, current, buy, multiplier=1.3):
              """Confirm 15m Bollinger rejection using current volume versus prior 20 closed bars."""
              if len(rows) < 21:
                  return False, 0.0
              history=[]
              for row in rows[-21:-1]:
                  try:
                      value=float(row['v'])
                  except (KeyError, TypeError, ValueError):
                      return False, 0.0
                  if not math.isfinite(value) or value < 0:
                      return False, 0.0
                  history.append(value)
              try:
                  current_volume=float(rows[-1]['v'])
              except (KeyError, TypeError, ValueError):
                  return False, 0.0
              average=sum(history)/len(history)
              if not math.isfinite(current_volume) or current_volume < 0 or average <= 0:
                  return False, 0.0
              candle=rows[-1]
              returned=(candle['l'] <= current['lower'] and candle['c'] > current['lower']) if buy else (candle['h'] >= current['upper'] and candle['c'] < current['upper'])
              ratio=current_volume/average
              return returned and ratio >= multiplier, ratio


          def _ladder(five_ok, quarter_ok, hour_ok):
              """Each independent signal gets its own 5m/+1, 5m+15m/+2, 5m+15m+1H/+3 ladder."""
              if five_ok and quarter_ok and hour_ok:
                  return 3
              if five_ok and quarter_ok:
                  return 2
              if five_ok:
                  return 1
              return 0


          def _level(total):
              if total >= 15:
                  return '高共振信号'
              if total >= 11:
                  return '强信号'
              if total >= 8:
                  return '普通信号'
              return '未达开仓线'


          def signal(hour, quarter, five=None, threshold=8):
              five = quarter if five is None else five
              h, m, f = indicators(hour), indicators(quarter), indicators(five)
              ph, pm, pf = indicators(hour[:-1]), indicators(quarter[:-1]), indicators(five[:-1])
              hc, mc, fc = hour[-1], quarter[-1], five[-1]
              results = {}

              for side in ('做多', '做空'):
                  buy = side == '做多'
                  hf = _period(hour, h, ph, buy)
                  mf = _period(quarter, m, pm, buy)
                  ff = _period(five, f, pf, buy)

                  rsi5 = f['rsi'] <= 20 if buy else f['rsi'] >= 75
                  rsi15 = m['rsi'] <= 20 if buy else m['rsi'] >= 75
                  rsi1h = h['rsi'] <= 25 if buy else h['rsi'] >= 70
                  rsi_score = _ladder(rsi5, rsi15, rsi1h)

                  boll5 = fc['l'] <= f['lower'] if buy else fc['h'] >= f['upper']
                  boll15 = mc['l'] <= m['lower'] if buy else mc['h'] >= m['upper']
                  boll1h = hc['l'] <= h['lower'] if buy else hc['h'] >= h['upper']
                  boll_score = _ladder(boll5, boll15, boll1h)

                  kdj_score = _ladder(ff['kdj'], mf['kdj'], hf['kdj'])
                  ema_score = _ladder(ff['ema'], mf['ema'], hf['ema'])
                  reversal_score = _ladder(ff['reversal'], mf['reversal'], hf['reversal'])

                  boll_rsi = (mc['l'] <= m['lower'] and m['rsi'] < 30) if buy else (mc['h'] >= m['upper'] and m['rsi'] > 70)
                  volume_boll, volume_ratio = _volume_boll_return(quarter, m, buy)

                  strong_opposite = (
                      hc['c'] < h['ema200'] and h['ema20'] < h['ema50'] and h['down']
                  ) if buy else (
                      hc['c'] > h['ema200'] and h['ema20'] > h['ema50'] and h['up']
                  )

                  items = [
                      ('RSI 多周期共振（5m/15m/1H）', rsi_score, 3),
                      ('BOLL 多周期共振（5m/15m/1H）', boll_score, 3),
                      ('KDJ 多周期共振（5m/15m/1H）', kdj_score, 3),
                      ('EMA20 多周期共振（5m/15m/1H）', ema_score, 3),
                      ('反转K线多周期共振（5m/15m/1H）', reversal_score, 3),
                      ('15m RSI + BOLL 组合增强', 2 * int(boll_rsi), 2),
                      ('15m BOLL外破回归 + 成交量≥20均量×1.3', 2 * int(volume_boll), 2),
                      ('1H 强逆势惩罚', -3 * int(strong_opposite), 0),
                  ]
                  raw = sum(item[1] for item in items)
                  total = max(0, min(19, raw))
                  level = _level(total)
                  eligible = total >= threshold
                  reason = (f'{level} · 评分 {total}/19 达标；仍需执行风控检查' if eligible
                            else f'{level} · 评分 {total}/19，未达开仓阈值 {threshold:g}')
                  results[side] = dict(total=total, raw=raw, gate=True, eligible=eligible, level=level,
                                       items=items, reason=reason,
                                       confirmations={
                                           '5m': any((rsi5, boll5, ff['kdj'], ff['ema'], ff['reversal'])),
                                           '15m': any((rsi15, boll15, mf['kdj'], mf['ema'], mf['reversal'])),
                                           '1H': any((rsi1h, boll1h, hf['kdj'], hf['ema'], hf['reversal'])),
                                           'strong_opposite': strong_opposite,
                                           'volume_ratio_15m': volume_ratio,
                                           'signal_confluence': {
                                               'RSI': {'5m': rsi5, '15m': rsi15, '1H': rsi1h, 'score': rsi_score},
                                               'BOLL': {'5m': boll5, '15m': boll15, '1H': boll1h, 'score': boll_score},
                                               'KDJ': {'5m': ff['kdj'], '15m': mf['kdj'], '1H': hf['kdj'], 'score': kdj_score},
                                               'EMA20': {'5m': ff['ema'], '15m': mf['ema'], '1H': hf['ema'], 'score': ema_score},
                                               '反转K线': {'5m': ff['reversal'], '15m': mf['reversal'], '1H': hf['reversal'], 'score': reversal_score},
                                           },
                                       })

              qualified = [side for side, row in results.items() if row['eligible']]
              if len(qualified) == 1:
                  side = qualified[0]
              elif len(qualified) == 2 and results[qualified[0]]['total'] != results[qualified[1]]['total']:
                  side = max(qualified, key=lambda s: results[s]['total'])
              else:
                  side = '观望'
              why = results[side]['reason'] if side != '观望' else ' / '.join(s + ': ' + r['reason'] for s, r in results.items())
              return dict(h=h, m=m, f=f, side=side, why=why, scores=results, threshold=threshold)
          PYFILE
      - name: Patch engine UI tests and release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new))

          replace('engine.py', 'score_threshold:float=7', 'score_threshold:float=8')
          replace('engine.py', 'not 7<=self.score_threshold<=12', 'not 8<=self.score_threshold<=19')
          replace('engine.py', "raise Halt('评分阈值必须是7—12的整数')", "raise Halt('评分阈值必须是8—19的整数')")
          replace('engine.py', "self.settings.score_threshold if self.settings else 7", "self.settings.score_threshold if self.settings else 8")
          replace('engine.py', "f\"已提交逐仓FOK开仓请求（评分 {score['total']}/12），附带TP/SL；尚不代表成交或保护单生效\"",
                  "f\"已提交逐仓FOK开仓请求（{score.get('level','信号')} · 评分 {score['total']}/19），附带TP/SL；尚不代表成交或保护单生效\"")

          replace('app.py',
                  "                defaults.update({k:v for k,v in loaded.items() if k in defaults})\n            except Exception:",
                  "                defaults.update({k:v for k,v in loaded.items() if k in defaults})\n                if defaults.get('score_threshold') == 7:\n                    defaults['score_threshold'] = 8\n            except Exception:")
          replace('app.py', "'score_threshold':'自动开仓评分阈值 7—12（默认7）'", "'score_threshold':'自动开仓评分阈值 8—19（默认8）'")
          replace('app.py', "self.signal=tk.StringVar(value='V1.2.3 自然累计最高12分 · ≥7开仓 · 等待已收盘1小时/15分钟/5分钟K线')",
                  "self.signal=tk.StringVar(value='V1.2.3 最高19分 · ≥8开仓 · 8–10普通 / 11–14强 / 15+高共振')")
          replace('app.py', "self.score_vars[side]=tk.StringVar(value='— / 12')", "self.score_vars[side]=tk.StringVar(value='— / 19')")
          replace('app.py', "ttk.Progressbar(card,maximum=12,style=", "ttk.Progressbar(card,maximum=19,style=")
          replace('app.py',
                  "typed=simpledialog.askstring('启动全自动授权',summary+f'\\n自然累计最高12分；最终评分 ≥ {s.score_threshold:g}/12 即进入开仓风控；RSI不再是硬门槛，1H强逆势会扣分。",
                  "typed=simpledialog.askstring('启动全自动授权',summary+f'\\n最高19分；最终评分 ≥ {s.score_threshold:g}/19 才进入开仓风控。8–10普通 / 11–14强 / 15+高共振；1H强逆势 -3分。")
          replace('app.py', "self.score_vars[side].set(f\"{score['total']} / 12\")", "self.score_vars[side].set(f\"{score['total']} / 19\")")

          replace('desktop.py', "assert ui.fields['score_threshold'].get() == '7'", "assert ui.fields['score_threshold'].get() == '8'")
          replace('desktop.py', "assert ui.score_vars['做多'].get().endswith('/ 12')", "assert ui.score_vars['做多'].get().endswith('/ 19')")

          p=Path('test_v11.py'); text=p.read_text()
          start=text.index('class Scores(unittest.TestCase):')
          end=text.index('\nclass Network(unittest.TestCase):')
          scores='''class Scores(unittest.TestCase):
              def score(self, *, buy=True, full=False, strong_opposite=False, threshold=8):
                  if buy:
                      h=dict(rsi=24 if full else 50,lower=90,upper=110,ema200=90,ema20=100,ema50=95,down=False,up=False)
                      m=dict(rsi=19 if full else 50,lower=90,upper=110)
                      f=dict(rsi=19 if full else 50,lower=90,upper=110)
                      if strong_opposite: h.update(ema200=110,ema20=90,ema50=100,down=True)
                      low=89 if full else 99
                      hour=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=101,l=low,c=100)]
                      quarter=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=101,l=low,c=96)]
                      five=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=101,l=low,c=96)]
                  else:
                      h=dict(rsi=71 if full else 50,lower=90,upper=110,ema200=110,ema20=100,ema50=105,down=False,up=False)
                      m=dict(rsi=76 if full else 50,lower=90,upper=110)
                      f=dict(rsi=76 if full else 50,lower=90,upper=110)
                      if strong_opposite: h.update(ema200=90,ema20=110,ema50=100,up=True)
                      high=111 if full else 101
                      hour=[dict(o=100,h=101,l=99,c=100),dict(o=105,h=high,l=99,c=100)]
                      quarter=[dict(o=100,h=101,l=99,c=100),dict(o=105,h=high,l=99,c=104)]
                      five=[dict(o=100,h=101,l=99,c=100),dict(o=105,h=high,l=99,c=104)]
                  previous={}
                  indicators=[h,m,f,previous,previous,previous]
                  on=dict(kdj=full,ema=full,reversal=full,confirmed=full)
                  off=dict(kdj=False,ema=False,reversal=False,confirmed=False)
                  periods=[on,on,on,off,off,off] if buy else [off,off,off,on,on,on]
                  volumes=[(full,1.4),(False,.8)] if buy else [(False,.8),(full,1.4)]
                  with patch('strategy.indicators',side_effect=indicators), patch('strategy._period',side_effect=periods), patch('strategy._volume_boll_return',side_effect=volumes):
                      return signal(hour,quarter,five,threshold)

              def test_full_long_scores_nineteen(self):
                  r=self.score(full=True); self.assertEqual(r['scores']['做多']['total'],19); self.assertEqual(r['scores']['做多']['level'],'高共振信号'); self.assertEqual(r['side'],'做多')
              def test_full_short_scores_nineteen(self):
                  r=self.score(buy=False,full=True); self.assertEqual(r['scores']['做空']['total'],19); self.assertEqual(r['scores']['做空']['level'],'高共振信号'); self.assertEqual(r['side'],'做空')
              def test_each_independent_signal_gets_own_confluence_score(self):
                  items=dict((name,pts) for name,pts,_ in self.score(full=True)['scores']['做多']['items'])
                  for name in ('RSI 多周期共振（5m/15m/1H）','BOLL 多周期共振（5m/15m/1H）','KDJ 多周期共振（5m/15m/1H）','EMA20 多周期共振（5m/15m/1H）','反转K线多周期共振（5m/15m/1H）'):
                      self.assertEqual(items[name],3)
              def test_volume_boll_return_adds_two(self):
                  items=dict((name,pts) for name,pts,_ in self.score(full=True)['scores']['做多']['items'])
                  self.assertEqual(items['15m BOLL外破回归 + 成交量≥20均量×1.3'],2)
              def test_exact_eight_is_eligible_and_ordinary(self):
                  h=dict(rsi=24,lower=90,upper=110,ema200=90,ema20=100,ema50=95,down=False,up=False); m=dict(rsi=19,lower=90,upper=110); f=dict(rsi=19,lower=90,upper=110); p={}
                  hour=[dict(o=100,h=101,l=99,c=100),dict(o=100,h=101,l=89,c=100)]; quarter=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=101,l=89,c=96)]; five=list(quarter)
                  off=dict(kdj=False,ema=False,reversal=False,confirmed=False)
                  with patch('strategy.indicators',side_effect=[h,m,f,p,p,p]), patch('strategy._period',side_effect=[off]*6), patch('strategy._volume_boll_return',side_effect=[(False,1.0),(False,1.0)]): r=signal(hour,quarter,five,8)
                  row=r['scores']['做多']; self.assertEqual(row['total'],8); self.assertTrue(row['eligible']); self.assertEqual(row['level'],'普通信号')
              def test_seven_is_blocked(self):
                  h=dict(rsi=24,lower=90,upper=110,ema200=90,ema20=100,ema50=95,down=False,up=False); m=dict(rsi=19,lower=90,upper=110); f=dict(rsi=19,lower=90,upper=110); p={}
                  hour=[dict(o=100,h=101,l=99,c=100),dict(o=100,h=101,l=95,c=100)]; quarter=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=101,l=89,c=96)]; five=list(quarter)
                  off=dict(kdj=False,ema=False,reversal=False,confirmed=False)
                  with patch('strategy.indicators',side_effect=[h,m,f,p,p,p]), patch('strategy._period',side_effect=[off]*6), patch('strategy._volume_boll_return',side_effect=[(False,1.0),(False,1.0)]): r=signal(hour,quarter,five,8)
                  row=r['scores']['做多']; self.assertEqual(row['total'],7); self.assertFalse(row['eligible'])
              def test_signal_levels(self):
                  from strategy import _level
                  self.assertEqual((_level(8),_level(10)),('普通信号','普通信号')); self.assertEqual((_level(11),_level(14)),('强信号','强信号')); self.assertEqual((_level(15),_level(19)),('高共振信号','高共振信号'))
              def test_strong_opposite_penalty_is_minus_three(self):
                  r=self.score(full=True,strong_opposite=True); items=dict((name,pts) for name,pts,_ in r['scores']['做多']['items']); self.assertEqual(items['1H 强逆势惩罚'],-3); self.assertEqual(r['scores']['做多']['total'],16)
              def test_integer_points_and_bounds(self):
                  for buy in (True,False):
                      row=self.score(buy=buy,full=True)['scores']['做多' if buy else '做空']; self.assertGreaterEqual(row['total'],0); self.assertLessEqual(row['total'],19); self.assertTrue(all(isinstance(i[1],int) for i in row['items']))
              def test_defaults(self):
                  s=Settings(); self.assertEqual((s.score_threshold,s.stop_atr,s.reward_r),(8,1.0,1.5))
              def test_threshold_validation(self):
                  for n in (0,7,7.5,20):
                      with self.assertRaises(Halt): replace(Settings(),score_threshold=n).validate()
                  for n in (8,19): self.assertEqual(replace(Settings(),score_threshold=n).validate().score_threshold,n)
          '''
          import textwrap
          p.write_text(text[:start]+textwrap.dedent(scores)+text[end:])
          replace('test_v11.py', "self.e.market['scores']['做多']['total']=6", "self.e.market['scores']['做多']['total']=7")

          Path('RELEASE-1.2.3.md').write_text('''# OKX Local V1.2.3\n\n## Per-signal multi-timeframe confluence scoring\n\nEach independent signal now receives its own 5m/15m/1H confluence ladder. Positive maximum: 19. Default entry threshold: 8.\n\n- RSI confluence: max +3. Long thresholds: 5m <=20, 15m <=20, 1H <=25. Short: 5m >=75, 15m >=75, 1H >=70.\n- Bollinger outer-band touch confluence: max +3.\n- KDJ confluence: max +3.\n- EMA20 reclaim/loss confluence: max +3.\n- Reversal-candle confluence: max +3.\n- 15m RSI + Bollinger combination: +2.\n- 15m Bollinger rejection back inside + volume >=1.3x prior 20-bar average: +2.\n- Strong opposite 1H trend: -3.\n\nEach independent confluence ladder is replacement-style, not cumulative inside itself: 5m = +1; 5m+15m = +2; 5m+15m+1H = +3. Final score is clamped to 0-19 after the penalty.\n\nSignal bands: 0-7 no entry; 8-10 ordinary; 11-14 strong; 15-19 high-confluence. A score >= configured threshold (default 8) only enters the separate safety/risk checks.\n\n## ATR risk and safety\n\nSL remains based on latest closed 15m ATR, default 1.0x. TP remains default 1.5R. V1.2.2 candle/network/order/position/protection fail-closed safety, isolated margin, FOK entry and attached TP/SL are unchanged.\n\nA saved old threshold of 7 is migrated to 8 in the UI. CI is synthetic and does not validate profitability or real-account end-to-end execution. The app remains unsigned/not notarized.\n''')

          for path in ('.github/workflows/v123-signal-confluence-once.yml','.github/workflows/v123-signal-confluence-retry.yml'):
              p=Path(path)
              if p.exists(): p.unlink()
          PY
      - name: Run full core tests before commit
        run: python -m unittest -v test_engine test_v11 test_candles test_v122
      - name: Commit scoring revision
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "V1.2.3: per-signal confluence scoring, 8-point entry"
          git push
