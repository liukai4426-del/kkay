name: Backtest KAYTRADE V1.6.8 BOLL5 Overext010 + PEE4 365D 2000U

on:
  push:
    branches: [research/v168-boll5-overext010-pee4-365d]
    paths:
      - run_v168_boll5_overext010_pee4_365d.py
      - .github/workflows/backtest-v168-boll5-overext010-pee4-365d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'
      - name: Restore audited BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-365d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-360d-end-20260914-market-v1
            kaytrade-okx-btc-360d-
            kaytrade-okx-btc-
      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py
      - name: Preflight PEE4 audit
        run: |
          python -m py_compile research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py run_v166_entry_expansion_4way_360d.py run_v166_15m_boll_macd_adverse_only_360d_fast.py run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py research_backtest_data_cache.py run_v168_180d_backtest_r2.py run_v168_boll5_overext035_180d.py run_v168_boll5_overext035_pee3_mfe06_180d.py run_v168_boll5_overext010_pee4_365d.py
          python -m unittest -v test_v168_update
          python - <<'PY'
          import run_v168_boll5_overext010_pee4_365d as x
          x._patch()
          start,end=x.src.configure()
          x.verify(start,end)
          print('AUDIT PASS: 365D; PEE4 no score/no hourly stage; -0.6/-0.7/-0.8 tiers; 1H+15m direction; MFE>=0.60 disables; normal SL/TP priority')
          PY
      - name: Run PEE4 365D backtest
        run: time python run_v168_boll5_overext010_pee4_365d.py
      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v168_boll5_overext010_pee4_365d/result_v168_boll5_overext010_pee4_365d.json')
          d=json.loads(p.read_text())
          assert d['window']['days']==365
          s=d['strategy_lock']
          assert s['pee_version']=='4.0-tiered-boolean'
          assert s['pee_scoring'] is False and s['pee_time_factor'] is False
          assert s['pee_direction_timeframes']==['1H','15m']
          assert s['pee_mfe_cutoff_r']==0.60
          assert int(d['metrics']['trades'] or 0)>0
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.8-BOLL5-OVEREXT010-PEE4-365D-2000U
          path: backtest_output_v168_boll5_overext010_pee4_365d/
          if-no-files-found: error
          retention-days: 30
