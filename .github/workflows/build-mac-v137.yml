name: Build KAYTRADE Intel Mac 1.3.7 Strategy Update
on:
  push:
    branches: [codex/v1-3-7-strategy-update]
    paths:
      - engine.py
      - exchange.py
      - app.py
      - strategy.py
      - visual.py
      - desktop.py
      - OKXLocal.spec
      - v135_patch.py
      - v135_execution_patch.py
      - v135_flatten_noop_hotfix.py
      - v135_auto_entry_guard.py
      - v136_runtime.py
      - v136_entry_fix.py
      - v137_strategy_patch.py
      - v137_cancel_fix.py
      - v137_hard_gate_patch.py
      - test_v137_strategy.py
      - test_v137_cancel_fix.py
      - test_v137_hard_gate_patch.py
      - RELEASE-1.3.7.md
      - .github/workflows/build-mac-v137.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: strategy-and-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile strategy and runtime patches
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py desktop.py v135_patch.py v135_execution_patch.py v135_flatten_noop_hotfix.py v135_auto_entry_guard.py v136_runtime.py v136_entry_fix.py v137_strategy_patch.py v137_cancel_fix.py v137_hard_gate_patch.py test_v137_strategy.py test_v137_cancel_fix.py test_v137_hard_gate_patch.py
      - name: Run preserved execution safety tests
        run: |
          python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
      - name: Run preserved V1.3.7 tests
        run: python -m unittest -v test_v137_strategy test_v137_cancel_fix
      - name: Run layered hard-gate tests
        run: python -m unittest -v test_v137_hard_gate_patch
      - name: Verify V1.3.7 packaging wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v137_hard_gate_patch.py').read_text()
          assert 'v137_hard_gate_patch.py' in spec
          assert "CFBundleShortVersionString': '1.3.7'" in spec
          for token in ('V137_THRESHOLD = 4.0','FRONT_MIN_R = 1.3','ONE_MINUTE_STEP = 60_000','trigger_valid and macd5 and not trend1_opposite and space_ok',"expires=time.time()+60"):
              assert token in patch, token
          assert "candles('1Dutc')" not in patch
          print('PASS: V1.3.7 layered hard-gate wiring')
          PY

  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.3.7 tests on Intel Mac
        run: |
          python -m py_compile v137_strategy_patch.py v137_cancel_fix.py v137_hard_gate_patch.py test_v137_hard_gate_patch.py
          python -m unittest -v test_v137_hard_gate_patch
      - name: V1.3.7 UI source smoke test
        run: |
          python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch
          import v137_hard_gate_patch
          import app
          root=tk.Tk()
          try:
              with patch.object(app.App,'worker',lambda self: None):
                  ui=app.App(root,Path(tempfile.mkdtemp(prefix='kaytrade137-')))
                  root.update()
                  assert '1.3.7' in root.title()
                  assert ui.fields['score_threshold'].get() == '4.0'
                  widgets=[w for w in v137_hard_gate_patch._widgets(root) if isinstance(w,app.RoundedEntry) and getattr(w,'variable',None) is ui.fields['score_threshold']]
                  assert len(widgets)==1 and str(widgets[0].entry.cget('state'))=='disabled'
                  ui.finished.set(); ui.lock.close()
          finally:
              root.destroy()
          print('PASS: V1.3.7 UI fixed 4.0 threshold')
          PY
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.3.7'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.7.md installer/RELEASE-1.3.7.md
          printf 'PASS: V1.3.7 layered hard-gate tests + Intel build + UI smoke test\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.7 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.7-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.7-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.7-Intel-test
          path: |
            KAYTRADE-1.3.7-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
