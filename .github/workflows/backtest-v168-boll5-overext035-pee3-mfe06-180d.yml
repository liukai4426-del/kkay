name: Backtest KAYTRADE V1.6.8 BOLL5 Overext035 + PEE3 MFE06 180D 2000U

on:
  push:
    branches: [research/v168-boll5-overext035-pee3-mfe06-180d]
    paths:
      - run_v168_boll5_overext035_180d.py
      - run_v168_boll5_overext035_pee3_mfe06_180d.py
      - .github/workflows/backtest-v168-boll5-overext035-pee3-mfe06-180d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 180D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-180d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-180d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Preflight audit - compile, baseline lock, PEE3 lock
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            research_backtest_data_cache.py run_v168_180d_backtest_r2.py \
            run_v168_boll5_overext035_180d.py run_v168_boll5_overext035_pee3_mfe06_180d.py
          python -m unittest -v test_v168_update
          python - <<'PY'
          import run_v168_boll5_overext035_pee3_mfe06_180d as x
          start,end=x.configure()
          x.verify_lock(start,end)
          assert x.entry.OVEREXT_ATR_MULT == 0.35
          assert x.entry.OVEREXT_SCORE == 1.0
          assert x.MFE_CUTOFF_R == 0.60
          assert x.MONITOR_MAX_MS == 14400000
          assert x.base.BOLL_WINDOW_MS == 900000
          assert x.base.THRESHOLD == 6.0
          assert x.research.Simulator.process_exit is x._process_exit_pee3
          assert x._ORIGINAL_PROCESS_EXIT is x.base.proven._ORIG_EXIT
          assert x._decision(60000,-0.8,0.60,2,{},2.0,{}) is None
          assert x._decision(241*60000,-0.8,0.0,2,{},2.0,{}) is None
          print('AUDIT PASS: exact V1.6.8 R2 + BOLL5 overext035 + PEE3 first4h, permanent MFE>=0.60R cutoff, normal SL/TP priority')
          PY

      - name: Run audited 180D backtest
        run: time python run_v168_boll5_overext035_pee3_mfe06_180d.py

      - name: Verify result and audit payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v168_boll5_overext035_pee3_mfe06_180d/result_v168_boll5_overext035_pee3_mfe06_180d.json')
          d=json.loads(p.read_text())
          assert d['window']['days'] == 180
          s=d['strategy_lock']
          assert s['baseline'] == 'V1.6.8 Build1680 R2'
          assert s['boll_signal_lifetime_ms'] == 900000
          assert s['5m_boll_overextension_score'] == 1.0
          assert s['5m_boll_overextension_threshold_atr14'] == 0.35
          assert s['pee_monitor_max_hours'] == 4
          assert s['pee_mfe_cutoff_r'] == 0.60
          assert s['normal_sl_tp_priority'] is True
          assert s['adx'] is False and s['break_even'] is False
          a=d['preflight_audit']
          assert all(a.values())
          assert int(d['metrics']['trades'] or 0) > 0, 'ANOMALY: zero trades; do not trust result'
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.8-BOLL5-OVEREXT035-PEE3-MFE06-180D-2000U
          path: backtest_output_v168_boll5_overext035_pee3_mfe06_180d/
          if-no-files-found: error
          retention-days: 30
