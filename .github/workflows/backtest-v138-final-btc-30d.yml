name: Backtest KAYTRADE V1.3.8 Final BTC 30D 1000-2000U
on:
  push:
    branches: [research/v138-final-btc-30d-1000-2000u-backtest]
    paths:
      - research_v146_backtest.py
      - research_v138_final_3m_backtest.py
      - research_v138_final_30d_backtest.py
      - .github/workflows/backtest-v138-final-btc-30d.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research backtest
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v138_final_30d_backtest.py
      - name: Verify same V1.3.8 strategy and 30-day window
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('research_v138_final_3m_backtest.py').read_text()
          wrapper=Path('research_v138_final_30d_backtest.py').read_text()
          for token in ('FIRST_POSITION = 1_000.0','SECOND_POSITION = 2_000.0','LOSS_PAUSE_MS = 6 * 60 * 60 * 1000','front_r >= 1.3','trigger_ok and macd5 and hstate != "opposite" and space_ok'):
              assert token in base, token
          for token in ('START = END - timedelta(days=30)','v138.START = START','v138.base.START = START','first_signal_usdt": 1000.0','second_signal_usdt": 2000.0'):
              assert token in wrapper, token
          raw=base.split('raw = (',1)[1].split(')',1)[0]
          assert 'trigger' not in raw.lower()
          print('PASS: same final V1.3.8 strategy, rolling 30-day window')
          PY
      - name: Run final V1.3.8 BTC-USDT-SWAP 30-day backtest
        run: python research_v138_final_30d_backtest.py
      - name: Show result summary
        if: success()
        run: |
          cat backtest_output_v138_final_30d_1000_2000u/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v138_final_30d_1000_2000u/V138_FINAL_BTC_SWAP_30D_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAYTRADE-V138-FINAL-BTC-SWAP-30D-1000-2000U-BACKTEST
          path: |
            backtest_output_v138_final_30d_1000_2000u/V138_FINAL_BTC_SWAP_30D_Backtest_Report.md
            backtest_output_v138_final_30d_1000_2000u/V138_FINAL_BTC_SWAP_30D_Trades.csv
            backtest_output_v138_final_30d_1000_2000u/V138_FINAL_BTC_SWAP_30D_Cycles.csv
            backtest_output_v138_final_30d_1000_2000u/V138_FINAL_BTC_SWAP_30D_DailyEquity.csv
            backtest_output_v138_final_30d_1000_2000u/metrics.json
          if-no-files-found: error
          retention-days: 14
