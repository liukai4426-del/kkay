name: Apply KAYTRADE V1.3.5 Fixes
on:
  push:
    branches: [codex/v1-3-5-fixes]
    paths:
      - v135_fix.py
      - v135_fix_anchor.py
      - test_v135.py
      - RELEASE-1.3.5.md
      - .github/workflows/apply-v135.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-3-5-fixes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply V1.3.5 fixes
        run: |
          python v135_fix_anchor.py
          python v135_fix.py
      - name: Compile and test
        run: |
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py desktop.py
          python -m unittest -v test_engine test_candles test_v122 test_v132 test_v133 test_v134 test_v135
      - name: Verify V1.3.5 invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          from engine import Settings
          import strategy
          assert strategy.SCORE_MAX == 10.0 and strategy.NORMAL_THRESHOLD == 3.5
          Settings(capital=100,max_notional=1000,leverage=10,risk_usdt=80,risk_pct=80,daily_loss=100).validate()
          e=Path('engine.py').read_text(); x=Path('exchange.py').read_text(); a=Path('app.py').read_text(); d=Path('desktop.py').read_text()
          assert "s.capital*.05" not in e
          assert '单笔风险不得超过配置资金的5%' not in e
          for token in ("state['active']['order_id']=order_id","_lookup_parent_order","51603：OKX暂未找到该订单","recent_orders"):
              assert token in e or token in x, token
          assert "params['ordId']=str(order_id)" in x
          assert "self.code=str(code or '')" in x
          assert 'KAYTRADE 1.3.5' in a and "settings-v1.3.5.json" in a and "settings-v1.3.4.json" in a
          assert '1.3.5' in d
          print('V1.3.5 invariants OK')
          PY
      - name: Commit V1.3.5 source
        run: |
          git config user.name 'liukai4426-del'
          git config user.email 'liukai4426@gmail.com'
          git add engine.py exchange.py app.py desktop.py test_engine.py test_v134.py
          git diff --cached --quiet && exit 1
          git commit -m 'fix: V1.3.5 remove 5pct risk cap and reconcile OKX 51603'
          git push origin HEAD:codex/v1-3-5-fixes
