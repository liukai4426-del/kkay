name: Test V1.6.5 Demo Algo Family Degrade

on:
  push:
    branches: [hotfix/v165-demo-algo-family-degrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile hotfix
        run: python -m py_compile v165_algo_fallback_patch.py test_v165_algo_demo_degrade.py
      - name: Demo algo downgrade tests
        run: python -m unittest -v test_v165_algo_demo_degrade
      - name: Preserved V1.6.5 regressions
        run: |
          python -m unittest -v test_v165_execution
          python -m unittest -v test_v165_update
          python -m unittest -v test_v165_ui
          python -m unittest -v test_engine
