name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D 2000U 1R1R ATR1.5
on:
  push:
    branches: [research/v147-btc-30d-2000u-1r1r-atr15]
    paths:
      - research_v146_backtest.py
      - research_v147_1m_2000u_backtest.py
      - research_v147_1r1r_atr15_backtest.py
      - .github/workflows/backtest-v147-btc-30d-2000u-1r1r-atr15.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research scenario
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py research_v147_1r1r_atr15_backtest.py
      - name: Verify requested geometry and fixed comparison period
        run: |
          python - <<'PY'
          import research_v147_1r1r_atr15_backtest as s
          assert s.STOP_ATR == 1.5
          assert s.REWARD_R == 1.0
          assert s.v.CAPITAL == 2000.0
          assert s.START.isoformat() == '2026-08-13T07:40:00+00:00'
          assert s.END.isoformat() == '2026-09-12T07:40:00+00:00'
          print('PASS: 1:1 TP/SL, 15m ATR x1.5, same 30-day sample, 2000U profile')
          PY
      - name: Run V1.4.7 BTC 30-day 1R1R ATR1.5 backtest
        run: python research_v147_1r1r_atr15_backtest.py
      - name: Show result summary
        if: success()
        run: |
          cat backtest_output_v147_1r1r_atr15/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_1r1r_atr15/V147_BTC_SWAP_30D_2000U_1R1R_ATR15_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-2000U-1R1R-ATR15-BACKTEST
          path: |
            backtest_output_v147_1r1r_atr15/V147_BTC_SWAP_30D_2000U_1R1R_ATR15_Backtest_Report.md
            backtest_output_v147_1r1r_atr15/V147_BTC_SWAP_30D_2000U_1R1R_ATR15_Trades.csv
            backtest_output_v147_1r1r_atr15/V147_BTC_SWAP_30D_2000U_1R1R_ATR15_Cycles.csv
            backtest_output_v147_1r1r_atr15/V147_BTC_SWAP_30D_2000U_1R1R_ATR15_DailyEquity.csv
            backtest_output_v147_1r1r_atr15/metrics.json
          if-no-files-found: error
          retention-days: 14
