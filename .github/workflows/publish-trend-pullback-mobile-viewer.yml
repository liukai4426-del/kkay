name: Publish Trend Pullback Mobile Viewer

on:
  push:
    branches: [research/v170-trend-pullback-180d]
    paths:
      - publish_mobile_viewer.py
      - .github/workflows/publish-trend-pullback-mobile-viewer.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download base viewer artifact
        uses: actions/download-artifact@v4
        with:
          name: KAYTRADE-Trend-Pullback-180D-Viewer-V2
          path: source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35450415636

      - name: Build mobile responsive viewer
        run: |
          python publish_mobile_viewer.py
          node --check /tmp/viewer.js
          test -s publish/index.html

      - name: Publish static branch
        run: |
          cp publish/index.html /tmp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan viewer-mobile
          git rm -rf . || true
          cp /tmp/index.html index.html
          cat > README.md <<'EOF'
          # KAYTRADE Trend Pullback 180D Mobile Viewer
          Static browser viewer generated from the successful 180D backtest.
          EOF
          git add index.html README.md
          git commit -m "publish: Trend Pullback 180D mobile viewer"
          git push --force origin viewer-mobile
