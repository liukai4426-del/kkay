name: Dispatch V1.5.3 90D 1HATR 2R Verify
on:
  push:
    branches: [research/v153-btc-90d-1hatr-2r-dispatch]
    paths:
      - .github/workflows/dispatch-v153-90d-1hatr-2r.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 90-day verification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/backtest-v153-btc-90d.yml/dispatches \
            -d '{"ref":"research/v153-btc-90d-backtest"}'
          echo "dispatched"
