name: Build KAYTRADE Intel Mac 1.3.4
on:
  push:
    branches: [codex/v1-3-4-strategy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Test V1.3.4 and preserved safety
        run: |
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py desktop.py
          python -m unittest -v test_engine test_candles test_v122 test_v132 test_v133 test_v134
      - name: Verify V1.3.4 strategy and execution wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import strategy
          from engine import Settings
          assert strategy.SCORE_MAX == 10.0
          assert strategy.NORMAL_THRESHOLD == 3.5
          assert Settings().score_threshold == 3.5
          assert strategy._position_multiplier(3.5) == 1.0
          assert strategy._position_multiplier(5.0) == 1.5
          assert strategy._position_multiplier(7.0) == 2.0
          e=Path('engine.py').read_text(); a=Path('app.py').read_text(); c=Path('candles.py').read_text(); v=Path('visual.py').read_text()
          for token in ("reward_r:float=2.0","taker_fee_bps:float=5.0","amendPxOnTriggerType':'1'","tp1_sz","tp2_sz","self.x.candles('1Dutc')","position_multiplier"):
              assert token in e, token
          for token in ('KAYTRADE 1.3.4','风险设置','交易执行参数','交易计划','3.5–4.5=1×仓位','1D EMA5/10/20'):
              assert token in a, token
          assert "'1Dutc':86400000" in c
          assert 'class ScrollablePage' in v and 'class MetricTile' in v
          print('V1.3.4 wiring OK')
          PY
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: python verify_bundle.py
      - name: Packaged UI smoke test
        run: |
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$RUNNER_TEMP/kaytrade-smoke.txt"
          test -s "$RUNNER_TEMP/kaytrade-smoke.txt"
          cat "$RUNNER_TEMP/kaytrade-smoke.txt"
          codesign --verify --deep --strict dist/KAYTRADE.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.4.md installer/RELEASE-1.3.4.md
          cp "$RUNNER_TEMP/kaytrade-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.4 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.4-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.4-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.4-Intel-test
          path: |
            KAYTRADE-1.3.4-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
