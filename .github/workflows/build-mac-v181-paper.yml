name: Build KAYTRADE Intel Mac 1.8.1 Paper Build1811

on:
  push:
    branches: [feature/v181-auto-plan-paper]
  pull_request:
    branches: [release/v1.8.1-paper]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: python -m pip install 'websocket-client==1.8.0' 'certifi==2025.8.3'
      - name: Compile V1.8.1 Paper
        run: |
          python -m py_compile \
            desktop.py exchange.py engine.py app.py history.py \
            v172_ai_only_patch.py v180_ai_only_patch.py v181_paper_patch.py \
            kaytrade_mcp.py test_v172_ai_only.py test_v180_ai_only.py test_v181_paper.py
      - name: V1.7.1 maintenance regression
        run: python -m unittest -v test_v171_update
      - name: V1.7.2 AI-only regression
        run: python -m unittest -v test_v172_ai_only
      - name: V1.8 regression
        run: python -m unittest -v test_v180_ai_only
      - name: V1.8.1 paper tests
        run: python -m unittest -v test_v181_paper
      - name: Verify V1.8.1 paper-only semantic lock
        run: |
          python - <<'PY'
          import inspect
          import app
          import v165_model as model
          import v181_paper_patch as v181

          assert v181.VERSION == '1.8.1'
          assert v181.BUILD == '1811'
          assert v181.PAPER_ONLY is True
          assert model.STRATEGY_ENABLED is False
          assert app.Engine is v181.PaperEngineV181
          assert v181.PAPER_ENTRY_TTL_SEC == 3600
          assert str(v181.AI_MAX_LEVERAGE) == '20'
          assert str(v181.AI_MAX_NOTIONAL_USDT) == '3500'
          assert str(v181.AI_MAX_ESTIMATED_STOP_LOSS_USDT) == '100'
          source = inspect.getsource(v181.PaperEngineV181)
          assert '.post(' not in source
          assert 'cancel_paper_entry' in source
          assert 'amend_paper_entry' in source
          assert 'amend_paper_protection' in source
          assert 'paper_close_position' in source
          assert 'AUTO_CANCEL_60M' in source
          assert 'set_auto_execute_plans' in source
          assert 'publish_ai_plan' in source
          assert 'take_profit' in source and 'stop_loss' in source
          print('PASS V1.8.1 Build1811: paper-only auto AI-plan execution requires TP/SL')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0' 'websocket-client==1.8.0'
      - name: V1.8.1 paper tests
        run: python -m unittest -v test_v181_paper
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and V1.8.1 metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.8.1'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1811'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged V1.8.1 smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.8.1 Build1811 PAPER' "$TMPDIR_CHECK/smoke.txt"
          grep 'BTC quote is topmost' "$TMPDIR_CHECK/smoke.txt"
          grep 'automatic AI-plan paper execution requires TP/SL' "$TMPDIR_CHECK/smoke.txt"
          grep 'no OKX write path is exposed' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.8.1-PAPER.md installer/RELEASE-1.8.1-PAPER.md
          printf 'KAYTRADE V1.8.1 PAPER Build1811\nAI plan auto execution (user toggle) · mandatory TP/SL · two-tier paper execution · 60m auto-cancel.\n' > installer/RELEASE-1.8.1-PAPER.txt
          hdiutil create -volname 'KAYTRADE 1.8.1 PAPER' -srcfolder installer -ov -format UDZO KAYTRADE-1.8.1-PAPER-Intel-build1811.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.8.1-PAPER-Intel-build1811
          path: |
            KAYTRADE-1.8.1-PAPER-Intel-build1811.dmg
            installer/RELEASE-1.8.1-PAPER.md
            installer/RELEASE-1.8.1-PAPER.txt
          if-no-files-found: error
