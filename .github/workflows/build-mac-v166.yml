name: Build KAYTRADE Intel Mac 1.6.6 Build1660

on:
  push:
    branches: [feature/v166-ui-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.6.6 Build1660
        run: python -m py_compile v160_model.py v160_update_patch.py v161_model.py v161_update_patch.py v162_model.py v162_update_patch.py v163_model.py v163_update_patch.py v163_ui_patch.py v164_model.py v164_update_patch.py v164_ui_patch.py v165_model.py v165_update_patch.py v165_algo_fallback_patch.py v165_runtime_network_patch.py v165_sleep_resume_patch.py v165_keepawake_patch.py v165_ui_patch.py v165_15m_outer_patch.py v166_ui_patch.py test_v166_ui.py desktop.py
      - name: Preserved strategy/runtime regressions
        run: |
          python -m unittest -v test_engine
          python -m unittest -v test_candles
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v155_update
          python -m unittest -v \
            test_v156_build1561.V156Build1561Tests.test_fixed_loss_control_markers_cover_value_row_and_note \
            test_v156_build1561.V156Build1561Tests.test_identity_and_preserved_flags \
            test_v156_build1561.V156Build1561Tests.test_log_order_helper_is_newest_first_and_capped
          python -m unittest -v test_v160_update
          python -m unittest -v test_v161_update
          python -m unittest -v test_v162_update
          python -m unittest -v test_v163_update
          python -m unittest -v test_v163_ui
          python -m unittest -v test_v164_update
          python -m unittest -v test_v164_execution
          python -m unittest -v test_v164_ui
          python -m unittest -v test_v165_update
          python -m unittest -v test_v165_execution
          python -m unittest -v test_v165_runtime_network_state
          python -m unittest -v test_v165_sleep_resume
          python -m unittest -v test_v165_keepawake
          python -m unittest -v test_v165_ui
          python -m unittest -v test_v166_ui
      - name: Verify V1.6.6 is UI-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import app
          import v165_model as model
          import v166_ui_patch as ui166
          import v161_ui_status_patch as ui161
          spec=Path('OKXLocal.spec').read_text()
          desktop=Path('desktop.py').read_text()
          assert ui166.VERSION=='1.6.6' and ui166.BUILD=='1660'
          assert model.VERSION=='1.6.5'
          assert model.THRESHOLD==6.0
          assert model.ENTRY_WINDOW_MS==300000 and model.TIME_WINDOW_ENABLED is True
          assert model.VOLUME_HARD_GATE==1.20 and model.BOLL_OUTER_SCORE==2.50
          assert model.BOLL_TRIGGER_TIMEFRAME=='15m'
          labels=dict(ui161._STATUS_ITEMS)
          assert labels['boll']=='15m BOLL外轨触发'
          assert labels['signal_window']=='5m执行窗口'
          assert '115m' not in ui166._rewrite_text_v166('15m BOLL外轨信号')
          assert "CFBundleShortVersionString': '1.6.6'" in spec
          assert "CFBundleVersion': '1660'" in spec
          assert 'apply_v166_ui_patch' in desktop
          print('PASS V1.6.6 UI-only wiring; V1.6.5 trading semantics preserved')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - run: python -m unittest -v test_v165_update test_v165_execution test_v165_runtime_network_state test_v165_sleep_resume test_v165_keepawake test_v165_ui test_v166_ui
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.6.6'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1660'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged UI smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.6.6' "$TMPDIR_CHECK/smoke.txt"
          grep '115m display bug is blocked' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.6.6.md installer/RELEASE-1.6.6.md
          printf 'KAYTRADE V1.6.6 Build1660\nUI-only release: disambiguated opening-status labels, idempotent 15m BOLL text, inline run-log detail with title-column wrapping, wider timestamp/content gap and improved status-row spacing. V1.6.5 trading and risk semantics are unchanged.\n' > installer/RELEASE-1.6.6.txt
          hdiutil create -volname 'KAYTRADE 1.6.6' -srcfolder installer -ov -format UDZO KAYTRADE-1.6.6-Intel-build1660.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.6.6-Intel-build1660
          path: |
            KAYTRADE-1.6.6-Intel-build1660.dmg
            installer/RELEASE-1.6.6.md
            installer/RELEASE-1.6.6.txt
          if-no-files-found: error
