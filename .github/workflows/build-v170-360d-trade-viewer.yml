name: Build V1.7.0 360D Backtest Trade Viewer

on:
  push:
    branches: [research/v170-backtest-trade-viewer-360d]
    paths:
      - generate_v170_360d_trade_viewer.py
      - .github/workflows/build-v170-360d-trade-viewer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
      TRADE_VIEWER_SOURCE_DIR: source_artifact
      TRADE_VIEWER_OUT: backtest_trade_viewer_v170_360d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 360D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-360d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-360d-
            kaytrade-okx-btc-360d-
            kaytrade-okx-btc-
          save-always: true

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Download source backtest artifact from Run 35384662171
        uses: actions/download-artifact@v4
        with:
          name: KAYTRADE-V1.7.0-B1700-4H-NEUTRALPLUS1-SHORT-DRIFT020-360D-2000U
          path: source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35384662171

      - name: Compile viewer generator
        run: |
          python -m py_compile             research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py             run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py             run_v166_entry_expansion_4way_360d.py run_v166_15m_boll_macd_adverse_only_360d_fast.py             run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py research_backtest_data_cache.py             run_v168_180d_backtest_r2.py run_v168_boll5_overext035_180d.py             run_v168_boll5_overext035_pee3_mfe06_180d.py run_v168_boll5_overext010_pee4_365d.py             run_v170_4h_neutralplus1_short_drift020_360d.py generate_v170_360d_trade_viewer.py

      - name: Generate self-contained K-line trade viewer
        run: time python generate_v170_360d_trade_viewer.py

      - name: Verify generated viewer
        run: |
          test -s backtest_trade_viewer_v170_360d/KAYTRADE-V1.7.0-360D-Trade-Viewer.html
          grep -q 'KAYTRADE · 回测交易K线审查' backtest_trade_viewer_v170_360d/KAYTRADE-V1.7.0-360D-Trade-Viewer.html
          grep -q 'Run #35384662171' backtest_trade_viewer_v170_360d/KAYTRADE-V1.7.0-360D-Trade-Viewer.html
          python - <<'PY'
          from pathlib import Path
          p=Path('backtest_trade_viewer_v170_360d/KAYTRADE-V1.7.0-360D-Trade-Viewer.html')
          text=p.read_text(encoding='utf-8')
          print('VIEWER_BYTES',p.stat().st_size)
          assert p.stat().st_size > 1_000_000
          a=text.rfind('<script>'); b=text.rfind('</script>')
          assert a >= 0 and b > a
          Path('/tmp/kaytrade-viewer.js').write_text(text[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/kaytrade-viewer.js

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.7.0-360D-Trade-Viewer
          path: backtest_trade_viewer_v170_360d/
          if-no-files-found: error
          retention-days: 30
