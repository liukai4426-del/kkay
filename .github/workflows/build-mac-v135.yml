name: Build KAYTRADE Intel Mac 1.3.5 Runtime Stability
# V1.3.5 execution and legacy-51603 hotfix validation trigger.
on:
  push:
    branches: [codex/v1-3-5-runtime-stability]
    paths:
      - engine.py
      - exchange.py
      - app.py
      - desktop.py
      - v135_patch.py
      - v135_execution_patch.py
      - test_engine.py
      - test_v134.py
      - test_v135.py
      - test_v135_execution.py
      - test_v135_safety2.py
      - test_v135_order_state.py
      - test_v135_ack.py
      - test_v135_fills.py
      - test_v135_runtime_stability.py
      - RELEASE-1.3.5.md
      - .github/workflows/build-mac-v135.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: execution-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.3.5 execution path
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py desktop.py v135_patch.py v135_execution_patch.py test_v135_execution.py test_v135_safety2.py test_v135_order_state.py test_v135_ack.py test_v135_fills.py test_v135_runtime_stability.py
      - name: Run preserved strategy and execution safety tests
        run: python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
      - name: Run hardened order-state tests in isolated process
        run: python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
      - name: Verify V1.3.5 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import strategy
          assert strategy.SCORE_MAX == 10.0
          assert strategy.NORMAL_THRESHOLD == 3.5
          e=Path('engine.py').read_text(); x=Path('exchange.py').read_text(); p=Path('v135_patch.py').read_text(); xp=Path('v135_execution_patch.py').read_text(); d=Path('desktop.py').read_text()
          for token in ("state['active']['order_id']=order_id","_lookup_parent_order","51603：OKX暂未找到该订单"):
              assert token in e, token
          for token in ("self.code=str(code or '')", "self.write_rejected=bool", "OKX订单级错误码", "move_order_stop", "def fills"):
              assert token in x, token
          for token in ("STARTUP_BUFFER_SECONDS = 5.0","_remove_15m_setup_gate","DailyRiskStop","tpOrdPx'] = '-1'","_is_explicit_rejection","emergency_close_id","不进入51603订单核对"):
              assert token in p, token
          for token in ('UNKNOWN_WRITE_TIMEOUT = 60.0','SUBMIT_UNKNOWN','PARTIAL_EVIDENCE','FLATTEN_WAIT','CLOSE_SENT','CANCEL_SENT','CLOSING_EMERGENCY','emergency_close_blocked','def _acknowledge','def _matching_fills'):
              assert token in xp, token
          assert 'apply_v135_execution_patch' in d
          print('PASS: V1.3.5 strategy/order/API safety wiring')
          PY

  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run execution tests on Intel Mac
        run: |
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py desktop.py v135_patch.py v135_execution_patch.py test_v135_execution.py test_v135_safety2.py test_v135_order_state.py test_v135_ack.py test_v135_fills.py test_v135_runtime_stability.py
          python -m unittest -v test_engine test_candles test_v122 test_v132 test_v133 test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: python verify_bundle.py
      - name: Packaged UI smoke test
        run: |
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$RUNNER_TEMP/kaytrade-smoke.txt"
          test -s "$RUNNER_TEMP/kaytrade-smoke.txt"
          cat "$RUNNER_TEMP/kaytrade-smoke.txt"
          codesign --verify --deep --strict dist/KAYTRADE.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.5.md installer/RELEASE-1.3.5.md
          cp "$RUNNER_TEMP/kaytrade-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.5 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.5-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.5-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.5-Intel-test
          path: |
            KAYTRADE-1.3.5-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
