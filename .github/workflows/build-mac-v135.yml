name: Build KAYTRADE Intel Mac 1.3.5
# V1.3.5 legacy-51603 hotfix validation trigger.
on:
  push:
    branches: [codex/v1-3-5-fixes]
    paths:
      - engine.py
      - exchange.py
      - app.py
      - desktop.py
      - v135_patch.py
      - test_engine.py
      - test_v134.py
      - test_v135.py
      - RELEASE-1.3.5.md
      - .github/workflows/build-mac-v135.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Test V1.3.5 and preserved safety
        run: |
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py desktop.py v135_patch.py
          python -m unittest -v test_engine test_candles test_v122 test_v132 test_v133 test_v134 test_v135
      - name: Verify V1.3.5 fixes and preserved strategy
        run: |
          python - <<'PY'
          from pathlib import Path
          import strategy
          from engine import Settings
          assert strategy.SCORE_MAX == 10.0
          assert strategy.NORMAL_THRESHOLD == 3.5
          assert strategy._position_multiplier(3.5) == 1.0
          assert strategy._position_multiplier(5.0) == 1.5
          assert strategy._position_multiplier(7.0) == 2.0
          Settings(capital=100,max_notional=1000,leverage=10,risk_usdt=80,risk_pct=80,daily_loss=100).validate()
          e=Path('engine.py').read_text(); x=Path('exchange.py').read_text(); a=Path('app.py').read_text(); d=Path('desktop.py').read_text(); p=Path('v135_patch.py').read_text()
          assert "s.capital*.05" not in e
          assert '单笔风险不得超过配置资金的5%' not in e
          for token in ("state['active']['order_id']=order_id","_lookup_parent_order","51603：OKX暂未找到该订单"):
              assert token in e, token
          for token in ("params['ordId']=str(order_id)","def recent_orders", "self.code=str(code or '')"):
              assert token in x, token
          assert "def _is_legacy_51603_lock" in e
          assert "def _migrate_legacy_51603_lock" in e
          assert "V1.3.5已安全迁移旧51603故障锁" in e
          assert 'KAYTRADE 1.3.5' in a
          assert "settings-v1.3.5.json" in a and "settings-v1.3.4.json" in a
          assert '1.3.5' in d
          assert "STARTUP_BUFFER_SECONDS = 5.0" in p
          assert "OKX 50123" in p and "不进入51603订单核对" in p
          assert "'1Dutc':86400000" in Path('candles.py').read_text()
          print('V1.3.5 wiring OK')
          PY
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: python verify_bundle.py
      - name: Packaged UI smoke test
        run: |
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$RUNNER_TEMP/kaytrade-smoke.txt"
          test -s "$RUNNER_TEMP/kaytrade-smoke.txt"
          cat "$RUNNER_TEMP/kaytrade-smoke.txt"
          codesign --verify --deep --strict dist/KAYTRADE.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.5.md installer/RELEASE-1.3.5.md
          cp "$RUNNER_TEMP/kaytrade-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.5 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.5-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.5-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.5-Intel-test
          path: |
            KAYTRADE-1.3.5-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
