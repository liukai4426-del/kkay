name: Build KAYTRADE Intel Mac 1.5.4 Round2
on:
  push:
    branches: [codex/v1-5-4-record-card-boll-window-fix]
    paths:
      - '**.py'
      - OKXLocal.spec
      - RELEASE-1.5.4-FIX2.md
      - .github/workflows/build-mac-v154-round2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v154-round2-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.5.4 round-two repair
        run: >-
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py
          v151_strategy_patch.py v152_model.py v152_strategy_patch.py v152_safety_patch.py
          v152_ui_busy_fix.py v152_backtest_core.py v153_model.py v153_runtime_patch.py
          v153_backtest_core.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py
          v154_record_card_boll_fix.py test_v154_strategy.py test_v154_round2_runtime.py
          test_v154_record_card_tk.py
      - name: Run preserved strategy and safety regressions
        run: |
          python -m unittest -v test_engine test_candles
          python -m unittest -v test_v135_execution test_v135_safety2 test_v135_order_state
          python -m unittest -v test_v136_runtime test_v137_strategy test_v138_strategy
          python -m unittest -v test_v141_exit_limit test_v143_score_arbitration
          python -m unittest -v test_v146_ui_fix test_v147_strategy
          python -m unittest -v test_v150_strategy
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v152_ui_busy_fix
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v153_ui_scroll
      - name: Run final V1.5.4 round-two regressions
        run: |
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_ui_scroll
      - name: Verify production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import inspect
          import app
          import engine
          import v137_strategy_patch as v137
          import v138_strategy_patch as v138
          import v146_ui_log_polish_patch as v146
          import v154_model as model
          import v154_limit_log_fix as limit_fix
          import v154_record_card_boll_fix as final_fix
          spec=Path('OKXLocal.spec').read_text()
          assert model.VERSION == '1.5.4'
          assert model.THRESHOLD == 6.0
          assert model.ENTRY_WINDOW_MS == 0 and model.TIME_WINDOW_ENABLED is False
          assert model.FRONT_MIN_R == 1.5 and model.COST_MAX_R == 0.30
          assert engine.Engine._kaytrade_v154_record_boll_fix_applied
          assert v138._submit_initial is final_fix._submit_initial_limit_persistent
          assert v137._v137_make_plan is limit_fix._v154_limit_make_plan
          assert app.App.render_logs is v146._render_logs
          submit=inspect.getsource(final_fix._submit_initial_limit_persistent)
          assert '"ordType": "limit"' in submit and '"px": plan["px"]' in submit
          assert '_inside_first_minute' not in submit and '_window_timing' not in submit
          assert '【开仓必要】' in inspect.getsource(model._tag_score_items)
          assert '【辅助评分】' in inspect.getsource(model._tag_score_items)
          assert "v154_record_card_boll_fix.py" in spec
          assert "v154_log_layout_fix.py" not in spec
          assert "CFBundleShortVersionString': '1.5.4'" in spec
          assert "CFBundleVersion': '1542'" in spec
          print('PASS: V1.5.4 final wiring = persistent BOLL + LIMIT + original record card + score roles + clean execution card')
          PY
  build:
    name: intel-mac-package-round2
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.5.4 tests on Intel Mac
        run: |
          python -m py_compile v152_model.py v152_strategy_patch.py v152_safety_patch.py v152_ui_busy_fix.py v153_model.py v153_runtime_patch.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py v154_record_card_boll_fix.py test_v154_strategy.py test_v154_round2_runtime.py test_v154_record_card_tk.py build_icon.py
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_record_card_tk
      - name: Create application icon
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle and final repair hook
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.5.4'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1542'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create final V1.5.4 repair installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.5.4-FIX2.md installer/RELEASE-1.5.4-FIX2.md
          printf 'PASS: V1.5.4 Build 1542 restores the original rounded run-record card, removes the added Text log presentation, labels score-detail items as opening-required vs auxiliary, removes the fixed-cost card black gutter, keeps LIMIT entry, and removes the BOLL post-trigger one-minute wall-clock expiry while preserving safety blockers and fail-closed execution.\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.5.4-Fix2 -srcfolder installer -ov -format UDZO KAYTRADE-1.5.4-Intel-fix2.dmg
          shasum -a 256 KAYTRADE-1.5.4-Intel-fix2.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.5.4-Intel-fix2
          path: |
            KAYTRADE-1.5.4-Intel-fix2.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
