name: Apply KAYTRADE V1.3.3
on:
  push:
    branches:
      - codex/v1-3-3-ui-execution
    paths:
      - v133_flat_style_patch.py
      - .github/workflows/apply-v133.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply flat V1.3.2-style panel hotfix
        run: python v133_flat_style_patch.py
      - name: Verify visual-only scope
        run: |
          git diff --exit-code -- engine.py strategy.py exchange.py candles.py app.py desktop.py test_engine.py test_v133.py
          python -m py_compile visual.py app.py desktop.py engine.py strategy.py
          python - <<'PY'
          from pathlib import Path
          v=Path('visual.py').read_text()
          assert "fill='#05090c'" not in v
          assert "outline='#22323a'" not in v
          assert "tags='shine'" not in v
          assert "variant='tab_active' if i==index else 'tab'" in v
          assert 'class ScrollablePage' in v
          print('Visual-only scope and flat-panel invariants OK')
          PY
      - name: Commit V1.3.3 visual hotfix
        run: |
          git config user.name "liukai4426-del"
          git config user.email "liukai4426@gmail.com"
          git add visual.py RELEASE-1.3.3.md
          git commit -m "ui: restore V1.3.2 flat panels in V1.3.3"
          git push origin HEAD:codex/v1-3-3-ui-execution
