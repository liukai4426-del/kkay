name: Apply KAYTRADE V1.3.3
on:
  push:
    branches:
      - codex/v1-3-3-ui-execution
    paths:
      - v133_apply.py
      - .github/workflows/apply-v133.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply V1.3.3 UI and execution changes
        run: python v133_apply.py
      - name: Normalize generated test source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test_v133.py')
          p.write_text(p.read_text().replace(r'\n','\n'))
          PY
      - name: Syntax check
        run: python -m py_compile strategy.py engine.py exchange.py candles.py app.py visual.py desktop.py test_engine.py test_v133.py
      - name: Commit V1.3.3 source
        run: |
          git config user.name "liukai4426-del"
          git config user.email "liukai4426@gmail.com"
          git add engine.py visual.py app.py desktop.py test_engine.py test_v133.py RELEASE-1.3.3.md
          git commit -m "feat: KAYTRADE V1.3.3 glass UI and split exits"
          git push origin HEAD:codex/v1-3-3-ui-execution
