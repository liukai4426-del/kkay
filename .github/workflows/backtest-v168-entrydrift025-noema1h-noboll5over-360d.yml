name: Backtest KAYTRADE V1.6.8 EntryDrift025 NoEMA NoBOLL5Over 360D 2000U

on:
  push:
    branches: [research/v168-entrydrift025-noema1h-noboll5over-360d]
    paths:
      - run_v168_entrydrift025_noema1h_noboll5over_360d.py
      - .github/workflows/backtest-v168-entrydrift025-noema1h-noboll5over-360d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 360D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-360d-end-20260914-market-v1
          restore-keys: |
            kaytrade-okx-btc-360d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py

          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Preflight Entry Drift audit
        run: |
          python -m py_compile run_v168_entrydrift025_noema1h_noboll5over_360d.py run_v168_180d_backtest_r2.py
          python - <<'PY'
          import run_v168_entrydrift025_noema1h_noboll5over_360d as z
          start, end = z.configure()
          z.verify_lock(start, end)
          assert z.DRIFT_MAX_ATR5 == 0.25
          assert z.DRIFT_SCORE == 1.0
          assert z.base.THRESHOLD == 6.0
          assert z.HistoricalV168EntryDriftModel.FIVE_MINUTE_BOLL_ENABLED is False
          print('AUDIT PASS: Entry Drift <=0.25 ATR5 +1; NoEMA1H; NoBOLL5Over; 360D')
          PY

      - name: Run Entry Drift 360D backtest
        run: time python run_v168_entrydrift025_noema1h_noboll5over_360d.py

      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backtest_output_v168_entrydrift025_noema1h_noboll5over_360d/result_v168_entrydrift025_noema1h_noboll5over_360d.json')
          d = json.loads(p.read_text())
          assert d['window']['days'] == 360
          s = d['strategy_lock']
          assert s['1h_ema9_26_score_enabled'] is False
          assert s['1h_ema9_26_score'] == 0.0
          assert s['5m_boll_overextension_score_enabled'] is False
          assert s['5m_boll_overextension_score'] == 0.0
          assert s['entry_drift_score_enabled'] is True
          assert abs(float(s['entry_drift_threshold_atr5']) - 0.25) < 1e-12
          assert float(s['entry_drift_score']) == 1.0
          assert s['pee'] is False and s['break_even'] is False and s['adx'] is False
          assert int(d['metrics']['trades'] or 0) > 0
          print(json.dumps(d['metrics'], ensure_ascii=False, indent=2))
          print(json.dumps(d['entry_drift'], ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.8-ENTRYDRIFT025-NOEMA1H-NOBOLL5OVER-360D-2000U
          path: backtest_output_v168_entrydrift025_noema1h_noboll5over_360d/
          if-no-files-found: error
          retention-days: 30
