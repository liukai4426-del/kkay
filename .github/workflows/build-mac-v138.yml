name: Build KAYTRADE Intel Mac 1.3.8 1m Trigger
on:
  push:
    branches: [codex/v1-3-8-strategy-update]
    paths:
      - candles.py
      - engine.py
      - exchange.py
      - app.py
      - strategy.py
      - visual.py
      - desktop.py
      - OKXLocal.spec
      - v135_patch.py
      - v135_execution_patch.py
      - v135_flatten_noop_hotfix.py
      - v135_auto_entry_guard.py
      - v136_runtime.py
      - v136_entry_fix.py
      - v137_strategy_patch.py
      - v137_cancel_fix.py
      - v138_strategy_patch.py
      - test_v138_strategy.py
      - RELEASE-1.3.8.md
      - .github/workflows/build-mac-v138.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v138-strategy-and-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.3.8 runtime
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py v137_strategy_patch.py v137_cancel_fix.py v138_strategy_patch.py test_v138_strategy.py
      - name: Run preserved V1.3.6 and V1.3.7 safety tests
        run: |
          python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
          python -m unittest -v test_v137_strategy test_v137_cancel_fix
      - name: Run V1.3.8 tests in isolated process
        run: python -m unittest -v test_v138_strategy
      - name: Verify V1.3.8 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v138_strategy_patch.py').read_text()
          candles=Path('candles.py').read_text()
          v137=Path('v137_strategy_patch.py').read_text()
          assert 'v138_strategy_patch.py' in spec
          assert "CFBundleShortVersionString': '1.3.8'" in spec
          assert "'1m':60000" in candles
          assert 'card.configure(bg=app.PANEL_ALT)' in v137
          for token in ('V138_THRESHOLD=3.5','1<=self.leverage<=50','1m Trigger 0/1.0','5m 趋势（MACD量能+BOLL）','15m 趋势（MACD量能+BOLL）',"'ordType':'limit'"):
              assert token in patch, token
          print('PASS: V1.3.8 strategy/runtime wiring')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.3.8 tests on Intel Mac
        run: |
          python -m py_compile v138_strategy_patch.py test_v138_strategy.py
          python -m unittest -v test_v138_strategy
      - name: V1.3.8 UI source smoke test
        run: |
          python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch
          import v138_strategy_patch
          import app
          root=tk.Tk()
          try:
              with patch.object(app.App,'worker',lambda self: None):
                  ui=app.App(root,Path(tempfile.mkdtemp(prefix='kaytrade138-')))
                  root.update()
                  assert '1.3.8' in root.title()
                  assert ui.fields['score_threshold'].get()=='3.5'
                  labels=[]
                  for w in v138_strategy_patch._widgets(root):
                      try:labels.append(str(w.cget('text') or ''))
                      except Exception:pass
                  assert '逐仓杠杆 1—50倍' in labels
                  from engine import Settings
                  Settings(leverage=50,score_threshold=3.5,max_notional=100).validate()
                  ui.finished.set(); ui.lock.close()
          finally:
              root.destroy()
          print('PASS: V1.3.8 UI title + 1-50x leverage + fixed 3.5 threshold')
          PY
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.3.8'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.8.md installer/RELEASE-1.3.8.md
          printf 'PASS: V1.3.8 strategy tests + Intel build + UI source smoke test\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.8 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.8-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.8-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.8-Intel-test
          path: |
            KAYTRADE-1.3.8-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
