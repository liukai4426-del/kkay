name: Backtest KAYTRADE V1.3.8 Final BTC 92D ATR Matrix

on:
  push:
    branches:
      - research/v138-final-btc-92d-entry5-atr-matrix
    paths:
      - research_v138_final_92d_atr_matrix.py
      - .github/workflows/backtest-v138-final-btc-92d-entry5-atr-matrix.yml
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: atr15_x1_0
            atr_mode: 15m
            atr_mult: '1.0'
          - id: atr1h_x0_5
            atr_mode: 1H
            atr_mult: '0.5'
          - id: atr1h_x0_6
            atr_mode: 1H
            atr_mult: '0.6'
          - id: atr1h_x0_7
            atr_mode: 1H
            atr_mult: '0.7'
          - id: atr1h_x0_8
            atr_mode: 1H
            atr_mult: '0.8'
          - id: atr1h_x1_0
            atr_mode: 1H
            atr_mult: '1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research backtest
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v138_final_30d_backtest.py research_v138_final_30d_entry5_backtest.py research_v138_final_30d_entry5_single_signal_backtest.py research_v138_final_92d_atr_matrix.py
      - name: Verify fixed matrix rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research_v138_final_92d_atr_matrix.py').read_text()
          base=Path('research_v138_final_3m_backtest.py').read_text()
          assert '2026, 6, 12, 10, 57' in s and '2026, 9, 12, 10, 57' in s
          assert 'single.single_signal_tier' in s
          assert 'execution_atr = source * ATR_MULT' in s
          assert 'TP = 2R' in s
          assert 'position_cap_usdt' in s and '1000.0' in s
          assert 'front_space_gate_atr_timeframe' in s and '15m_baseline_unchanged' in s
          for token in ('front_r >= 1.3','trigger_ok and macd5 and hstate != "opposite" and space_ok','LOSS_PAUSE_MS = 6 * 60 * 60 * 1000'):
              assert token in base, token
          print('PASS: fixed 92d matrix; >=5 single-signal; no add-on; TP=2R; 3-loss 6h pause preserved')
          PY
      - name: Run backtest
        env:
          ATR_MODE: ${{ matrix.atr_mode }}
          ATR_MULT: ${{ matrix.atr_mult }}
          MATRIX_ID: ${{ matrix.id }}
        run: python research_v138_final_92d_atr_matrix.py
      - name: Show summary
        run: |
          cat backtest_output_v138_final_92d_atr_matrix_${{ matrix.id }}/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v138_final_92d_atr_matrix_${{ matrix.id }}/V138_FINAL_BTC_SWAP_92D_ATR_MATRIX_${{ matrix.id }}_Backtest_Report.md
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V138-92D-ATR-MATRIX-${{ matrix.id }}
          path: backtest_output_v138_final_92d_atr_matrix_${{ matrix.id }}/
          retention-days: 14
