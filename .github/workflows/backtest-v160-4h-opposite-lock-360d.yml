name: Backtest KAYTRADE V1.6.0 4H Opposite Lock 360D

on:
  push:
    branches: [research/v160-4h-opposite-lock-360d]
    paths:
      - research_v160_4h_opposite_lock_model.py
      - run_v160_4h_opposite_360d_2000u.py
      - .github/workflows/backtest-v160-4h-opposite-lock-360d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: v160-4h-opposite-lock-360d
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore reusable 360D market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/kaytrade-360d-20260914-1627
          key: kaytrade-btc-usdt-swap-360d-20250919-20260914-v1

      - name: Materialize audited historical simulator
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

      - name: Compile and verify V1.6.0 + 4H opposite Hard Lock
        run: |
          python -m py_compile \
            research_v146_backtest.py \
            research_v1544_cache_patch.py \
            research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py \
            v152_model.py v153_model.py v154_model.py v160_model.py \
            research_v160_4h_opposite_lock_model.py \
            v154_build1544_patch.py \
            run_v160_365d_2000u.py run_v160_4h_opposite_360d_2000u.py
          python - <<'PY'
          import run_v160_4h_opposite_360d_2000u as bt
          start, end = bt._configure()
          bt._verify_lock()
          assert bt.DAYS == 360
          assert bt.CAPITAL == 2000.0
          assert bt.BASE_POSITION_NOTIONAL == 2000.0
          assert bt.production.THRESHOLD == 6.0
          assert bt.production.SCORE_MAX == 10.0
          assert bt.production.VERSION == '1.6.0-research-4h-opposite-lock'
          print('PASS: V1.6.0 + 4H opposite Hard Lock verified')
          print('WINDOW', start.isoformat(), end.isoformat())
          PY

      - name: Run optimized 360-day backtest
        env:
          KAYTRADE_MARKET_CACHE_DIR: .cache/kaytrade-360d-20260914-1627
        run: time python run_v160_4h_opposite_360d_2000u.py

      - name: Verify result files
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out = Path('backtest_output_v160_4h_opposite_360d_2000u')
          m = json.loads((out/'metrics_360d.json').read_text())
          rows = list(csv.DictReader((out/'trades_360d.csv').open())) if (out/'trades_360d.csv').stat().st_size else []
          assert m['release'] == '1.6.0-research-4h-opposite-lock'
          assert m['days'] == 360
          assert m['capital'] == 2000.0
          assert m['base_position_notional_usdt'] == 2000.0
          assert m['outer_position_notional_cap_usdt'] == 4000.0
          assert m['middle_position_multiplier'] == 1.0
          assert m['outer_position_multiplier'] == 2.0
          assert m['hard_lock_4h_opposite'] is True
          assert m['score_4h_aligned'] == 1.0
          assert m['score_4h_neutral'] == 0.0
          assert m['score_4h_opposite'] == 0.0
          assert m['score_5m_macd_improving'] == 1.0
          assert m['middle_macd_required'] is True
          assert m['score_threshold'] == 6.0
          assert m['score_max'] == 10.0
          assert len(rows) == m['trades']
          print('RESULT_METRICS_JSON')
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V160-4H-Opposite-Lock-360D-2000U
          path: backtest_output_v160_4h_opposite_360d_2000u/
          if-no-files-found: error
          retention-days: 30
