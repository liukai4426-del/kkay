name: Backtest KAYTRADE V1.6.8 BOLL5 Overext035 NoEMA1H ConditionalRR 180D 2000U

on:
  push:
    branches: [research/v168-boll5-overext035-noema1h-rr1-180d]
    paths:
      - run_v168_boll5_overext035_180d.py
      - run_v168_boll5_overext035_noema1h_180d.py
      - run_v168_boll5_overext035_noema1h_rr1_180d.py
      - .github/workflows/backtest-v168-boll5-overext035-noema1h-rr1-180d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 180D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-180d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-180d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Preflight audit - compile, replacement score, conditional RR lock
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            research_backtest_data_cache.py run_v168_180d_backtest_r2.py \
            run_v168_boll5_overext035_180d.py run_v168_boll5_overext035_noema1h_180d.py \
            run_v168_boll5_overext035_noema1h_rr1_180d.py
          python -m unittest -v test_v168_update
          python - <<'PY'
          import run_v168_boll5_overext035_noema1h_rr1_180d as x
          x.install()
          x.verify_lock()
          assert x.src.prev.OVEREXT_ATR_MULT == 0.35
          assert x.src.prev.OVEREXT_SCORE == 1.0
          assert x.src.prev.base.THRESHOLD == 6.0
          assert x.src.prev.base.REWARD_R == 2.0
          print('AUDIT PASS: EMA1H +1 removed; BOLL5 overext035 +1; triggered orders RR1, others RR2')
          PY

      - name: Run audited 180D conditional-RR backtest
        run: time python run_v168_boll5_overext035_noema1h_rr1_180d.py

      - name: Verify result payload
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('backtest_output_v168_boll5_overext035_noema1h_rr1_180d')
          d=json.loads((root/'result_v168_boll5_overext035_noema1h_rr1_180d.json').read_text())
          assert d['window']['days'] == 180
          s=d['strategy_lock']
          assert s['1h_ema9_26_score_enabled'] is False
          assert s['5m_boll_overextension_score'] == 1.0
          assert s['5m_boll_overextension_threshold_atr14'] == 0.35
          assert s['conditional_rr']['target_when_triggered'] == '1R'
          assert s['conditional_rr']['target_otherwise'] == '2R'
          rows=list(csv.DictReader((root/'trades_v168_boll5_overext035_noema1h_rr1_180d.csv').open()))
          assert rows, 'ANOMALY: zero trades'
          trig=[r for r in rows if str(r.get('boll5_overext035_rr1_triggered','')).lower() in ('true','1')]
          non=[r for r in rows if str(r.get('boll5_overext035_rr1_triggered','')).lower() not in ('true','1')]
          for r in trig:
              assert abs(float(r['risk_reward_ratio'])-1.0) < 1e-9
          for r in non:
              if r.get('risk_reward_ratio') not in (None,''):
                  assert abs(float(r['risk_reward_ratio'])-2.0) < 1e-9
          print(json.dumps({'trades':len(rows),'conditional_rr1_trades':len(trig),'baseline_rr2_trades':len(non),'metrics':d['metrics']},ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.8-BOLL5-OVEREXT035-NOEMA1H-CONDITIONAL-RR-180D-2000U
          path: backtest_output_v168_boll5_overext035_noema1h_rr1_180d/
          if-no-files-found: error
          retention-days: 30
