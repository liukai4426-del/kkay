name: Build KAYTRADE Intel Mac 2.0.0 Dual OKX Build2000

on:
  push:
    branches: [feature/v190-dual-okx]
  pull_request:
    branches: [release/v2.0.0-dual-okx]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: python -m pip install 'websocket-client==1.8.0' 'certifi==2025.8.3'
      - name: Compile V2.0.0
        run: |
          python -m py_compile             desktop.py exchange.py engine.py app.py history.py visual.py             v172_ai_only_patch.py v180_ai_only_patch.py v183_okx_demo_patch.py             v184_ui_patch.py v190_dual_env_patch.py kaytrade_mcp.py             test_v183_okx_demo.py test_v190_dual_env.py
      - name: V1.8.4 execution regression
        run: python -m unittest -v test_v183_okx_demo
      - name: V2.0.0 dual environment tests
        run: python -m unittest -v test_v190_dual_env
      - name: Verify V2.0.0 semantics
        run: |
          python - <<'PY'
          import inspect
          import desktop
          import app
          import exchange
          import v165_model as model
          import v190_dual_env_patch as v190

          assert v190.VERSION == '2.0.0'
          assert v190.BUILD == '2000'
          assert model.VERSION == '2.0.0'
          assert model.BUILD == '2000'
          assert app.Engine is v190.OKXDualExecutionEngineV190

          src = inspect.getsource(v190.OKXDualExecutionEngineV190)
          assert 'okx_live_execution' in inspect.getsource(v190._state_key)
          assert 'LIVE写权限未授权' in src
          assert 'auto_execute_plans' in src
          assert 'AI方案不得指定 Demo/Live' in src

          transport = inspect.getsource(exchange._assert_limit_only_write)
          assert exchange._LIMIT_ONLY_SENTINEL_FIELDS == {
              'tpOrdPx', 'slOrdPx', 'newTpOrdPx', 'newSlOrdPx'
          }
          assert 'ordType' in transport
          print('PASS V2.0.0 Build2000 dual environment separation + LIMIT-only transport')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0' 'websocket-client==1.8.0'
      - name: V2.0.0 tests
        run: python -m unittest -v test_v190_dual_env
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '2.0.0'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '2000'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged V2.0.0 smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V2.0.0 Build2000 DUAL OKX LIMIT ONLY' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-2.0.0-DUAL-OKX.md installer/RELEASE-2.0.0-DUAL-OKX.md
          printf 'KAYTRADE V2.0.0 DUAL OKX Build2000\nDemo/Live isolated · Live AUTO OFF on connect · AI cannot select environment · LIMIT ONLY.\n' > installer/RELEASE-2.0.0-DUAL-OKX.txt
          hdiutil create -volname 'KAYTRADE 2.0.0 DUAL OKX' -srcfolder installer -ov -format UDZO KAYTRADE-2.0.0-DUAL-OKX-Intel-build2000.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-2.0.0-DUAL-OKX-Intel-build2000
          path: |
            KAYTRADE-2.0.0-DUAL-OKX-Intel-build2000.dmg
            installer/RELEASE-2.0.0-DUAL-OKX.md
            installer/RELEASE-2.0.0-DUAL-OKX.txt
          if-no-files-found: error
