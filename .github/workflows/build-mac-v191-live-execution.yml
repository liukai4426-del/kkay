name: Build KAYTRADE Intel Mac 1.9.1 Live Execution Build1911

on:
  push:
    branches: [feature/v191-live-execution-market-protection]
  pull_request:
    branches: [release/v1.9.1-live-execution]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: python -m pip install 'websocket-client==1.8.0' 'certifi==2025.8.3'
      - name: Compile V1.9.1
        run: |
          python -m py_compile \
            desktop.py exchange.py engine.py app.py history.py visual.py \
            v172_ai_only_patch.py v180_ai_only_patch.py v183_okx_demo_patch.py \
            v184_ui_patch.py v190_dual_env_patch.py kaytrade_mcp.py \
            test_v191_live_execution.py
      - name: Store concurrency regression
        run: python -m unittest -v test_engine.StoreTests
      - name: V1.9.1 LIVE execution regressions
        run: python -m unittest -v test_v191_live_execution
      - name: Verify V1.9.1 safety contract
        run: |
          python - <<'PY'
          import inspect
          import app
          import v165_model as model
          import v190_dual_env_patch as v191

          assert v191.VERSION == '1.9.1'
          assert v191.BUILD == '1911'
          assert model.VERSION == '1.9.1'
          assert model.BUILD == '1911'
          assert v191.PAPER_RUNTIME_PRESENT is False
          assert v191.LIMIT_ONLY is False
          assert v191.ENV_META['live']['mode'] == 'OKX_LIVE_EXECUTION'

          live = inspect.getsource(v191.LiveReviewEngineV190)
          assert 'set_writes_enabled(True)' in live
          assert 'set_writes_enabled(False)' in live
          assert '不得有提币权限' in live
          assert 'market_protection' in live

          wrapper = inspect.getsource(v191.LiveReadOnlyExchange)
          assert 'LIVE写入锁关闭' in wrapper

          print('PASS V1.9.1 guarded LIVE execution contract')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0' 'websocket-client==1.8.0'
      - name: V1.9.1 tests
        run: python -m unittest -v test_v191_live_execution
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.9.1'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1911'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged V1.9.1 smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.9.1 Build1911 LIVE EXECUTION' "$TMPDIR_CHECK/smoke.txt"
          grep 'trigger-market protections' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.9.1-LIVE-EXECUTION.md installer/RELEASE-1.9.1-LIVE-EXECUTION.md
          printf 'KAYTRADE V1.9.1 Build1911\nDEMO/LIVE isolated AI execution · LIMIT parent orders · trigger-market TP/SL.\n' > installer/RELEASE-1.9.1-LIVE-EXECUTION.txt
          hdiutil create -volname 'KAYTRADE 1.9.1 LIVE EXEC' -srcfolder installer -ov -format UDZO KAYTRADE-1.9.1-LIVE-EXEC-Intel-build1911.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.9.1-LIVE-EXEC-Intel-build1911
          path: |
            KAYTRADE-1.9.1-LIVE-EXEC-Intel-build1911.dmg
            installer/RELEASE-1.9.1-LIVE-EXECUTION.md
            installer/RELEASE-1.9.1-LIVE-EXECUTION.txt
          if-no-files-found: error
          retention-days: 14
