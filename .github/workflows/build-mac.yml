name: Build Intel Mac App 1.1
on:
  push:
    branches:
      - codex/intel-mac-app
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3'
      - name: Test order engine and V1.1 scoring/network with fake exchange
        run: python -m unittest -v test_engine test_v11
      - name: Build bundled Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Check macOS compatibility metadata
        run: python verify_bundle.py
      - name: Test packaged UI without network or orders
        run: |
          dist/OKXLocal.app/Contents/MacOS/OKXLocal --smoke-test "$RUNNER_TEMP/okx-smoke.txt"
          test -s "$RUNNER_TEMP/okx-smoke.txt"
          cat "$RUNNER_TEMP/okx-smoke.txt"
          codesign --verify --deep --strict dist/OKXLocal.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create installer disk image
        run: |
          mkdir -p installer
          ditto dist/OKXLocal.app installer/OKXLocal.app
          cp INSTALL-中文.md installer/INSTALL-中文.md
          cp RELEASE-1.1.md installer/RELEASE-1.1.md
          cp "$RUNNER_TEMP/okx-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname OKXLocal-1.1 -srcfolder installer -ov -format UDZO OKXLocal-1.1-Intel-test.dmg
          shasum -a 256 OKXLocal-1.1-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OKXLocal-1.1-Intel-test
          path: |
            OKXLocal-1.1-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
