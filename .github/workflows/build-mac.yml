name: Build Intel Mac App 1.3 Layered Structure Strategy
on:
  push:
    branches:
      - codex/v1-3-strategy
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Create application icon
        run: python build_icon.py
      - name: Test V1.3 layered scoring, structure zones, limit and partial-fill safety, China-day 3-loss guard, network and stability guards
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Build bundled Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Check macOS compatibility metadata
        run: python verify_bundle.py
      - name: Test packaged UI without network or orders
        run: |
          dist/OKXLocal.app/Contents/MacOS/OKXLocal --smoke-test "$RUNNER_TEMP/okx-smoke.txt"
          test -s "$RUNNER_TEMP/okx-smoke.txt"
          cat "$RUNNER_TEMP/okx-smoke.txt"
          codesign --verify --deep --strict dist/OKXLocal.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create installer disk image
        run: |
          mkdir -p installer
          ditto dist/OKXLocal.app installer/OKXLocal.app
          cp RELEASE-1.2.md installer/RELEASE-1.2.md
          cp RELEASE-1.2.1.md installer/RELEASE-1.2.1.md
          cp RELEASE-1.2.2.md installer/RELEASE-1.2.2.md
          cp RELEASE-1.2.3.md installer/RELEASE-1.2.3.md
          cp RELEASE-1.3.md installer/RELEASE-1.3.md
          cp "$RUNNER_TEMP/okx-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname OKXLocal-1.3 -srcfolder installer -ov -format UDZO OKXLocal-1.3-Intel-test.dmg
          shasum -a 256 OKXLocal-1.3-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OKXLocal-1.3-Intel-test
          path: |
            OKXLocal-1.3-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
