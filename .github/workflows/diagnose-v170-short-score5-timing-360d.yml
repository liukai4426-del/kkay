name: Diagnose V1.7.0 Short Score5 Timing 360D

on:
  push:
    branches: [research/v170-4h-neutralplus1-short-drift020-360d]
    paths:
      - run_v170_short_score5_timing_diagnostic_360d.py
      - .github/workflows/diagnose-v170-short-score5-timing-360d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 360D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-360d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-360d-
            kaytrade-okx-btc-360d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Compile and preflight diagnostic
        run: |
          python -m py_compile             research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py             run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py             run_v166_entry_expansion_4way_360d.py run_v166_15m_boll_macd_adverse_only_360d_fast.py             run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py research_backtest_data_cache.py             run_v168_180d_backtest_r2.py run_v168_boll5_overext035_180d.py             run_v168_boll5_overext035_pee3_mfe06_180d.py run_v168_boll5_overext010_pee4_365d.py             run_v170_4h_neutralplus1_short_drift020_360d.py run_v170_short_score5_timing_diagnostic_360d.py
          python - <<'PY'
          import run_v170_short_score5_timing_diagnostic_360d as d
          import run_v170_4h_neutralplus1_short_drift020_360d as x
          x._patch()
          start,end=x.src.configure()
          x.verify(start,end)
          assert (end-start).days == 360
          assert x.src.base.THRESHOLD == 6.0
          assert abs(x.SHORT_ENTRY_DRIFT_MAX_ATR5-0.20) < 1e-12
          print('AUDIT PASS: score5 diagnostic uses exact V1.7 baseline and signed Short Drift 0.20')
          PY

      - name: Run 360D score5 timing diagnostic
        run: time python run_v170_short_score5_timing_diagnostic_360d.py

      - name: Verify diagnostic payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v170_short_score5_timing_diagnostic_360d/result_v170_short_score5_timing_diagnostic_360d.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['window']['days'] == 360
          assert d['baseline_trade_count'] > 0
          assert 'pattern_opportunities' in d['trace']
          assert 'counterfactual_summary' in d
          print(json.dumps({
            'trace': d['trace'],
            'counterfactual_summary': d['counterfactual_summary'],
            'score_distribution': d['score_distribution'],
            'later_delay_min_distribution': d['later_delay_min_distribution'],
          }, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.7.0-360D-Short-Score5-Timing-Diagnostic
          path: backtest_output_v170_short_score5_timing_diagnostic_360d/
          if-no-files-found: error
          retention-days: 30
