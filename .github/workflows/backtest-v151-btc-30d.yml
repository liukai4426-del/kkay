name: Backtest KAYTRADE V1.5.1 BTC 30D
on:
  push:
    branches: [research/v151-btc-30d-backtest]
    paths:
      - research_v151_30d_backtest.py
      - research_v146_backtest.py
      - research_v138_final_3m_backtest.py
      - .github/workflows/backtest-v151-btc-30d.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    name: v151-btc-30d
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research simulator
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v151_30d_backtest.py
      - name: Verify V1.5.1 research wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research_v151_30d_backtest.py').read_text()
          for token in (
              'THRESHOLD = 6.0',
              'LOSS_PAUSE_MS = 60 * 60 * 1000',
              'POSITION_CAP = 1_000.0',
              'trigger_value',
              'adverse4_block = struct4 < 0.0',
              'risk_dist = atr1h * STOP_ATR',
              'front_r >= 1.3',
              'if self.active is not None',
          ):
              assert token in p, token
          print('PASS: V1.5.1 research model wiring verified')
          PY
      - name: Run V1.5.1 rolling 30-day BTC backtest
        run: python research_v151_30d_backtest.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('backtest_output_v151_btc_30d')
          m=json.loads((out/'metrics.json').read_text())
          assert m['strategy_version']=='1.5.1'
          assert m['days']==30
          assert m['entry_threshold']==6.0
          assert m['single_signal_only'] is True
          assert m['add_on_enabled'] is False
          assert m['stop_atr_timeframe']=='1H'
          assert m['front_space_r_atr_timeframe']=='1H'
          assert m['adverse_4h_structure_hard_gate'] is True
          assert m['loss_pause_hours']==1
          assert (out/'V151_BTC_SWAP_30D_Backtest_Report.md').is_file()
          assert (out/'V151_BTC_SWAP_30D_Trades.csv').is_file()
          assert (out/'V151_BTC_SWAP_30D_Cycles.csv').is_file()
          print('PASS: V1.5.1 30D outputs verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.5.1-BTC-30D-Backtest
          path: backtest_output_v151_btc_30d/
          if-no-files-found: error
          retention-days: 30
