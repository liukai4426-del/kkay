name: Kaytrade offline tests
on:
  push:
    paths: ['kaytrade/**', '.github/workflows/kaytrade-tests.yml']
  pull_request:
    paths: ['kaytrade/**', '.github/workflows/kaytrade-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fake API tests
        run: python -m unittest discover -s kaytrade/tests -v
