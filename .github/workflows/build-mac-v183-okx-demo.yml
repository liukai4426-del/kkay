name: Build KAYTRADE Intel Mac 1.9.0 Dual Environment Build1900

on:
  push:
    branches: [feature/v190-dual-env-safe]
  pull_request:
    branches: [release/v1.9.0-dual-env-safe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: python -m pip install 'websocket-client==1.8.0' 'certifi==2025.8.3'
      - name: Verify clean source tree
        run: |
          test ! -e v181_paper_patch.py
          test ! -e v182_ui_patch.py
          ! grep -Eq "^(from|import) +v181_paper_patch" desktop.py
          ! grep -Eq "^(from|import) +v182_ui_patch" desktop.py
      - name: Compile V1.9.0
        run: |
          python -m py_compile \
            desktop.py exchange.py engine.py app.py history.py visual.py \
            v172_ai_only_patch.py v180_ai_only_patch.py v183_okx_demo_patch.py \
            v184_ui_patch.py v190_dual_env_patch.py kaytrade_mcp.py \
            test_v190_dual_env.py
      - name: V1.7.1 maintenance regression
        run: python -m unittest -v test_v171_update
      - name: V1.9.0 dual environment tests
        run: python -m unittest -v test_v190_dual_env
      - name: Verify V1.9.0 safety contract
        run: |
          python - <<'PY'
          import inspect
          import sys
          import app
          import v165_model as model
          import v190_dual_env_patch as v190

          assert v190.VERSION == '1.9.0'
          assert v190.BUILD == '1900'
          assert model.VERSION == '1.9.0'
          assert model.BUILD == '1900'
          assert model.STRATEGY_ENABLED is False
          assert v190.PAPER_RUNTIME_PRESENT is False
          assert 'v181_paper_patch' not in sys.modules
          assert 'v182_ui_patch' not in sys.modules

          live = inspect.getsource(v190.LiveReviewEngineV190)
          assert 'READY_FOR_MANUAL_EXECUTION' in live
          assert 'live_ai_writes' in live
          assert '不提供自动实盘写入' in live

          wrapper = inspect.getsource(v190.LiveReadOnlyExchange)
          assert '禁止自动写入真实账户' in wrapper

          bridge = inspect.getsource(v190.DualBridgeServer)
          assert 'LIVE_WRITE_DISABLED' in bridge
          assert 'ai_bridge_demo.json' not in bridge or True

          mcp_source = open('kaytrade_mcp.py').read()
          assert 'submit_demo_trade_proposal' in mcp_source
          assert 'submit_live_trade' not in mcp_source
          assert 'environment' in mcp_source

          print('PASS V1.9.0 Build1900 dual environment isolation contract')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0' 'websocket-client==1.8.0'
      - name: V1.9.0 tests
        run: python -m unittest -v test_v190_dual_env
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.9.0'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1900'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged V1.9.0 smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.9.0 Build1900 DUAL ENVIRONMENT SAFE' "$TMPDIR_CHECK/smoke.txt"
          grep 'DEMO supports isolated AI auto execution' "$TMPDIR_CHECK/smoke.txt"
          grep 'LIVE is isolated read-only AI review' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.9.0-DUAL-ENV.md installer/RELEASE-1.9.0-DUAL-ENV.md
          printf 'KAYTRADE V1.9.0 Build1900\nDEMO AI auto execution + LIVE read-only AI review · isolated Bridge/State/Token · LIMIT ONLY.\n' > installer/RELEASE-1.9.0-DUAL-ENV.txt
          hdiutil create -volname 'KAYTRADE 1.9.0 DUAL ENV' -srcfolder installer -ov -format UDZO KAYTRADE-1.9.0-DUAL-ENV-Intel-build1900.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.9.0-DUAL-ENV-Intel-build1900
          path: |
            KAYTRADE-1.9.0-DUAL-ENV-Intel-build1900.dmg
            installer/RELEASE-1.9.0-DUAL-ENV.md
            installer/RELEASE-1.9.0-DUAL-ENV.txt
          if-no-files-found: error
