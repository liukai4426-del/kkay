name: Build KAYTRADE Intel Mac 1.8.3 OKX Demo Build1831

on:
  push:
    branches: [feature/v183-okx-demo-execution]
  pull_request:
    branches: [release/v1.8.3-okx-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: python -m pip install 'websocket-client==1.8.0' 'certifi==2025.8.3'
      - name: Compile V1.8.3
        run: |
          python -m py_compile \
            desktop.py exchange.py engine.py app.py history.py visual.py \
            v172_ai_only_patch.py v180_ai_only_patch.py v183_okx_demo_patch.py \
            kaytrade_mcp.py test_v183_okx_demo.py
      - name: V1.7.1 maintenance regression
        run: python -m unittest -v test_v171_update
      - name: V1.8.3 OKX Demo execution tests
        run: python -m unittest -v test_v183_okx_demo
      - name: Verify V1.8.3 execution semantics
        run: |
          python - <<'PY'
          import inspect
          import app
          import exchange
          import v165_model as model
          import v183_okx_demo_patch as v183

          assert v183.VERSION == '1.8.3'
          assert v183.BUILD == '1831'
          assert v183.DEMO_EXECUTION is True
          assert v183.LIMIT_ONLY is True
          assert model.STRATEGY_ENABLED is False
          assert app.Engine is v183.OKXDemoEngineV183

          src = inspect.getsource(v183.OKXDemoEngineV183)
          assert '"/api/v5/trade/order"' in src
          assert '"ordType": "limit"' in src
          assert 'SUBMITTED_TO_OKX' in src
          assert 'OKX_DEMO_EXECUTION' in src
          assert 'ENTRY_TTL_SEC = 60 * 60' in inspect.getsource(v183)
          assert 'v181_paper_patch' not in open('desktop.py').read()
          assert 'v182_ui_patch' not in open('desktop.py').read()
          assert 'v181_paper_patch' not in open('OKXLocal.spec').read()
          assert 'v182_ui_patch' not in open('OKXLocal.spec').read()
          assert v183.v172.AIOnlyEngine is v183.OKXDemoEngineV183
          assert '"supported_entry_order_types": ["limit"]' in src
          assert '"supported_close_order_types": ["limit"]' in src
          assert '"demo_exchange_writes": True' in src
          assert '"live_ai_writes": False' in src

          req = inspect.getsource(exchange.Exchange._request_once)
          assert "/api/v5/trade/amend-order" in req
          assert "/api/v5/trade/amend-algos" in req
          print('PASS V1.8.3: immediate OKX Demo LIMIT execution, no local fill gate')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0' 'websocket-client==1.8.0'
      - name: V1.8.3 tests
        run: python -m unittest -v test_v183_okx_demo
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.8.3'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1831'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged V1.8.3 smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.8.3 Build1831 OKX DEMO LIMIT ONLY' "$TMPDIR_CHECK/smoke.txt"
          grep 'AI plans submit exchange limit orders immediately' "$TMPDIR_CHECK/smoke.txt"
          grep 'Paper runtime modules are not imported or packaged' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.8.3-OKX-DEMO.md installer/RELEASE-1.8.3-OKX-DEMO.md
          printf 'KAYTRADE V1.8.3 OKX DEMO CLEAN Build1831\nPaper runtime removed · AI plan -> immediate OKX Demo LIMIT order · exchange-sourced fills.\n' > installer/RELEASE-1.8.3-OKX-DEMO.txt
          hdiutil create -volname 'KAYTRADE 1.8.3 OKX DEMO' -srcfolder installer -ov -format UDZO KAYTRADE-1.8.3-OKX-DEMO-Intel-build1831.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.8.3-OKX-DEMO-Intel-build1831
          path: |
            KAYTRADE-1.8.3-OKX-DEMO-Intel-build1831.dmg
            installer/RELEASE-1.8.3-OKX-DEMO.md
            installer/RELEASE-1.8.3-OKX-DEMO.txt
          if-no-files-found: error
