name: Build KAYTRADE Intel Mac 1.5.1
on:
  push:
    branches: [codex/v1-5-1-update]
    paths:
      - '**.py'
      - OKXLocal.spec
      - RELEASE-1.5.1.md
      - .github/workflows/build-mac-v151.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v151-strategy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.5.1 runtime
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py v138_strategy_patch.py v140_score_dialog_patch.py v143_score_arbitration_patch.py v146_ui_log_polish_patch.py v146_ui_fix_patch.py v147_strategy_patch.py v150_strategy_patch.py v151_strategy_patch.py test_v150_strategy.py test_v151_strategy.py
      - name: Run preserved V1.4.7 regression tests
        run: |
          python -m unittest -v test_engine test_candles
          python -m unittest -v test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
          python -m unittest -v test_v137_strategy test_v137_cancel_fix
          python -m unittest -v test_v138_strategy
          python -m unittest -v test_v139_position
          python -m unittest -v test_v140_score_dialog
          python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit
          python -m unittest -v test_v142_visual test_v143_score_arbitration test_v143_visual_polish test_v144_ui_polish test_v145_layout_fix
          python -m unittest -v test_v146_ui_log_polish test_v146_ui_fix
          python -m unittest -v test_v147_strategy
      - name: Run V1.5.0 regression tests
        run: python -m unittest -v test_v150_strategy
      - name: Run V1.5.1 tests
        run: python -m unittest -v test_v151_strategy
      - name: Verify V1.5.1 production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import v150_strategy_patch as v150
          import v151_strategy_patch as v151
          import engine
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v151_strategy_patch.py').read_text()
          assert v150.V150_THRESHOLD == 6.0
          assert v150._tier(6.0) == (1,1.0,'开仓信号')
          assert v150._tier(10.0) == (1,1.0,'开仓信号')
          assert v151.LOSS_PAUSE_SECONDS == 3600
          assert 'streak_pause_until' in patch
          assert "proxy['m']['atr'] = atr1h" in patch
          assert "adverse4_block = adverse4 < 0.0" in patch
          assert "confirmations['4H_adverse_structure_block']" in patch
          assert "value = v151_signal(h, m, f, o" in patch
          assert "engine.Engine.refresh_market = refresh_market" in patch
          assert "_v151_connection_scrollbar" in patch
          assert "v146fix._scroll_surface" in patch
          assert 'v151_strategy_patch.py' in spec
          assert "CFBundleShortVersionString': '1.5.1'" in spec
          assert "CFBundleVersion': '151'" in spec
          assert engine.Engine.refresh_market.__module__ == 'v151_strategy_patch'
          print('PASS: V1.5.1 live scorer + 1H ATR + 4H hard gate + 1h loss pause + connection scroll are wired')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run key tests on Intel Mac
        run: |
          python -m py_compile v147_strategy_patch.py v150_strategy_patch.py v151_strategy_patch.py test_v150_strategy.py test_v151_strategy.py build_icon.py
          python -m unittest -v test_v138_strategy
          python -m unittest -v test_v143_score_arbitration
          python -m unittest -v test_v146_ui_log_polish test_v146_ui_fix
          python -m unittest -v test_v147_strategy
          python -m unittest -v test_v150_strategy
          python -m unittest -v test_v151_strategy
      - name: Create application icon
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.5.1'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.5.1.md installer/RELEASE-1.5.1.md
          printf 'PASS: V1.5.1 based on V1.5.0; 1H ATR TP/SL; adverse 4H structure hard gate; 3 losses pause 1h; connection page scrollbar.\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.5.1 -srcfolder installer -ov -format UDZO KAYTRADE-1.5.1-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.5.1-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.5.1-Intel-test
          path: |
            KAYTRADE-1.5.1-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
