name: Build KAYTRADE Intel Mac 1.7.1 Build1710

on:
  push:
    branches: [feature/v171-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install V1.7.1 runtime test dependencies
        run: python -m pip install 'websocket-client==1.8.0' 'certifi==2025.8.3'
      - name: Compile V1.7.1 Build1710
        run: |
          python -m py_compile \
            v160_model.py v160_update_patch.py v161_model.py v161_update_patch.py v162_model.py v162_update_patch.py \
            v163_model.py v163_update_patch.py v163_ui_patch.py v164_model.py v164_update_patch.py v164_ui_patch.py \
            v165_model.py v165_update_patch.py v165_algo_fallback_patch.py v165_runtime_network_patch.py \
            v165_sleep_resume_patch.py v165_keepawake_patch.py v165_ui_patch.py v165_15m_outer_patch.py \
            v166_ui_patch.py v166_readonly_resilience_patch.py \
            v167_strategy_patch.py v167_algo_sync_patch.py v167_15m_boll_only_fix.py \
            v168_update_patch.py v168_build1681_patch.py v170_update_patch.py v170_build1701_patch.py v171_update_patch.py \
            test_v167_strategy.py test_v167_algo_sync.py test_v167_15m_boll_only_fix.py \
            test_v168_update.py test_v168_build1681.py test_v170_update.py test_v170_build1701.py test_v171_update.py desktop.py
      - name: Preserved strategy/runtime regressions
        run: |
          python -m unittest -v test_engine
          python -m unittest -v test_candles
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v155_update
          python -m unittest -v \
            test_v156_build1561.V156Build1561Tests.test_fixed_loss_control_markers_cover_value_row_and_note \
            test_v156_build1561.V156Build1561Tests.test_identity_and_preserved_flags \
            test_v156_build1561.V156Build1561Tests.test_log_order_helper_is_newest_first_and_capped
          python -m unittest -v test_v160_update
          python -m unittest -v test_v161_update
          python -m unittest -v test_v162_update
          python -m unittest -v test_v163_update
          python -m unittest -v test_v163_ui
          python -m unittest -v test_v164_update
          python -m unittest -v test_v164_execution
          python -m unittest -v test_v164_ui
          python -m unittest -v test_v165_update
          python -m unittest -v test_v165_execution
          python -m unittest -v test_v165_runtime_network_state
          python -m unittest -v test_v165_sleep_resume
          python -m unittest -v test_v165_keepawake
          python -m unittest -v test_v165_ui
          python -m unittest -v test_v166_ui
          python -m unittest -v test_v166_readonly_resilience
          python -m unittest -v test_v167_strategy
          python -m unittest -v test_v167_algo_sync
          python -m unittest -v test_v167_15m_boll_only_fix
      - name: V1.6.8 Build1680 base regressions
        run: python -m unittest -v test_v168_update
      - name: V1.6.8 Build1681 runtime/log regressions
        run: python -m unittest -v test_v168_build1681
      - name: V1.7.0 Build1700 strategy/runtime/UI regressions
        run: python -m unittest -v test_v170_update
      - name: V1.7.1 Build1710 strict-15m source/log regressions
        run: python -m unittest -v test_v170_build1701
      - name: V1.7.1 Build1710 maintenance regressions
        run: python -m unittest -v test_v171_update
      - name: Verify V1.7.1 Build1710 semantic lock
        run: |
          python - <<'PY'
          from pathlib import Path
          import app
          import engine
          import exchange
          import v153_model as signal_core
          import v161_ui_status_patch as ui161
          import v165_model as model
          import v167_15m_boll_only_fix as b1671
          import v170_update_patch as v170
          import v170_build1701_patch as v1701
          import v171_update_patch as v171
          spec=Path('OKXLocal.spec').read_text()
          desktop=Path('desktop.py').read_text()
          assert v171.VERSION=='1.7.1' and v171.BUILD=='1710'
          assert v1701.VERSION=='1.7.1' and v1701.BUILD=='1710'
          assert v170.VERSION=='1.7.1' and v170.BUILD=='1710'
          assert model.VERSION=='1.7.1' and model.BUILD=='1710'
          assert model.THRESHOLD==6.0
          assert model.ENTRY_WINDOW_MS==900000
          assert model.BOLL_OUTER_SCORE==2.0
          assert model.BOLL_TRIGGER_TIMEFRAME=='15m'
          assert model.FIVE_MINUTE_BOLL_ENABLED is False
          assert signal_core.boll_entry_signal is b1671._signal_adapter_15m_only
          labels=dict(ui161._STATUS_ITEMS)
          assert 'ema1h' not in labels
          assert labels['boll5_overext']=='5m BOLL超伸 +1'
          assert getattr(model,'_kaytrade_v170_applied',False)
          assert getattr(engine.Engine,'_kaytrade_v170_applied',False)
          assert getattr(exchange.Exchange,'_kaytrade_v170_applied',False)
          assert getattr(app.App,'_kaytrade_v170_applied',False)
          assert "CFBundleShortVersionString': '1.7.1'" in spec
          assert "CFBundleVersion': '1710'" in spec
          assert 'v170_update_patch' in desktop and 'v170_build1701_patch' in desktop and 'v171_update_patch' in desktop
          text=v171._rewrite_runtime_text_v171('自动交易启动；V1.7.0 Build1701：15m机会源锁：只有最新已收盘15m外轨真实触发才可创建开仓机会')
          print('V171_RUNTIME_TEXT',repr(text))
          assert text.startswith('自动交易启动；V1.7.1 Build1710') and '15m机会源锁' in text and '历史收益兼容' in text
          assert getattr(model,'_kaytrade_v170_build1701_applied',False)
          assert getattr(model,'_kaytrade_v171_applied',False)
          assert v1701._with_direction('V1.7.1未开仓 15m BOLL信号有效期','做多').startswith('方向：做多')
          print('PASS V1.7.1 Build1710: strict closed-15m source lock + versioned history sync + preserved V1.7 strategy')
          PY


  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0' 'websocket-client==1.8.0'
      - name: Runtime/UI tests in isolated interpreters
        run: |
          python -m unittest -v test_v165_update
          python -m unittest -v test_v165_execution
          python -m unittest -v test_v165_runtime_network_state
          python -m unittest -v test_v165_sleep_resume
          python -m unittest -v test_v165_keepawake
          python -m unittest -v test_v165_ui
          python -m unittest -v test_v166_ui
          python -m unittest -v test_v166_readonly_resilience
          python -m unittest -v test_v167_strategy
          python -m unittest -v test_v167_algo_sync
          python -m unittest -v test_v167_15m_boll_only_fix
          python -m unittest -v test_v168_update
          python -m unittest -v test_v168_build1681
          python -m unittest -v test_v170_update
          python -m unittest -v test_v170_build1701
          python -m unittest -v test_v171_update
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify V1.7.1 Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.7.1'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1710'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged V1.7.1 Build1710 UI/runtime smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.7.1 Build1710' "$TMPDIR_CHECK/smoke.txt"
          grep '1H EMA9/26 score removed' "$TMPDIR_CHECK/smoke.txt"
          grep 'BOLL5 overextension 0.10 ATR14 +1 latched' "$TMPDIR_CHECK/smoke.txt"
          grep 'strict closed-15m BOLL opportunity-source lock installed' "$TMPDIR_CHECK/smoke.txt"
          grep 'versioned closed-round history sync enabled' "$TMPDIR_CHECK/smoke.txt"
          grep 'run logs include long/short direction' "$TMPDIR_CHECK/smoke.txt"
          grep 'PEE4 tiered Boolean risk exit and global Lock1H installed' "$TMPDIR_CHECK/smoke.txt"
          grep 'write ambiguity remains fail-closed' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.7.1.md installer/RELEASE-1.7.1.md
          printf 'KAYTRADE V1.7.1 Build1710\nStrict closed-15m BOLL opportunity source + versioned closed-round history sync, with the V1.7 strategy and inherited fail-closed safety preserved.\n' > installer/RELEASE-1.7.1.txt
          hdiutil create -volname 'KAYTRADE 1.7.1' -srcfolder installer -ov -format UDZO KAYTRADE-1.7.1-Intel-build1710.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.7.1-Intel-build1710
          path: |
            KAYTRADE-1.7.1-Intel-build1710.dmg
            installer/RELEASE-1.7.1.md
            installer/RELEASE-1.7.1.txt
          if-no-files-found: error
