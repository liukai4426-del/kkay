name: Build KAYTRADE Intel Mac 1.5.5
on:
  push:
    branches: [codex/v1-5-5-ui-margin-log]
    paths:
      - '**.py'
      - OKXLocal.spec
      - RELEASE-1.5.5.md
      - .github/workflows/build-mac-v155.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v155-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.5.5
        run: >-
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py
          v151_strategy_patch.py v152_model.py v152_strategy_patch.py v152_safety_patch.py
          v152_ui_busy_fix.py v152_backtest_core.py v153_model.py v153_runtime_patch.py
          v153_backtest_core.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py
          v154_record_card_boll_fix.py v154_fixed_card_precision_fix.py v154_build1543_patch.py
          v154_build1543_ui_cleanup.py v154_build1544_patch.py v155_update_patch.py
          test_v154_strategy.py test_v154_round2_runtime.py test_v154_build1543.py
          test_v154_build1544.py test_v155_update.py test_v155_tk.py
      - name: Run preserved strategy and safety regressions
        run: |
          python -m unittest -v test_engine test_candles
          python -m unittest -v test_v135_execution test_v135_safety2 test_v135_order_state
          python -m unittest -v test_v136_runtime test_v137_strategy test_v138_strategy
          python -m unittest -v test_v141_exit_limit test_v143_score_arbitration
          python -m unittest -v test_v146_ui_fix test_v147_strategy
          python -m unittest -v test_v150_strategy
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v152_ui_busy_fix
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v153_ui_scroll
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_ui_scroll
          python -m unittest -v test_v154_build1543
          python -m unittest -v test_v154_build1544
          python -m unittest -v test_v155_update
      - name: Verify V1.5.5 production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import app, engine
          import v154_model as model
          import v154_build1544_patch as b1544
          import v155_update_patch as v155
          spec=Path('OKXLocal.spec').read_text()
          assert model.VERSION == '1.5.4' and model.THRESHOLD == 6.0
          assert model.ENTRY_WINDOW_MS == 0 and model.TIME_WINDOW_ENABLED is False
          assert b1544.PATH_C_ENABLED is False and v155.PATH_C_ENABLED is False
          assert v155.PATH_C_COMPAT_MULTIPLIER == 3.0
          assert engine.Engine._kaytrade_v155_applied
          assert app.App._kaytrade_v155_applied
          assert 'v155_update_patch.py' in spec
          assert "CFBundleShortVersionString': '1.5.5'" in spec
          assert "CFBundleVersion': '1550'" in spec
          print('PASS: V1.5.5 = Build1544 strategy + margin semantics + editable idle settings + timestamped scroll log')
          PY
  build:
    name: intel-mac-package-v155
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.5.5 tests on Intel Mac
        run: |
          python -m py_compile v152_model.py v152_strategy_patch.py v152_safety_patch.py v152_ui_busy_fix.py v153_model.py v153_runtime_patch.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py v154_record_card_boll_fix.py v154_fixed_card_precision_fix.py v154_build1543_patch.py v154_build1543_ui_cleanup.py v154_build1544_patch.py v155_update_patch.py test_v154_build1544.py test_v155_update.py test_v155_tk.py build_icon.py
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_build1543
          python -m unittest -v test_v154_build1543_tk
          python -m unittest -v test_v154_build1544
          python -m unittest -v test_v155_update
          python -m unittest -v test_v155_tk
      - name: Create application icon
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle and V1.5.5 hook
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.5.5'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1550'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create V1.5.5 installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.5.5.md installer/RELEASE-1.5.5.md
          printf 'PASS: V1.5.5 keeps Build1544 trading logic and Path C OFF; first-signal input is isolated margin, leveraged strategy notional is automatic/read-only, second-signal row is removed, connected-idle settings stay editable, and timestamped run logs support wheel/trackpad history scrolling without forced bottom jumps.\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.5.5 -srcfolder installer -ov -format UDZO KAYTRADE-1.5.5-Intel.dmg
          shasum -a 256 KAYTRADE-1.5.5-Intel.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.5.5-Intel
          path: |
            KAYTRADE-1.5.5-Intel.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
