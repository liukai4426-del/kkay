name: Build KAYTRADE Intel Mac 1.6.1 Build1610

on:
  push:
    branches: [release/v1.6.1]
    paths:
      - '**.py'
      - OKXLocal.spec
      - RELEASE-1.6.1.md
      - .github/workflows/build-mac-v161.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: v161-build1610-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile V1.6.1 Build1610
        run: >-
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py
          v151_strategy_patch.py v152_model.py v152_strategy_patch.py v152_safety_patch.py
          v152_ui_busy_fix.py v152_backtest_core.py v153_model.py v153_runtime_patch.py
          v153_backtest_core.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py
          v154_record_card_boll_fix.py v154_fixed_card_precision_fix.py v154_build1543_patch.py
          v154_build1543_ui_cleanup.py v154_build1544_patch.py v155_update_patch.py
          v155_build1551_patch.py v156_execution_hotfix.py v156_ui_patch.py v156_build1561_patch.py
          v160_model.py v160_update_patch.py v161_model.py v161_update_patch.py
          test_v160_update.py test_v161_update.py

      - name: Run preserved safety and strategy regressions
        run: |
          python -m unittest -v test_engine test_candles
          python -m unittest -v test_v135_execution test_v135_safety2 test_v135_order_state
          python -m unittest -v test_v136_runtime test_v137_strategy test_v138_strategy
          python -m unittest -v test_v141_exit_limit test_v143_score_arbitration
          python -m unittest -v test_v146_ui_fix test_v147_strategy
          python -m unittest -v test_v150_strategy
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v152_ui_busy_fix
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v153_ui_scroll
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_ui_scroll
          python -m unittest -v test_v154_build1543
          python -m unittest -v test_v154_build1544
          python -m unittest -v test_v155_update
          python -m unittest -v test_v155_build1551
          python -m unittest -v test_v156_ui
          python -m unittest -v test_v156_build1561
          python -m unittest -v test_v160_update
          python -m unittest -v test_v161_update

      - name: Verify V1.6.1 production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import app, engine, exchange
          import v138_strategy_patch as v138
          import v152_strategy_patch as v152_runtime
          import v153_runtime_patch as v153_runtime
          import v153_backtest_core as v153_bt
          import v154_runtime_patch as v154_runtime
          import v154_limit_log_fix as v154_limit
          import v160_update_patch as v160
          import v161_model as model
          import v161_update_patch as v161

          spec = Path('OKXLocal.spec').read_text()
          assert model.VERSION == '1.6.1' and model.THRESHOLD == 6.0
          assert v161.VERSION == '1.6.1' and v161.BUILD == '1610'
          assert v160.model is model
          assert v152_runtime.model is model
          assert v153_runtime.model is model
          assert v153_bt.model is model
          assert v154_runtime.model is model
          assert v154_limit.model is model
          assert v138._prepare_order is v160._prepare_order_v160
          assert exchange.Exchange.sync_time is v161._sync_time_v161
          assert engine.Engine._kaytrade_v161_applied and app.App._kaytrade_v161_applied

          blocked = {
              'total': 6.5, 'gate': True, 'eligible': True, 'position_multiplier': 1.0,
              'layers': {'macd_improving': 1.0},
              'confirmations': {'required': {}, '4H_trend_state': 'neutral'},
              'reason': 'ok', 'level': 'ok'
          }
          model._apply_row_rules(blocked, 'lower_band')
          assert blocked['eligible'] is False and blocked['position_multiplier'] == 0.0
          aligned = {
              'total': 6.5, 'gate': True, 'eligible': True, 'position_multiplier': 1.0,
              'layers': {'macd_improving': 1.0},
              'confirmations': {'required': {}, '4H_trend_state': 'aligned'},
              'reason': 'ok', 'level': 'ok'
          }
          model._apply_row_rules(aligned, 'upper_band')
          assert aligned['eligible'] is True and aligned['position_multiplier'] == 2.0

          assert "runtime_hooks=[str(root / 'v161_update_patch.py')]" in spec
          assert "CFBundleShortVersionString': '1.6.1'" in spec
          assert "CFBundleVersion': '1610'" in spec
          print('PASS: V1.6.1 4H outer gate + 1R BE + tolerant clock sync wiring verified')
          PY

  build:
    name: intel-mac-package-v161-build1610
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 65
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'

      - name: Re-run final V1.6.1 tests on Intel Mac
        run: |
          python -m py_compile v160_model.py v160_update_patch.py v161_model.py v161_update_patch.py test_v161_update.py build_icon.py
          python -m unittest -v test_v160_update
          python -m unittest -v test_v161_update

      - name: Create application icon
        run: |
          python build_icon.py
          test -s OKXLocal.icns

      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec

      - name: Launch packaged app and verify startup probe
        run: |
          rm -f /tmp/kaytrade-v161-startup.txt /tmp/kaytrade-v161-startup.txt.error /tmp/kaytrade-v161.log
          KAYTRADE_STARTUP_PROBE=/tmp/kaytrade-v161-startup.txt dist/KAYTRADE.app/Contents/MacOS/KAYTRADE >/tmp/kaytrade-v161.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 80); do
            if [ -s /tmp/kaytrade-v161-startup.txt ]; then ok=1; break; fi
            if [ -s /tmp/kaytrade-v161-startup.txt.error ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [ "$ok" != "1" ]; then
            echo 'Packaged startup probe failed'
            echo '--- stdout/stderr ---'
            cat /tmp/kaytrade-v161.log || true
            echo '--- App init traceback ---'
            cat /tmp/kaytrade-v161-startup.txt.error || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          cat /tmp/kaytrade-v161-startup.txt
          grep '1.6.1 Build 1610' /tmp/kaytrade-v161-startup.txt
          grep 'outer_4h=aligned_required' /tmp/kaytrade-v161-startup.txt
          grep 'be_1r=on' /tmp/kaytrade-v161-startup.txt
          grep 'clock_sync=3sample_auto_recover' /tmp/kaytrade-v161-startup.txt
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Verify bundle and V1.6.1 runtime hook
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.6.1'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1610'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app

      - name: Create V1.6.1 Build1610 installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.6.1.md installer/RELEASE-1.6.1.md
          printf 'PASS: V1.6.1 requires 4H alignment for 5m BOLL outer entries, moves SL to average entry at +1R, and soft-pauses/retries transient clock-sync delay.\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.6.1-B1610 -srcfolder installer -ov -format UDZO KAYTRADE-1.6.1-Intel-build1610.dmg
          shasum -a 256 KAYTRADE-1.6.1-Intel-build1610.dmg > SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.6.1-Intel-build1610
          path: |
            KAYTRADE-1.6.1-Intel-build1610.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
