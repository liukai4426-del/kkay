name: Backtest V1.7.1 Asymmetric Trend Pullback 180D 360D 720D

on:
  push:
    branches: [research/v171-asym-trend-pullback-multiperiod]
    paths:
      - run_v171_asym_trend_pullback.py
      - .github/workflows/backtest-v171-asym-trend-pullback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        days: [180, 360, 720]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
      BACKTEST_DAYS: ${{ matrix.days }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v171-asym-${{ matrix.days }}d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-${{ matrix.days }}d-
            kaytrade-v168-okx-btc-180d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and PEE4 stack
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py

          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Compile and verify asymmetric semantic lock
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            research_backtest_data_cache.py run_v168_180d_backtest_r2.py \
            run_v168_boll5_overext035_180d.py run_v168_boll5_overext035_pee3_mfe06_180d.py \
            run_v168_boll5_overext010_pee4_365d.py \
            run_v170_trend_pullback_180d.py run_v171_asym_trend_pullback.py
          python - <<'PY'
          import os
          import run_v171_asym_trend_pullback as x
          assert x.DAYS == int(os.environ['BACKTEST_DAYS'])
          x.configure_source()
          x.verify()
          assert x.LONG_COST_MAX_R == 0.20
          assert x.SHORT_COST_MAX_R == 0.30
          assert x.FRONT_MIN_R == 1.50
          assert x.AsymTrendPullbackModel.BOLL_TRIGGER_TIMEFRAME == '15m'
          print('PASS: common 4H+1H aligned; LONG width-expanding Cost<0.20; SHORT 15m-not-bullish Cost<0.30; Front/PEE4/Lock1H preserved')
          PY

      - name: Run asymmetric Trend Pullback
        run: time python run_v171_asym_trend_pullback.py

      - name: Verify result and continuity fields
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          days=int(os.environ['BACKTEST_DAYS'])
          p=Path(f'backtest_output_v171_asym_trend_pullback_{days}d/result_v171_asym_trend_pullback_{days}d.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['window']['days'] == days
          assert d['strategy_lock']['long']['cost_r'] == '< 0.20R strictly'
          assert d['strategy_lock']['short']['cost_r'] == '< 0.30R strictly'
          assert d['strategy_lock']['long']['boll_width'].startswith('normalized width current > previous')
          assert d['strategy_lock']['short']['15m_trend'].startswith('bearish or neutral allowed')
          assert 'annualized_trades' in d['frequency']
          assert len(d['segments_180d']) == days // 180
          print('SUMMARY', json.dumps({
            'days': days,
            'metrics': d['metrics'],
            'frequency': d['frequency'],
            'segments_180d': d['segments_180d'],
            'continuity_checks': d['continuity_checks'],
            'analysis': d.get('analysis', {}),
            'pee4': d.get('pee4', {}),
          },ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V171-Asym-Trend-Pullback-${{ matrix.days }}D-2000U
          path: backtest_output_v171_asym_trend_pullback_${{ matrix.days }}d/
          if-no-files-found: error
          retention-days: 30
