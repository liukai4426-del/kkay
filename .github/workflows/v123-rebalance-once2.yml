name: Retry V1.2.3 volume score and 15m ATR revision
on:
  push:
    branches:
      - codex/v1-2-3-scoring
    paths:
      - .github/workflows/v123-rebalance-once2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-2-3-scoring
      - name: Apply revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new))

          Path('strategy.py').write_text('''"""V1.2.3 closed-candle reversal score: 10 points, no RSI hard gate."""
          import math
          from core import indicators


          def _period(rows, current, previous, buy):
              c, prev = rows[-1], rows[-2]
              kdj = (current['j'] <= 30 and current['cross_up']) if buy else (current['j'] >= 70 and current['cross_down'])
              ema = (prev['c'] <= previous['ema20'] and c['c'] > current['ema20']) if buy else (prev['c'] >= previous['ema20'] and c['c'] < current['ema20'])
              reversal = (c['c'] > c['o'] and c['c'] > prev['h']) if buy else (c['c'] < c['o'] and c['c'] < prev['l'])
              return dict(kdj=kdj, ema=ema, reversal=reversal, confirmed=kdj or ema or reversal)


          def _volume_boll_return(rows, current, buy, multiplier=1.3):
              """Confirm Bollinger rejection using current volume versus the prior 20 closed bars."""
              if len(rows) < 21:
                  return False, 0.0
              history=[]
              for row in rows[-21:-1]:
                  try:
                      value=float(row['v'])
                  except (KeyError, TypeError, ValueError):
                      return False, 0.0
                  if not math.isfinite(value) or value < 0:
                      return False, 0.0
                  history.append(value)
              try:
                  current_volume=float(rows[-1]['v'])
              except (KeyError, TypeError, ValueError):
                  return False, 0.0
              average=sum(history)/len(history)
              if not math.isfinite(current_volume) or current_volume < 0 or average <= 0:
                  return False, 0.0
              candle=rows[-1]
              returned=(candle['l'] <= current['lower'] and candle['c'] > current['lower']) if buy else (candle['h'] >= current['upper'] and candle['c'] < current['upper'])
              ratio=current_volume/average
              return returned and ratio >= multiplier, ratio


          def signal(hour, quarter, five=None, threshold=7):
              five = quarter if five is None else five
              h, m, f = indicators(hour), indicators(quarter), indicators(five)
              ph, pm, pf = indicators(hour[:-1]), indicators(quarter[:-1]), indicators(five[:-1])
              hc, mc = hour[-1], quarter[-1]
              results = {}

              for side in ('做多', '做空'):
                  buy = side == '做多'
                  hf = _period(hour, h, ph, buy)
                  mf = _period(quarter, m, pm, buy)
                  ff = _period(five, f, pf, buy)

                  rsi_extreme = (m['rsi'] <= 20 and h['rsi'] <= 25) if buy else (m['rsi'] >= 75 and h['rsi'] >= 70)
                  boll_rsi = (mc['l'] <= m['lower'] and m['rsi'] < 30) if buy else (mc['h'] >= m['upper'] and m['rsi'] > 70)
                  volume_boll, volume_ratio = _volume_boll_return(quarter, m, buy)
                  kdj_point = mf['kdj']
                  ema_point = ff['ema']

                  strong_opposite = (
                      hc['c'] < h['ema200'] and h['ema20'] < h['ema50'] and h['down']
                  ) if buy else (
                      hc['c'] > h['ema200'] and h['ema20'] > h['ema50'] and h['up']
                  )
                  if buy:
                      directional_environment = hf['confirmed'] or h['rsi'] <= 45 or hc['c'] >= h['ema20']
                  else:
                      directional_environment = hf['confirmed'] or h['rsi'] >= 55 or hc['c'] <= h['ema20']
                  hour_support = (not strong_opposite) and directional_environment

                  # Rebalanced to preserve a true 10-point maximum: 5m = +1,
                  # 5m+15m = +2. 1H remains an environment/penalty layer.
                  if ff['confirmed'] and mf['confirmed']:
                      multi = 2
                  elif ff['confirmed']:
                      multi = 1
                  else:
                      multi = 0

                  items = [
                      ('15m + 1H RSI 极值组合', 2 * int(rsi_extreme), 2),
                      ('15m BOLL触轨 + RSI超买/超卖', 2 * int(boll_rsi), 2),
                      ('15m BOLL外破回归 + 成交量≥20均量×1.3', 2 * int(volume_boll), 2),
                      ('15m KDJ J值 + K/D交叉确认', int(kdj_point), 1),
                      ('5m 重新穿越 EMA20', int(ema_point), 1),
                      ('5m / 15m 多周期确认', multi, 2),
                      ('1H 强逆势惩罚', -2 * int(strong_opposite), 0),
                  ]
                  raw = sum(item[1] for item in items)
                  total = max(0, min(10, raw))
                  eligible = total >= threshold
                  reason = (f'评分 {total}/10 达标；仍需执行风控检查' if eligible
                            else f'评分 {total}/10，未达 {threshold:g}')
                  results[side] = dict(total=total, raw=raw, gate=True, eligible=eligible,
                                       items=items, reason=reason,
                                       confirmations={'5m': ff['confirmed'], '15m': mf['confirmed'],
                                                      '1H': hour_support, 'strong_opposite': strong_opposite,
                                                      'volume_ratio_15m': volume_ratio})

              qualified = [side for side, row in results.items() if row['eligible']]
              if len(qualified) == 1:
                  side = qualified[0]
              elif len(qualified) == 2 and results[qualified[0]]['total'] != results[qualified[1]]['total']:
                  side = max(qualified, key=lambda s: results[s]['total'])
              else:
                  side = '观望'
              why = results[side]['reason'] if side != '观望' else ' / '.join(s + ': ' + r['reason'] for s, r in results.items())
              return dict(h=h, m=m, f=f, side=side, why=why, scores=results, threshold=threshold)
          ''')

          replace('candles.py',
          """                t=int(row[0]); values=[float(v) for v in row[1:5]]
                          if t%step or not all(math.isfinite(v) and v>0 for v in values):
                              raise CandleStale('K线时间或价格异常，暂停判断')
                          rows[t]=dict(zip(('o','h','l','c'),values))""",
          """                t=int(row[0]); values=[float(v) for v in row[1:5]]; volume=float(row[5])
                          if t%step or not all(math.isfinite(v) and v>0 for v in values) or not math.isfinite(volume) or volume<0:
                              raise CandleStale('K线时间、价格或成交量异常，暂停判断')
                          rows[t]=dict(zip(('o','h','l','c'),values)); rows[t]['v']=volume""")

          replace('engine.py', '    stop_atr:float=.8', '    stop_atr:float=1.0')
          replace('engine.py',
                  "self.emit('log','自动交易启动；5m入场、15m结构、1H环境；最终评分达阈值才允许进入风控；每根5m信号最多一次')",
                  "self.emit('log','自动交易启动；5m入场、15m结构、1H环境；SL/TP使用15m ATR；最终评分达阈值才允许进入风控；每根5m信号最多一次')")
          replace('engine.py',
                  "plan=make_plan(s,market['side'],ticker,self.x.instrument(),market['h']['atr'],available,remaining)",
                  "plan=make_plan(s,market['side'],ticker,self.x.instrument(),market['m']['atr'],available,remaining)")

          replace('app.py', "'stop_atr':'1小时ATR止损倍数 0.6—3'", "'stop_atr':'15分钟ATR止损倍数 0.6—3'")
          replace('app.py', "止损{s.stop_atr}×ATR，止盈{s.reward_r}R", "止损{s.stop_atr}×15m ATR，止盈{s.reward_r}R（同一15m ATR风险距离）")
          replace('desktop.py', "assert ui.fields['stop_atr'].get() == '0.8'", "assert ui.fields['stop_atr'].get() == '1.0'")

          replace('test_engine.py',
                  "self.e.market={'side':'做多','bar':int(time.time()//300)*300000-300000,'close':60000,'h':{'atr':200},'scores':{'做多':{'gate':True,'total':7}}}",
                  "self.e.market={'side':'做多','bar':int(time.time()//300)*300000-300000,'close':60000,'h':{'atr':2000},'m':{'atr':200},'scores':{'做多':{'gate':True,'total':7}}}")
          replace('test_engine.py',
                  "        self.assertEqual(b['clOrdId'],p['client_id'])\n",
                  "        self.assertEqual(b['clOrdId'],p['client_id'])\n    def test_execution_uses_15m_atr(self):\n        p=self.active()\n        self.assertAlmostEqual(abs(float(p['px'])-float(p['sl'])),200,delta=.2)\n")

          p=Path('test_v11.py'); text=p.read_text()
          start=text.index('class Scores(unittest.TestCase):')
          end=text.index('\nclass Network(unittest.TestCase):')
          scores='''class Scores(unittest.TestCase):
              def score(self, *, buy=True, full=False, strong_opposite=False, threshold=7, rsi_extreme=True):
                  if buy:
                      h=dict(rsi=24 if rsi_extreme else 50,ema200=90,ema20=100,ema50=95,down=False,up=False)
                      if strong_opposite: h.update(ema200=110,ema20=90,ema50=100,down=True)
                      m=dict(rsi=19 if rsi_extreme else 40,lower=90,upper=110)
                      hour=[dict(o=100,h=101,l=99,c=100),dict(o=100,h=101,l=99,c=100)]
                      quarter=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=100,l=89 if full else 95,c=96)]
                  else:
                      h=dict(rsi=71 if rsi_extreme else 50,ema200=110,ema20=100,ema50=105,down=False,up=False)
                      if strong_opposite: h.update(ema200=90,ema20=110,ema50=100,up=True)
                      m=dict(rsi=76 if rsi_extreme else 60,lower=90,upper=110)
                      hour=[dict(o=100,h=101,l=99,c=100),dict(o=100,h=101,l=99,c=100)]
                      quarter=[dict(o=100,h=101,l=99,c=100),dict(o=105,h=111 if full else 105,l=100,c=104)]
                  f=dict(rsi=50); previous={}
                  indicators=[h,m,f,previous,previous,previous]
                  true_feature=dict(kdj=full,ema=full,reversal=full,confirmed=full)
                  false_feature=dict(kdj=False,ema=False,reversal=False,confirmed=False)
                  if buy:
                      periods=[true_feature,true_feature,true_feature,false_feature,false_feature,false_feature]
                      volumes=[(full,1.4),(False,.8)]
                  else:
                      periods=[false_feature,false_feature,false_feature,true_feature,true_feature,true_feature]
                      volumes=[(False,.8),(full,1.4)]
                  with patch('strategy.indicators',side_effect=indicators), patch('strategy._period',side_effect=periods), patch('strategy._volume_boll_return',side_effect=volumes):
                      return signal(hour,quarter,quarter,threshold)

              def test_full_long_scores_ten(self):
                  r=self.score(full=True); self.assertEqual(r['scores']['做多']['total'],10); self.assertEqual(r['side'],'做多')
              def test_full_short_scores_ten(self):
                  r=self.score(buy=False,full=True); self.assertEqual(r['scores']['做空']['total'],10); self.assertEqual(r['side'],'做空')
              def test_rsi_is_points_not_gate(self):
                  r=self.score(full=False,rsi_extreme=False)
                  self.assertTrue(r['scores']['做多']['gate']); self.assertEqual(r['scores']['做多']['items'][0][1],0)
              def test_volume_boll_return_adds_two(self):
                  r=self.score(full=True)
                  items=dict((name,pts) for name,pts,_ in r['scores']['做多']['items'])
                  self.assertEqual(items['15m BOLL外破回归 + 成交量≥20均量×1.3'],2)
              def test_exact_seven_is_eligible(self):
                  h=dict(rsi=24,ema200=90,ema20=100,ema50=95,down=False,up=False)
                  m=dict(rsi=19,lower=90,upper=110); f=dict(rsi=50); p={}
                  rows=[dict(o=100,h=101,l=99,c=100),dict(o=95,h=100,l=89,c=96)]
                  hfeat=dict(kdj=False,ema=False,reversal=False,confirmed=False)
                  mfeat=dict(kdj=True,ema=False,reversal=False,confirmed=True)
                  ffeat=dict(kdj=False,ema=True,reversal=False,confirmed=True)
                  off=dict(kdj=False,ema=False,reversal=False,confirmed=False)
                  with patch('strategy.indicators',side_effect=[h,m,f,p,p,p]), patch('strategy._period',side_effect=[hfeat,mfeat,ffeat,off,off,off]), patch('strategy._volume_boll_return',side_effect=[(False,1.0),(False,1.0)]):
                      r=signal(rows,rows,rows,7)
                  self.assertEqual(r['scores']['做多']['total'],7); self.assertTrue(r['scores']['做多']['eligible'])
              def test_strong_opposite_penalty_is_minus_two(self):
                  r=self.score(full=True,strong_opposite=True)
                  items=dict((name,pts) for name,pts,_ in r['scores']['做多']['items'])
                  self.assertEqual(items['1H 强逆势惩罚'],-2)
                  self.assertEqual(r['scores']['做多']['total'],8)
              def test_integer_points_and_bounds(self):
                  for buy in (True,False):
                      row=self.score(buy=buy,full=True)['scores']['做多' if buy else '做空']
                      self.assertGreaterEqual(row['total'],0); self.assertLessEqual(row['total'],10)
                      self.assertTrue(all(isinstance(i[1],int) for i in row['items']))
              def test_defaults(self):
                  s=Settings(); self.assertEqual((s.score_threshold,s.stop_atr,s.reward_r),(7,1.0,1.5))
              def test_threshold_validation(self):
                  for n in (0,6,7.5,11):
                      with self.assertRaises(Halt): replace(Settings(),score_threshold=n).validate()

          '''
          p.write_text(text[:start]+scores+text[end+1:])

          replace('test_candles.py',
                  "self.assertGreaterEqual(len(c.read('15m')),1000)",
                  "data=c.read('15m'); self.assertGreaterEqual(len(data),1000); self.assertEqual(data[-1]['v'],1.0)")

          Path('RELEASE-1.2.3.md').write_text('''# OKX Local V1.2.3

          ## Current scoring revision

          V1.2.3 remains a 10-point scoring system with a default automatic-entry threshold of 7/10.

          - 15m + 1H RSI extreme combination: +2.
          - 15m Bollinger touch + RSI oversold/overbought: +2.
          - 15m Bollinger outer-band rejection back inside the band + current volume >= 1.3x the prior 20-bar average: +2.
          - 15m KDJ J-value + K/D cross: +1.
          - 5m EMA20 reclaim/break: +1.
          - Multi-timeframe confirmation: 5m = +1; 5m + 15m = +2 maximum.
          - 1H strong opposite trend: -2.
          - RSI is not a hard gate; exactly 7 is eligible for the separate safety/risk checks.

          The volume rule requires rejection back inside the Bollinger band. A high-volume candle that continues closing outside the band is not scored as a reversal.

          ## ATR risk revision

          - Opening SL distance now uses the latest closed 15m ATR rather than 1H ATR.
          - Default stop distance is 1.0 x 15m ATR for new/default settings.
          - TP remains reward-R based (default 1.5R), so it is derived from the same 15m ATR stop distance.
          - Existing saved user risk settings are preserved; the app does not silently overwrite a previously saved stop multiplier.

          ## Timeframes

          - 5m: entry confirmation and signal-deduplication boundary.
          - 15m: primary reversal structure, volume confirmation and ATR risk reference.
          - 1H: market environment and strong-opposite penalty.

          ## Safety behavior retained from V1.2.2

          Closed-candle checks, exchange-clock calibration, CandlePending/CandleLag/CandleStale behavior, unknown-order/position/protection fail-closed locks, isolated margin checks, FOK entry behavior and attached exchange TP/SL remain unchanged. A high score never overrides those safety checks.

          ## Validation limits

          CI uses fake exchange/synthetic market data and packaged UI smoke tests. It does not validate profitability and is not a real-account end-to-end trading test. The app is unsigned/not notarized.
          ''')

          replace('core.py',
                  "                    rows[int(row[0])] = dict(zip(('o','h','l','c'), values))",
                  "                    volume=float(row[5])\n                    if not math.isfinite(volume) or volume < 0:\n                        raise ValueError('行情包含非法成交量')\n                    rows[int(row[0])] = dict(zip(('o','h','l','c'), values)); rows[int(row[0])]['v']=volume")
          replace('core.py', "step = 3600000 if bar == '1H' else 900000", "step = 3600000 if bar == '1H' else 900000 if bar == '15m' else 300000 if bar == '5m' else 0")
          replace('core.py',
                  "if len(data) < 1000 or any(b['t']-a['t'] != step for a,b in zip(data, data[1:])):",
                  "if not step or len(data) < 1000 or any(b['t']-a['t'] != step for a,b in zip(data, data[1:])):")

          for cleanup in ('.github/workflows/v123-rebalance-once.yml','.github/workflows/v123-rebalance-once2.yml'):
              p=Path(cleanup)
              if p.exists(): p.unlink()
          PY
      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1.2.3: add volume Bollinger score and 15m ATR risk"
          git push origin HEAD:codex/v1-2-3-scoring
