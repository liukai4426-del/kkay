name: Backtest KAYTRADE V1.3.8 Final Horizon Compare
on:
  push:
    branches: [research/v138-final-btc-horizon-30-92-183]
    paths:
      - research_v146_backtest.py
      - research_v138_final_3m_backtest.py
      - research_v138_final_horizon_compare.py
      - .github/workflows/backtest-v138-final-horizon-compare.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        days: [30, 92, 183]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HORIZON_DAYS: ${{ matrix.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile backtest sources
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v138_final_horizon_compare.py
      - name: Verify authoritative V1.3.8 is unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research_v138_final_3m_backtest.py').read_text()
          w=Path('research_v138_final_horizon_compare.py').read_text()
          for token in (
              'FIRST_POSITION = 1_000.0',
              'SECOND_POSITION = 2_000.0',
              'if value >= 8.0:',
              'if value >= 6.0:',
              'trigger_ok and macd5 and hstate != "opposite" and space_ok',
              'front_r >= 1.3',
              'LOSS_PAUSE_MS = 6 * 60 * 60 * 1000',
              'mult = {1: 1.0, 2: 2.0}[ti]',
              'dist = atr15 * STOP_ATR',
          ):
              assert token in s, token
          raw=s.split('raw = (',1)[1].split(')',1)[0]
          assert 'trigger' not in raw.lower()
          assert '2026, 9, 12, 10, 57' in w
          assert 'DAYS not in (30, 92, 183)' in w
          assert 'signal_tier' not in w
          assert 'V138FinalMarket' not in w
          assert 'V138Simulator' not in w
          print('PASS: strategy untouched; wrapper changes fixed historical horizon only')
          PY
      - name: Run fixed-window V1.3.8 backtest
        run: python research_v138_final_horizon_compare.py
      - name: Show result summary
        if: success()
        run: |
          cat backtest_output_v138_final_horizon_${HORIZON_DAYS}d/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v138_final_horizon_${HORIZON_DAYS}d/V138_FINAL_BTC_SWAP_${HORIZON_DAYS}D_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAYTRADE-V138-FINAL-BTC-${{ matrix.days }}D-CURRENT-VERSION-BACKTEST
          path: backtest_output_v138_final_horizon_${{ matrix.days }}d/
          if-no-files-found: error
          retention-days: 14
