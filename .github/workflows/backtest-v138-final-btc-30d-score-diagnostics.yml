name: Backtest KAYTRADE V1.3.8 Final BTC 30D Score Diagnostics

on:
  push:
    branches:
      - research/v138-final-btc-30d-no-loss-pause
    paths:
      - research_v138_final_30d_score_diagnostics.py
      - .github/workflows/backtest-v138-final-btc-30d-score-diagnostics.yml
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile diagnostics
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v138_final_30d_backtest.py research_v138_final_30d_score_diagnostics.py
      - name: Verify diagnostics are observation-only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research_v138_final_30d_score_diagnostics.py').read_text()
          base=Path('research_v138_final_3m_backtest.py').read_text()
          assert 'v138.V138Simulator.submit = diagnostic_submit' in s
          assert 'v138.write_report = diagnostic_write_report' in s
          assert '2026, 8, 13, 10, 57' in s and '2026, 9, 12, 10, 57' in s
          for token in ('FIRST_POSITION = 1_000.0','SECOND_POSITION = 2_000.0','front_r >= 1.3','trigger_ok and macd5 and hstate != "opposite" and space_ok'):
              assert token in base, token
          print('PASS: diagnostics only, baseline V1.3.8 strategy preserved')
          PY
      - name: Run score diagnostics
        run: python research_v138_final_30d_score_diagnostics.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V138-FINAL-BTC-30D-SCORE-DIAGNOSTICS
          path: |
            backtest_output_v138_final_30d_score_diagnostics/V138_FINAL_BTC_SWAP_30D_ScoreDiagnostics.csv
            backtest_output_v138_final_30d_score_diagnostics/V138_FINAL_BTC_SWAP_30D_ScoreDiagnostics_Report.md
            backtest_output_v138_final_30d_score_diagnostics/score_diagnostics.json
            backtest_output_v138_final_30d_score_diagnostics/V138_FINAL_BTC_SWAP_30D_Trades.csv
            backtest_output_v138_final_30d_score_diagnostics/V138_FINAL_BTC_SWAP_30D_Cycles.csv
          retention-days: 14
