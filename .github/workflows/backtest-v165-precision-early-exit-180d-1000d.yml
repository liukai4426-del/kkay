name: Backtest V1.6.5 Precision Early Exit 180D 1000D

on:
  push:
    branches: [research/v165-precision-early-exit-180d-1000d]
    paths:
      - run_v165_precision_early_exit_compare.py
      - .github/workflows/backtest-v165-precision-early-exit-180d-1000d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: precision-ee-${{ matrix.days }}d
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        days: [180, 1000]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize audited historical simulator
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

      - name: Compile and verify lock
        run: |
          python -m py_compile \
            research_v146_backtest.py \
            research_v1544_cache_patch.py \
            research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py \
            v152_model.py v153_model.py v154_model.py \
            v160_model.py v161_model.py v162_model.py v163_model.py v164_model.py v165_model.py \
            v154_build1544_patch.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v165_precision_early_exit_compare.py
          python - <<'PY'
          import run_v165_precision_early_exit_compare as bt
          d=${{ matrix.days }}
          start,end=bt._configure(d)
          bt._verify_lock(d,start,end)
          assert bt.production.VERSION=='1.6.5'
          assert bt.production.BOLL_OUTER_SCORE==2.5
          assert bt.production.VOLUME_HARD_GATE==1.2
          assert bt.base.BE_ENABLED is False
          print('PASS lock', d, start.isoformat(), end.isoformat())
          PY

      - name: Run A/B backtest
        run: time python run_v165_precision_early_exit_compare.py --days ${{ matrix.days }}

      - name: Verify results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=${{ matrix.days }}
          out=Path(f'backtest_output_v165_precision_ee_{d}d_2000u')
          c=json.loads((out/f'comparison_{d}d.json').read_text())
          b=json.loads((out/f'metrics_baseline_{d}d.json').read_text())
          e=json.loads((out/f'metrics_precision_{d}d.json').read_text())
          assert b['release']=='1.6.5' and e['release']=='1.6.5'
          assert b['days']==d and e['days']==d
          assert b['be_enabled'] is False and e['be_enabled'] is False
          assert b['volume_ratio_threshold']==1.2 and e['volume_ratio_threshold']==1.2
          assert 'matched_exit_quality' in c
          print('RESULT_SUMMARY')
          print(json.dumps({
            'days':d,
            'baseline':c['baseline'],
            'precision':c['precision_early_exit'],
            'delta':c['delta_precision_minus_baseline'],
            'quality':c['matched_exit_quality'],
          },ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.5-PRECISION-EE-${{ matrix.days }}D-2000U
          path: backtest_output_v165_precision_ee_${{ matrix.days }}d_2000u/
          if-no-files-found: error
          retention-days: 30
