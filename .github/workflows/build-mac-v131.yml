name: Build KAYTRADE Intel Mac 1.3.1
on:
  push:
    branches:
      - codex/v1-3-1-visual
    paths-ignore:
      - v131_visual_patch.py
      - .github/workflows/apply-v131-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Create application icon
        run: python build_icon.py
      - name: Test V1.3 strategy, structure, execution and safety regressions
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Verify V1.3.1 visual-only wiring
        run: |
          python -m py_compile app.py visual.py desktop.py
          python - <<'PY'
          from pathlib import Path
          a=Path('app.py').read_text(); v=Path('visual.py').read_text()
          for token in ('ScoreTable(', 'AnimatedScoreBar(', 'RoundedEntry(', 'RoundedCombobox(', 'KAYTRADE 1.3.1'):
              assert token in a, token
          for token in ('class ScoreTable', 'class AnimatedScoreBar', 'class RoundedEntry', 'class RoundedCombobox'):
              assert token in v, token
          assert "if side=='long':return GREEN if number>0 else RED" in v
          assert "if side=='short':return RED if number>0 else GREEN" in v
          print('V1.3.1 visual wiring OK')
          PY
      - name: Build KAYTRADE Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Check macOS compatibility metadata
        run: python verify_bundle.py
      - name: Test packaged KAYTRADE UI without network or orders
        run: |
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$RUNNER_TEMP/kaytrade-smoke.txt"
          test -s "$RUNNER_TEMP/kaytrade-smoke.txt"
          cat "$RUNNER_TEMP/kaytrade-smoke.txt"
          codesign --verify --deep --strict dist/KAYTRADE.app
          cp "$RUNNER_TEMP"/ui-*.png . || true
      - name: Create KAYTRADE 1.3.1 installer disk image
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.2.md installer/RELEASE-1.2.md
          cp RELEASE-1.2.1.md installer/RELEASE-1.2.1.md
          cp RELEASE-1.2.2.md installer/RELEASE-1.2.2.md
          cp RELEASE-1.2.3.md installer/RELEASE-1.2.3.md
          cp RELEASE-1.3.md installer/RELEASE-1.3.md
          cp RELEASE-1.3.1.md installer/RELEASE-1.3.1.md
          cp "$RUNNER_TEMP/kaytrade-smoke.txt" installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.1 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.1-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.1-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.1-Intel-test
          path: |
            KAYTRADE-1.3.1-Intel-test.dmg
            SHA256.txt
            ui-*.png
          if-no-files-found: error
          retention-days: 14
