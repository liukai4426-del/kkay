name: Apply V1.3 Partial Fill Safety
on:
  push:
    branches:
      - codex/v1-3-strategy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply partial-fill fail-safe patch
        run: |
          python hotfix_v13_partial.py
          python hotfix_v13_tests.py
      - name: Run V1.3 safety regression tests
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Commit patched V1.3 source
        run: |
          git checkout -- .github/workflows/hotfix-v13-partial.yml
          rm -f hotfix_v13_partial.py hotfix_v13_tests.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'V1.3: fail-safe partial limit fills [skip ci]'
          git push origin HEAD:codex/v1-3-strategy
