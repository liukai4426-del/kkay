name: Backtest Trend Pullback 180D + K-line Viewer

on:
  push:
    branches: [research/v170-trend-pullback-180d]
    paths:
      - run_v170_trend_pullback_180d.py
      - generate_v170_trend_pullback_180d_viewer.py
      - .github/workflows/backtest-v170-trend-pullback-180d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
      TRADE_VIEWER_SOURCE_DIR: backtest_output_v170_trend_pullback_180d
      TRADE_VIEWER_OUT: backtest_trade_viewer_v170_trend_pullback_180d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 180D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-180d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-180d-
            kaytrade-okx-btc-
          save-always: true

      - name: Materialize audited historical simulator and proven PEE4 stack
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py

          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py

      - name: Compile and verify Trend Pullback semantic lock
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            research_backtest_data_cache.py run_v168_180d_backtest_r2.py \
            run_v168_boll5_overext035_180d.py run_v168_boll5_overext035_pee3_mfe06_180d.py \
            run_v168_boll5_overext010_pee4_365d.py \
            run_v170_trend_pullback_180d.py generate_v170_trend_pullback_180d_viewer.py
          python - <<'PY'
          import run_v170_trend_pullback_180d as x
          s,e=x.configure()
          x.verify(s,e)
          assert x.DAYS == 180
          assert x.TrendPullbackModel.THRESHOLD == 0.0
          assert x.TrendPullbackModel.BOLL_TRIGGER_TIMEFRAME == '15m'
          assert x.FRONT_MIN_R == 1.50
          assert x.COST_MAX_R == 0.30
          assert x.LOCK_MS == 3600000
          print('PASS: 4H+1H full trend -> closed 15m outer touch -> Front>1.50R -> Cost<0.30R -> fixed1x; 1H ATR SL / 2R / PEE4 / Lock1H')
          PY

      - name: Run Trend Pullback 180D backtest
        run: time python run_v170_trend_pullback_180d.py

      - name: Verify 180D result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v170_trend_pullback_180d/result_v170_trend_pullback_180d.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['window']['days'] == 180
          s=d['strategy_lock']
          assert s['score_system'] is False
          assert s['boll_width_gate'] is False
          assert s['front_r_rule'] == '> 1.50R strictly'
          assert s['cost_r_rule'] == '< 0.30R strictly'
          assert s['stop'] == '1.0 x 1H ATR'
          assert s['tp'] == '2R full position'
          assert s['pee_version'] == '4.0-tiered-boolean'
          assert s['pee4_post_exit_entry_lock_minutes'] == 60
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - name: Generate self-contained K-line viewer
        run: time python generate_v170_trend_pullback_180d_viewer.py

      - name: Verify viewer
        run: |
          test -s backtest_trade_viewer_v170_trend_pullback_180d/KAYTRADE-V1.7-Trend-Pullback-180D-Trade-Viewer.html
          grep -q 'Trend Pullback 180D' backtest_trade_viewer_v170_trend_pullback_180d/KAYTRADE-V1.7-Trend-Pullback-180D-Trade-Viewer.html
          python - <<'PY'
          from pathlib import Path
          p=Path('backtest_trade_viewer_v170_trend_pullback_180d/KAYTRADE-V1.7-Trend-Pullback-180D-Trade-Viewer.html')
          text=p.read_text(encoding='utf-8')
          print('VIEWER_BYTES',p.stat().st_size)
          assert p.stat().st_size > 500_000
          assert 'Front R' in text and 'Cost R' in text
          a=text.rfind('<script>'); b=text.rfind('</script>')
          assert a >= 0 and b > a
          Path('/tmp/trend-pullback-viewer.js').write_text(text[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/trend-pullback-viewer.js

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-Trend-Pullback-180D-2000U-with-Viewer
          path: |
            backtest_output_v170_trend_pullback_180d/
            backtest_trade_viewer_v170_trend_pullback_180d/
          if-no-files-found: error
          retention-days: 30
