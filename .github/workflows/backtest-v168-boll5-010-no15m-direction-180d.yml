name: Backtest V1.6.8 BOLL5 010 No15mDirection 180D 2000U

on:
  push:
    branches: [research/v168-boll5-010-no15m-direction-180d]
    paths:
      - run_v168_boll5_overext010_no15mdir_180d.py
      - .github/workflows/backtest-v168-boll5-010-no15m-direction-180d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: BOLL5 0.10 ATR + 1H-only direction 180D
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: python -m pip install 'certifi==2025.8.3' 'websocket-client==1.8.0'

      - name: Restore audited 180D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-v168-okx-btc-180d-end-20260914-market-v1
          restore-keys: |
            kaytrade-v168-okx-btc-180d-
            kaytrade-okx-btc-

      - name: Materialize audited historical simulator and proven R2 path
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v166-15m-boll-macd-adverse-only-360d-fast
          git show FETCH_HEAD:run_v160_365d_2000u.py > run_v160_365d_2000u.py
          git show FETCH_HEAD:run_v165_1000d_2000u.py > run_v165_1000d_2000u.py
          git show FETCH_HEAD:run_v166_entry_expansion_4way_360d.py > run_v166_entry_expansion_4way_360d.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast.py > run_v166_15m_boll_macd_adverse_only_360d_fast.py
          git show FETCH_HEAD:run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py > run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py
          git show FETCH_HEAD:research_backtest_data_cache.py > research_backtest_data_cache.py
          git show FETCH_HEAD:v165_model.py > v165_model.py
          git show FETCH_HEAD:v164_model.py > v164_model.py
          git show FETCH_HEAD:v163_model.py > v163_model.py
          git show FETCH_HEAD:v154_model.py > v154_model.py
          git show FETCH_HEAD:v153_model.py > v153_model.py
          git show FETCH_HEAD:v152_model.py > v152_model.py

      - name: Preflight audit
        run: |
          python -m py_compile \
            research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            research_backtest_data_cache.py run_v168_180d_backtest_r2.py \
            run_v168_boll5_overext035_180d.py run_v168_boll5_overext035_noema1h_180d.py \
            run_v168_boll5_overext010_no15mdir_180d.py \
            v152_model.py v153_model.py v154_model.py v163_model.py v164_model.py v165_model.py
          python -m unittest -v test_v168_update
          python - <<'PY'
          import run_v168_boll5_overext010_no15mdir_180d as r
          r.install_variant()
          sc=r.x.prev.base.proven.prod.base.signal_core
          assert sc.trend_direction is r._trend_direction_1h_only
          assert abs(r.x.prev.OVEREXT_ATR_MULT - 0.10) < 1e-12
          assert r.x.prev.base.THRESHOLD == 6.0
          assert r.x.prev.base.BOLL_WINDOW_MS == 900000
          assert r.x.prev.base.research.Simulator.process_exit is r.x.prev.base.proven._ORIG_EXIT
          print('AUDIT PASS: V1.6.8 R2 NoEMA1H + BOLL5 0.10 ATR; 15m EMA20/50 removed from main direction gate only; 1H gate retained')
          PY

      - name: Run audited 180D A/B backtest
        run: time python run_v168_boll5_overext010_no15mdir_180d.py

      - name: Verify result payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v168_boll5_overext010_noema1h_no15mdir_180d/result_v168_boll5_overext010_noema1h_no15mdir_180d.json')
          d=json.loads(p.read_text())
          assert d['window']['days'] == 180
          s=d['strategy_lock']
          assert s['1h_ema9_26_score_enabled'] is False
          assert s['1h_ema9_26_score'] == 0.0
          assert abs(float(s['5m_boll_overextension_threshold_atr14']) - 0.10) < 1e-12
          assert s['main_direction_hard_gate'] == '1H only'
          assert s['15m_ema20_ema50_direction_hard_gate'] is False
          assert s['15m_ema50_move_score_retained'] is True
          assert s['boll_signal_lifetime_ms'] == 900000
          assert s['break_even'] is False and s['pee'] is False and s['adx'] is False
          assert int(d['metrics']['trades'] or 0) > 0
          print(json.dumps({
            'trades': d['metrics']['trades'],
            'wins': d['metrics']['wins'],
            'win_rate_pct': d['metrics']['win_rate_pct'],
            'net_pnl': d['metrics']['net_pnl'],
            'profit_factor': d['metrics']['profit_factor'],
            'max_drawdown_pct': d['metrics']['max_drawdown_pct'],
            'direction_gate_ab': d.get('direction_gate_ab'),
          }, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.8-BOLL5-010-NOEMA1H-NO15MDIR-180D-2000U
          path: backtest_output_v168_boll5_overext010_noema1h_no15mdir_180d/
          if-no-files-found: error
          retention-days: 30
