name: Backtest KAYTRADE V1.3.8 Final BTC 30D Entry5 Single Signal No Loss Pause

on:
  push:
    branches:
      - research/v138-final-btc-30d-entry5-single-signal-no-losspause

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research backtest
        run: python -m py_compile research_v146_backtest.py research_v138_final_3m_backtest.py research_v138_final_30d_backtest.py research_v138_final_30d_entry5_backtest.py research_v138_final_30d_entry5_single_signal_backtest.py research_v138_final_30d_entry5_single_signal_no_losspause.py
      - name: Verify one-variable comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research_v138_final_30d_entry5_single_signal_no_losspause.py').read_text()
          base=Path('research_v138_final_3m_backtest.py').read_text()
          assert 'entry_threshold' in s and '5.0' in s
          assert 'single_signal_only' in s and 'add_on_enabled' in s
          assert 'consecutive_loss_pause_enabled' in s and 'False' in s
          assert 'def can_signal' in s and 'loss_pause_until_ms and signal_ms < self.loss_pause_until_ms' not in s
          assert 'self.loss_pause_until_ms = 0' in s
          assert '2026, 8, 13, 10, 57' in s and '2026, 9, 12, 10, 57' in s
          for token in ('front_r >= 1.3','trigger_ok and macd5 and hstate != "opposite" and space_ok'):
              assert token in base, token
          print('PASS: exact-window A/B; 5-point single signal; only consecutive-loss pause disabled')
          PY
      - name: Run backtest
        run: python research_v138_final_30d_entry5_single_signal_no_losspause.py
      - name: Show summary
        run: cat backtest_output_v138_final_30d_entry5_single_signal_no_losspause/metrics.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V138-FINAL-BTC-30D-ENTRY5-SINGLE-SIGNAL-NOPAUSE
          path: backtest_output_v138_final_30d_entry5_single_signal_no_losspause/
          retention-days: 14
