name: Fix V1.2.3 engine test threshold fixture
on:
  push:
    branches:
      - codex/v1-2-3-scoring
    paths:
      - .github/workflows/v123-test-fixture-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v1-2-3-scoring
      - name: Update engine fixture from 7 to 8
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test_engine.py'); text=p.read_text()
          old="'scores':{'做多':{'gate':True,'total':7}}"
          new="'scores':{'做多':{'gate':True,'total':8}}"
          if old not in text: raise SystemExit('engine score fixture not found')
          p.write_text(text.replace(old,new))
          Path('.github/workflows/v123-test-fixture-once.yml').unlink()
          PY
      - name: Commit fixture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: align engine fixture with 8-point entry"
          git push
