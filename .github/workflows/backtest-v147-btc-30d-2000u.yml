name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D 2000U
on:
  push:
    branches: [research/v147-btc-1m-2000u-backtest]
    paths:
      - research_v146_backtest.py
      - research_v147_1m_2000u_backtest.py
      - .github/workflows/backtest-v147-btc-30d-2000u.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.4.7 research backtest
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py
      - name: Verify requested profile and V1.4.7 rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research_v147_1m_2000u_backtest.py').read_text()
          for token in ('CAPITAL = 2000.0','REWARD_R = 2.0','TIER_CAP = {1: 1000.0, 2: 1500.0, 3: 2000.0}','front_r < 1.3','hstate != "opposite"','macd5','valid_trigger'):
              assert token in s, token
          assert '"1Dutc"' not in s
          print('PASS: V1.4.7 30D / 2000U research profile verified')
          PY
      - name: Run V1.4.7 BTC-USDT-SWAP rolling 30-day backtest
        run: python research_v147_1m_2000u_backtest.py
      - name: Show result summary
        if: success()
        run: |
          cat backtest_output_v147_1m_2000u/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_1m_2000u/V147_BTC_SWAP_30D_2000U_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-2000U-BACKTEST
          path: |
            backtest_output_v147_1m_2000u/V147_BTC_SWAP_30D_2000U_Backtest_Report.md
            backtest_output_v147_1m_2000u/V147_BTC_SWAP_30D_2000U_Trades.csv
            backtest_output_v147_1m_2000u/V147_BTC_SWAP_30D_2000U_Cycles.csv
            backtest_output_v147_1m_2000u/V147_BTC_SWAP_30D_2000U_DailyEquity.csv
            backtest_output_v147_1m_2000u/metrics.json
          if-no-files-found: error
          retention-days: 14
