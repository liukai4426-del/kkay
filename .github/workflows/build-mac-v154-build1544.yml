name: Build KAYTRADE Intel Mac 1.5.4 Build1544
on:
  push:
    branches: [codex/v1-5-4-build1544-pathc-off]
    paths:
      - '**.py'
      - OKXLocal.spec
      - RELEASE-1.5.4-B1544.md
      - .github/workflows/build-mac-v154-build1544.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v154-build1544-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.5.4 Build 1544
        run: >-
          python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py
          v151_strategy_patch.py v152_model.py v152_strategy_patch.py v152_safety_patch.py
          v152_ui_busy_fix.py v152_backtest_core.py v153_model.py v153_runtime_patch.py
          v153_backtest_core.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py
          v154_record_card_boll_fix.py v154_fixed_card_precision_fix.py v154_build1543_patch.py
          v154_build1543_ui_cleanup.py v154_build1544_patch.py
          test_v154_strategy.py test_v154_round2_runtime.py test_v154_build1543.py
          test_v154_build1543_tk.py test_v154_build1544.py
      - name: Run preserved strategy and safety regressions
        run: |
          python -m unittest -v test_engine test_candles
          python -m unittest -v test_v135_execution test_v135_safety2 test_v135_order_state
          python -m unittest -v test_v136_runtime test_v137_strategy test_v138_strategy
          python -m unittest -v test_v141_exit_limit test_v143_score_arbitration
          python -m unittest -v test_v146_ui_fix test_v147_strategy
          python -m unittest -v test_v150_strategy
          python -m unittest -v test_v151_strategy
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v152_ui_busy_fix
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v153_ui_scroll
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_ui_scroll
          python -m unittest -v test_v154_build1543
      - name: Run Build 1544 regressions
        run: python -m unittest -v test_v154_build1544
      - name: Verify Build 1544 production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import app, engine
          import v154_model as model
          import v154_build1543_patch as b1543
          import v154_build1544_patch as b1544
          spec=Path('OKXLocal.spec').read_text()
          assert model.VERSION == '1.5.4' and model.THRESHOLD == 6.0
          assert model.ENTRY_WINDOW_MS == 0 and model.TIME_WINDOW_ENABLED is False
          assert b1544.BUILD == '154.4' and b1544.PATH_C_ENABLED is False
          assert b1543._maybe_path_c is b1544._path_c_disabled
          assert engine.Engine._kaytrade_v154_build1544_applied
          assert app.App._kaytrade_v154_build1544_applied
          assert 'v154_build1544_patch.py' in spec
          assert "CFBundleShortVersionString': '1.5.4'" in spec
          assert "CFBundleVersion': '1544'" in spec
          print('PASS: V1.5.4 Build 1544 = Path C hard-off + no loss pause + first-signal LIMIT only')
          PY
  build:
    name: intel-mac-package-build1544
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run Build 1544 tests on Intel Mac
        run: |
          python -m py_compile v152_model.py v152_strategy_patch.py v152_safety_patch.py v152_ui_busy_fix.py v153_model.py v153_runtime_patch.py v154_model.py v154_runtime_patch.py v154_limit_log_fix.py v154_record_card_boll_fix.py v154_fixed_card_precision_fix.py v154_build1543_patch.py v154_build1543_ui_cleanup.py v154_build1544_patch.py test_v154_build1544.py build_icon.py
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v154_round2_runtime
          python -m unittest -v test_v154_build1543
          python -m unittest -v test_v154_build1543_tk
          python -m unittest -v test_v154_build1544
      - name: Create application icon
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle and Build 1544 hook
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.5.4'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1544'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create Build 1544 installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.5.4-B1544.md installer/RELEASE-1.5.4-B1544.md
          printf 'PASS: V1.5.4 Build 1544 disables Path C for all new decisions/orders, retains reconciliation for any pre-existing Path-C leg, keeps consecutive-loss pause disabled, and uses first-signal LIMIT entry only with existing Hard Blocks, 1H ATR stop and 2R TP.\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.5.4-B1544 -srcfolder installer -ov -format UDZO KAYTRADE-1.5.4-Intel-build1544.dmg
          shasum -a 256 KAYTRADE-1.5.4-Intel-build1544.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.5.4-Intel-build1544
          path: |
            KAYTRADE-1.5.4-Intel-build1544.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
