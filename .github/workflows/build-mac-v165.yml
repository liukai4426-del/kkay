name: Build KAYTRADE Intel Mac 1.6.5 Build1650

on:
  push:
    branches: [release/v1.6.5, fix/v165-runtime-network-state]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.6.5 Build1650
        run: python -m py_compile v160_model.py v160_update_patch.py v161_model.py v161_update_patch.py v162_model.py v162_update_patch.py v163_model.py v163_update_patch.py v163_ui_patch.py v164_model.py v164_update_patch.py v164_ui_patch.py v165_model.py v165_update_patch.py v165_algo_fallback_patch.py v165_runtime_network_patch.py v165_sleep_resume_patch.py v165_keepawake_patch.py v165_ui_patch.py test_v165_update.py test_v165_execution.py test_v165_runtime_network_state.py test_v165_sleep_resume.py test_v165_keepawake.py test_v165_ui.py desktop.py
      - name: Preserved regressions
        run: |
          python -m unittest -v test_engine
          python -m unittest -v test_candles
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v155_update
          python -m unittest -v \
            test_v156_build1561.V156Build1561Tests.test_fixed_loss_control_markers_cover_value_row_and_note \
            test_v156_build1561.V156Build1561Tests.test_identity_and_preserved_flags \
            test_v156_build1561.V156Build1561Tests.test_log_order_helper_is_newest_first_and_capped
          python -m unittest -v test_v160_update
          python -m unittest -v test_v161_update
          python -m unittest -v test_v162_update
          python -m unittest -v test_v163_update
          python -m unittest -v test_v163_ui
          python -m unittest -v test_v164_update
          python -m unittest -v test_v164_execution
          python -m unittest -v test_v164_ui
          python -m unittest -v test_v165_update
          python -m unittest -v test_v165_execution
          python -m unittest -v test_v165_runtime_network_state
          python -m unittest -v test_v165_sleep_resume
          python -m unittest -v test_v165_keepawake
          python -m unittest -v test_v165_ui
      - name: Verify V1.6.5 Build1650 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import app
          import engine
          import exchange
          import v138_strategy_patch as v138
          import v162_update_patch as v162
          import v165_model as model
          import v165_update_patch as runtime
          import v165_runtime_network_patch as netstate
          import v165_sleep_resume_patch as sleep_resume
          import v165_keepawake_patch as keepawake
          import v165_ui_patch as ui
          import v161_ui_status_patch as ui161
          spec=Path('OKXLocal.spec').read_text()
          desktop=Path('desktop.py').read_text()
          assert model.VERSION=='1.6.5' and model.THRESHOLD==6.0
          assert model.ENTRY_WINDOW_MS==300000 and model.TIME_WINDOW_ENABLED is True
          assert model.VOLUME_HARD_GATE==1.20 and model.BOLL_OUTER_SCORE==2.50
          assert runtime.VERSION=='1.6.5' and runtime.BUILD=='1650'
          assert v138._prepare_order is v162._prepare_order_v162
          assert runtime.v154_limit.model is model
          assert ui.VERSION_SUBTITLE=='BTC / USDT   ·   V1.6.5'
          assert ui.BUILD=='1650'
          assert app.App.arm is ui.app_arm_v165
          assert getattr(exchange.Exchange,'_kaytrade_v165_runtime_network_state_applied',False)
          assert getattr(engine.Engine,'_kaytrade_v165_sleep_resume_applied',False)
          assert getattr(app.App,'_kaytrade_v165_keepawake_applied',False)
          labels=dict(ui161._STATUS_ITEMS)
          assert 'funds' not in labels
          assert labels['volume_gate']=='Volume<1.20×'
          assert labels['signal_window']=='最新5m信号周期'
          assert labels['boll']=='5m外轨BOLL'
          assert "runtime_hooks=[str(root / 'v165_update_patch.py')]" in spec
          assert "CFBundleShortVersionString': '1.6.5'" in spec
          assert "CFBundleVersion': '1650'" in spec
          assert 'apply_v165_runtime_network_patch' in desktop
          assert 'apply_v165_sleep_resume_patch' in desktop and 'apply_v165_keepawake_patch' in desktop
          auth=ui._authorization_text(type('O',(),{'engine':type('E',(),{'x':type('X',(),{'demo':True})()})()})(), type('S',(),{'leverage':5,'risk_usdt':20,'capital':2000,'risk_pct':1,'max_notional':1000})())
          assert '1D EMA' not in auth and '1m Trigger' not in auth and '请输入' not in auth
          print('PASS V1.6.5 Build1650 wiring / bounded Algo reads / sleep soft-stop / Mac keep-awake')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - run: python -m unittest -v test_v165_update
      - run: python -m unittest -v test_v165_execution
      - run: python -m unittest -v test_v165_runtime_network_state
      - run: python -m unittest -v test_v165_sleep_resume
      - run: python -m unittest -v test_v165_keepawake
      - run: python -m unittest -v test_v165_ui
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.6.5'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1650'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged UI smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.6.5' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.6.5.md installer/RELEASE-1.6.5.md
          printf 'KAYTRADE V1.6.5 Build1650\nRuntime network-state fix: Algo Trigger/Trailing demo 51054 uses bounded single-read + 5-minute circuit breaker; slow OKX reads no longer masquerade as Mac sleep. Real sleep/long pause soft-stops automatic entry without a permanent fault lock. Mac keep-awake remains active while auto trading is authorized.\n' > installer/RELEASE-1.6.5.txt
          hdiutil create -volname 'KAYTRADE 1.6.5' -srcfolder installer -ov -format UDZO KAYTRADE-1.6.5-Intel-build1650.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.6.5-Intel-build1650
          path: |
            KAYTRADE-1.6.5-Intel-build1650.dmg
            installer/RELEASE-1.6.5.md
            installer/RELEASE-1.6.5.txt
          if-no-files-found: error
