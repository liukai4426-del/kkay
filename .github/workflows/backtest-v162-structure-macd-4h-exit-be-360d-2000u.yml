name: Backtest V1.6.2 Structure MACD 4H Exit BE 360D 2000U

on:
  push:
    branches: [research/v162-structure-macd-4h-exit-be-360d-2000u]
    paths:
      - run_v162_structure_macd_4h_exit_be_360d_2000u.py
      - .github/workflows/backtest-v162-structure-macd-4h-exit-be-360d-2000u.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: structure-macd-4h-exit-be-360d-2000u
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Materialize audited historical simulator
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
          git fetch --depth=1 origin research/v161-4h-only-no-be-360d-2000u
          git show FETCH_HEAD:run_v161_360d_2000u.py > run_v161_360d_2000u.py
          git show FETCH_HEAD:run_v161_4h_only_no_be_360d_2000u.py > run_v161_4h_only_no_be_360d_2000u.py
          git fetch --depth=1 origin research/v162-360d-2000u
          git show FETCH_HEAD:run_v162_360d_2000u.py > run_v162_360d_2000u.py

      - name: Compile and verify strict A/B lock
        run: |
          python -m py_compile \
            research_v146_backtest.py \
            research_v1544_cache_patch.py \
            research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py \
            v152_model.py v153_model.py v154_model.py v160_model.py v161_model.py v162_model.py \
            v154_build1544_patch.py \
            run_v161_360d_2000u.py \
            run_v161_4h_only_no_be_360d_2000u.py \
            run_v162_360d_2000u.py \
            research_v162_outer_rsi_macd_model.py \
            run_v162_outer_rsi30_70_macd_360d_2000u.py \
            run_v162_structure_macd_4h_exit_be_360d_2000u.py
          python - <<'PY'
          import run_v162_structure_macd_4h_exit_be_360d_2000u as bt
          start, end = bt._configure_and_patch()
          bt._verify_exit_patch()
          assert start.isoformat() == '2025-09-19T20:20:00+00:00'
          assert end.isoformat() == '2026-09-14T20:20:00+00:00'
          assert bt.baseline.DAYS == 360
          assert bt.baseline.CAPITAL == 2000.0
          assert bt.baseline.BASE_POSITION_NOTIONAL == 2000.0
          assert bt.baseline.LEVERAGE == 5
          assert bt.baseline.RISK_USDT == 20.0
          assert bt.baseline.DAILY_LOSS == 60.0
          assert bt.production.RSI_MIN == 30.0
          assert bt.production.RSI_MAX == 70.0
          assert bt.baseline.BE_ENABLED is False
          assert bt.STRUCTURE_BREAK_ATR == 0.25
          assert bt.MONITOR_MAX_MS == 4 * 60 * 60_000
          assert bt.LIMIT_PROTECTION_BPS == 5.0
          print('PASS: exact outer baseline + only first-4H structure/MACD position management')
          print('WINDOW', start.isoformat(), end.isoformat())
          PY

      - name: Run 360-day A/B backtest
        run: time python run_v162_structure_macd_4h_exit_be_360d_2000u.py

      - name: Verify result files and management diagnostics
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out = Path('backtest_output_v162_structure_macd_4h_exit_be_360d_2000u')
          m = json.loads((out/'metrics_360d.json').read_text())
          rows = list(csv.DictReader((out/'trades_360d.csv').open())) if (out/'trades_360d.csv').stat().st_size else []
          assert m['release_base'] == '1.6.2'
          assert m['research_variant'] == 'outer_only_rsi30_70_macd_structure_break_macd_4h_loss_limit_be'
          assert m['days'] == 360
          assert m['start_utc'] == '2025-09-19T20:20:00+00:00'
          assert m['end_utc'] == '2026-09-14T20:20:00+00:00'
          assert m['entry_volume_score_retained'] is True
          assert m['entry_volume_score_points'] == 0.5
          assert m['outer_only'] is True
          assert m['outer_macd_improving_required'] is True
          assert m['outer_4h_aligned_required'] is True
          assert m['management_monitor_max_hold_min'] == 240
          assert m['management_requires_full_post_fill_15m_candle'] is True
          assert m['management_structure_break_atr15'] == 0.25
          assert m['stop_atr_timeframe'] == '1H'
          assert m['stop_atr_multiplier'] == 1.0
          assert m['reward_r'] == 2.0
          assert len(rows) == m['trades']
          exits = [r for r in rows if r.get('reason') == 'STRUCTURE_MACD_LOSS_LIMIT_EXIT_4H']
          assert len(exits) == m['structure_macd_loss_limit_exit_trades']
          for r in exits:
              assert 0.0 <= float(r['hold_min']) <= 240.0
              assert float(r['exit_structure_break_atr']) >= 0.25
              assert r['exit_order_type'] == 'MARKETABLE_LIMIT_PROXY'
              assert float(r['exit_signal_current_r']) < 0.0
          be_rows = [r for r in rows if float(r.get('structure_macd_be_armed') or 0.0) == 1.0]
          assert len(be_rows) == m['structure_macd_be_armed_trades']
          for r in be_rows:
              assert float(r['structure_macd_be_signal_r']) >= 1.0
          print('RESULT_METRICS_JSON')
          print(json.dumps(m, ensure_ascii=False, indent=2))
          print('LOSS_LIMIT_EXIT_COUNT', len(exits))
          print('BE_ARMED_TRADE_COUNT', len(be_rows))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.2-STRUCTURE-MACD-4H-EXIT-BE-360D-2000U
          path: backtest_output_v162_structure_macd_4h_exit_be_360d_2000u/
          if-no-files-found: error
          retention-days: 30
