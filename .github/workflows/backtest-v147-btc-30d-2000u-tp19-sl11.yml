name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D 2000U TP1.9ATR SL1.1ATR

on:
  push:
    branches:
      - research/v147-btc-30d-2000u-tp19-sl11
    paths:
      - research_v147_tp19_sl11_backtest.py
      - .github/workflows/backtest-v147-btc-30d-2000u-tp19-sl11.yml
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research scenario
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py research_v147_tp19_sl11_backtest.py
      - name: Verify requested geometry and comparison period
        run: |
          python - <<'PY'
          import research_v147_tp19_sl11_backtest as s
          assert s.STOP_ATR == 1.1
          assert s.TARGET_ATR == 1.9
          assert abs(s.REWARD_R - (1.9/1.1)) < 1e-12
          assert s.v.CAPITAL == 2000.0
          assert s.START.isoformat() == '2026-08-13T07:40:00+00:00'
          assert s.END.isoformat() == '2026-09-12T07:40:00+00:00'
          class Dummy:
              meta={'tickSz':0.1,'ctVal':0.01,'ctMult':1.0,'minSz':0.01,'lotSz':0.01}
              active=None
              def available(self, price): return 2000.0
          p=s.plan_tp19_sl11(Dummy(),'做多',1,5.0,70000.0,100.0,2000.0,60.0)
          assert p is not None
          entry,qty,notional,sl,tp,est,multiple=p
          assert abs((entry-sl)-110.0) <= 0.11
          assert abs((tp-entry)-190.0) <= 0.11
          assert abs((tp-entry)/(entry-sl)-(1.9/1.1)) < 0.01
          print('PASS: SL=15m ATR x1.1, TP=15m ATR x1.9, same 30-day sample')
          PY
      - name: Run V1.4.7 BTC 30-day TP1.9ATR SL1.1ATR backtest
        run: python research_v147_tp19_sl11_backtest.py
      - name: Show result summary
        run: |
          cat backtest_output_v147_tp19_sl11/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_tp19_sl11/V147_BTC_SWAP_30D_2000U_TP19_SL11_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-2000U-TP19-SL11-BACKTEST
          path: |
            backtest_output_v147_tp19_sl11/V147_BTC_SWAP_30D_2000U_TP19_SL11_Backtest_Report.md
            backtest_output_v147_tp19_sl11/V147_BTC_SWAP_30D_2000U_TP19_SL11_Trades.csv
            backtest_output_v147_tp19_sl11/V147_BTC_SWAP_30D_2000U_TP19_SL11_Cycles.csv
            backtest_output_v147_tp19_sl11/V147_BTC_SWAP_30D_2000U_TP19_SL11_DailyEquity.csv
            backtest_output_v147_tp19_sl11/metrics.json
          if-no-files-found: error
          retention-days: 14
