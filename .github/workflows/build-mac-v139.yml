name: Build KAYTRADE Intel Mac 1.3.9 Position Caps
on:
  push:
    branches: [codex/v1-3-9-position-cap]
    paths:
      - candles.py
      - engine.py
      - exchange.py
      - app.py
      - strategy.py
      - visual.py
      - desktop.py
      - OKXLocal.spec
      - v135_patch.py
      - v135_execution_patch.py
      - v135_flatten_noop_hotfix.py
      - v135_auto_entry_guard.py
      - v136_runtime.py
      - v136_entry_fix.py
      - v137_strategy_patch.py
      - v137_cancel_fix.py
      - v138_strategy_patch.py
      - v139_position_patch.py
      - test_v139_position.py
      - RELEASE-1.3.9.md
      - .github/workflows/build-mac-v139.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v139-strategy-and-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.3.9 runtime
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py v137_strategy_patch.py v137_cancel_fix.py v138_strategy_patch.py v139_position_patch.py test_v139_position.py
      - name: Run preserved safety and strategy tests
        run: |
          python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
          python -m unittest -v test_v137_strategy test_v137_cancel_fix
          python -m unittest -v test_v138_strategy
      - name: Run V1.3.9 tests
        run: python -m unittest -v test_v139_position
      - name: Verify V1.3.9 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v139_position_patch.py').read_text()
          assert 'v139_position_patch.py' in spec
          assert "CFBundleShortVersionString': '1.3.9'" in spec
          for token in ('V139_THRESHOLD=4.5','max_initial_notional','最大名义总仓位','4.5–5.0','V139ConnectionNote.TLabel'):
              assert token in patch, token
          print('PASS: V1.3.9 runtime/position-cap wiring')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.3.9 tests on Intel Mac
        run: |
          python -m py_compile v139_position_patch.py test_v139_position.py
          python -m unittest -v test_v139_position
      - name: V1.3.9 UI source smoke test
        run: |
          python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch
          import v139_position_patch
          import v138_strategy_patch
          import app
          root=tk.Tk()
          try:
              with patch.object(app.App,'worker',lambda self: None):
                  ui=app.App(root,Path(tempfile.mkdtemp(prefix='kaytrade139-')))
                  root.update()
                  assert '1.3.9' in root.title()
                  assert ui.fields['score_threshold'].get()=='4.5'
                  assert 'max_initial_notional' in ui.fields
                  threshold=[w for w in v138_strategy_patch._widgets(root) if isinstance(w,app.RoundedEntry) and getattr(w,'variable',None) is ui.fields['score_threshold']]
                  assert len(threshold)==1 and str(threshold[0].entry.cget('state'))=='disabled'
                  labels=[]
                  note=None
                  for w in v138_strategy_patch._widgets(root):
                      try:text=str(w.cget('text') or '')
                      except Exception:continue
                      labels.append(text)
                      if text.startswith('密钥仅保存在本次运行内存'):
                          note=w
                  assert '最大名义首仓 USDT（仅限制第一笔）' in labels
                  assert '最大名义总仓位 USDT（整轮上限）' in labels
                  assert note is not None
                  assert str(note.cget('style'))=='V139ConnectionNote.TLabel'
                  assert note.cget('text').count('\n')==4
                  style=app.ttk.Style(root)
                  assert style.lookup('V139ConnectionNote.TLabel','background')==app.PANEL
                  assert style.lookup('V139ConnectionNote.TLabel','foreground')==app.MUTED
                  settings=ui.settings()
                  assert settings.score_threshold==4.5
                  assert settings.max_initial_notional<=settings.max_notional
                  ui.finished.set(); ui.lock.close()
          finally:
              root.destroy()
          print('PASS: V1.3.9 UI split caps, fixed 4.5 threshold and compact borderless connection note')
          PY
      - name: Create application icon
        run: python build_icon.py
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.3.9'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.3.9.md installer/RELEASE-1.3.9.md
          printf 'PASS: V1.3.9 position-cap tests + Intel build + UI smoke test\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.3.9 -srcfolder installer -ov -format UDZO KAYTRADE-1.3.9-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.3.9-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.3.9-Intel-test
          path: |
            KAYTRADE-1.3.9-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
