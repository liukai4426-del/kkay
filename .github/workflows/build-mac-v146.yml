name: Build KAYTRADE Intel Mac 1.4.6 UI Log Polish
on:
  push:
    branches: [codex/v1-4-6-ui-log-polish]
    paths:
      - candles.py
      - engine.py
      - exchange.py
      - app.py
      - strategy.py
      - visual.py
      - desktop.py
      - build_icon.py
      - OKXLocal.spec
      - assets/kaytrade-v142-logo.png
      - v135_patch.py
      - v135_execution_patch.py
      - v135_flatten_noop_hotfix.py
      - v135_auto_entry_guard.py
      - v136_runtime.py
      - v136_entry_fix.py
      - v137_strategy_patch.py
      - v137_cancel_fix.py
      - v138_strategy_patch.py
      - v139_position_patch.py
      - v140_score_dialog_patch.py
      - v141_dialog_signal_positions_patch.py
      - v141_history_return_chart_patch.py
      - v141_exit_limit_patch.py
      - v142_visual_patch.py
      - v143_score_arbitration_patch.py
      - v143_visual_polish_patch.py
      - v144_ui_polish_patch.py
      - v145_layout_fix_patch.py
      - v146_ui_log_polish_patch.py
      - test_v141_dialog_signal_positions.py
      - test_v141_history_return_chart.py
      - test_v141_exit_limit.py
      - test_v142_visual.py
      - test_v143_score_arbitration.py
      - test_v143_visual_polish.py
      - test_v144_ui_polish.py
      - test_v145_layout_fix.py
      - test_v146_ui_log_polish.py
      - RELEASE-1.4.6.md
      - .github/workflows/build-mac-v146.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: v146-strategy-safety-ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.4.6 runtime
        run: python -m py_compile strategy.py engine.py exchange.py candles.py core.py app.py visual.py v137_strategy_patch.py v137_cancel_fix.py v138_strategy_patch.py v139_position_patch.py v140_score_dialog_patch.py v141_dialog_signal_positions_patch.py v141_history_return_chart_patch.py v141_exit_limit_patch.py v142_visual_patch.py v143_score_arbitration_patch.py v143_visual_polish_patch.py v144_ui_polish_patch.py v145_layout_fix_patch.py v146_ui_log_polish_patch.py test_v146_ui_log_polish.py build_icon.py
      - name: Run preserved safety and strategy tests
        run: |
          python -m unittest -v test_engine test_candles test_v134 test_v135 test_v135_execution test_v135_safety2
          python -m unittest -v test_v135_order_state test_v135_ack test_v135_fills test_v135_runtime_stability
          python -m unittest -v test_v135_auto_entry_guard
          python -m unittest -v test_v136_runtime test_v136_entry_fix
          python -m unittest -v test_v137_strategy test_v137_cancel_fix
          python -m unittest -v test_v138_strategy
          python -m unittest -v test_v139_position
          python -m unittest -v test_v140_score_dialog
          python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit
      - name: Run V1.4.2 through V1.4.5 regression tests
        run: python -m unittest -v test_v142_visual test_v143_score_arbitration test_v143_visual_polish test_v144_ui_polish test_v145_layout_fix
      - name: Run V1.4.6 UI/log tests
        run: python -m unittest -v test_v146_ui_log_polish
      - name: Verify V1.4.6 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          spec=Path('OKXLocal.spec').read_text()
          patch=Path('v146_ui_log_polish_patch.py').read_text()
          assert 'v146_ui_log_polish_patch.py' in spec
          assert "CFBundleShortVersionString': '1.4.6'" in spec
          assert "CFBundleVersion': '146'" in spec
          for token in ('ENERGY_BAR_SCALE=1.6','BRAND_SCALE=1.2','运行记录','所有策略循环与安全拦截','WAIT_COLOR','ALARM_COLOR','NORMAL_COLOR','_align_account_network','_build_log_card'):
              assert token in patch, token
          print('PASS: V1.4.6 UI/log runtime wired')
          PY
  build:
    name: intel-mac-package
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - name: Re-run V1.4.1 through V1.4.6 tests on Intel Mac
        run: |
          python -m py_compile v141_dialog_signal_positions_patch.py v141_history_return_chart_patch.py v141_exit_limit_patch.py v142_visual_patch.py v143_score_arbitration_patch.py v143_visual_polish_patch.py v144_ui_polish_patch.py v145_layout_fix_patch.py v146_ui_log_polish_patch.py test_v141_dialog_signal_positions.py test_v141_history_return_chart.py test_v141_exit_limit.py test_v142_visual.py test_v143_score_arbitration.py test_v143_visual_polish.py test_v144_ui_polish.py test_v145_layout_fix.py test_v146_ui_log_polish.py build_icon.py
          python -m unittest -v test_v141_dialog_signal_positions test_v141_history_return_chart test_v141_exit_limit test_v142_visual test_v143_score_arbitration test_v143_visual_polish test_v144_ui_polish test_v145_layout_fix test_v146_ui_log_polish
      - name: V1.4.6 UI smoke test
        run: |
          python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch
          import v146_ui_log_polish_patch as v146
          import app
          root=tk.Tk(); root.geometry('1400x900')
          try:
              with patch.object(app.App,'worker',lambda self: None):
                  ui=app.App(root,Path(tempfile.mkdtemp(prefix='kaytrade146-')))
                  root.geometry('1400x900'); root.update_idletasks(); root.update()
                  assert '1.4.6' in root.title()
                  assert getattr(ui,'_v145_layout_full_width',False)
                  assert getattr(ui,'_v146_status_row_aligned',False)
                  assert getattr(ui,'_v146_log_redesign',False)
                  assert getattr(ui,'_v146_log_filter_removed',False)
                  assert ui._v146_brand_title.cget('style')=='V146BrandTitle.TLabel'
                  assert ui._v146_brand_meta.cget('style')=='V146BrandMeta.TLabel'
                  assert getattr(ui._v142_logo_widget,'_kaytrade_v146_logo',False)
                  assert int(float(ui._v142_logo_widget.cget('width'))) >= v146.HEADER_LOGO_CANVAS
                  assert ui.env_label.master is ui._v146_network_label.master
                  assert ui.env_label.winfo_y()==ui._v146_network_label.winfo_y()
                  assert not ui._v146_hidden_log_filter.winfo_ismapped()
                  assert not ui.log.winfo_ismapped()
                  assert len(ui.score_bars)==2
                  for bar in ui.score_bars.values():
                      assert int(float(bar.cget('height'))) == v146.ENERGY_BAR_HEIGHT
                      assert getattr(bar,'_v146_thickness_scale',0)==1.6
                      assert getattr(bar,'_v146_max_round',False)
                  ui.log_lines=[('log','2026-09-12 03:50:00 等待最新收盘K线'),('alarm','2026-09-12 03:50:02 警报：测试警报'),('log','2026-09-12 03:50:04 连接成功')]
                  ui.render_logs(); root.update_idletasks(); root.update()
                  row_text=[]
                  def walk(w):
                      for c in w.winfo_children():
                          try:
                              t=str(c.cget('text') or '')
                              if t:row_text.append(t)
                          except Exception:pass
                          walk(c)
                  walk(ui._v146_log_rows)
                  for token in ('等待中','警报','正常运行'):
                      assert token in row_text, (token,row_text)
                  ui.finished.set(); ui.lock.close()
          finally:
              root.destroy()
          print('PASS: V1.4.6 energy bars, brand, status row and run-record card')
          PY
      - name: Create application icon from selected logo
        run: |
          python build_icon.py
          test -s OKXLocal.icns
      - name: Build Intel application
        run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify bundle
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.4.6'
          test -s dist/KAYTRADE.app/Contents/Resources/assets/kaytrade-v142-logo.png || find dist/KAYTRADE.app -name 'kaytrade-v142-logo.png' -print -quit | grep .
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.4.6.md installer/RELEASE-1.4.6.md
          printf 'PASS: V1.4.6 UI/log polish + V1.4.5 layout + V1.4.3 trading logic preserved\n' > installer/BUILD-TEST.txt
          ln -s /Applications installer/Applications
          hdiutil create -volname KAYTRADE-1.4.6 -srcfolder installer -ov -format UDZO KAYTRADE-1.4.6-Intel-test.dmg
          shasum -a 256 KAYTRADE-1.4.6-Intel-test.dmg > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.4.6-Intel-test
          path: |
            KAYTRADE-1.4.6-Intel-test.dmg
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
