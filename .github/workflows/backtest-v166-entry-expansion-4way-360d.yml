name: Backtest V1.6.6 Entry Expansion 4-Way 360D
on:
  push:
    branches: [research/v166-entry-expansion-4way-360d]
    paths:
      - run_v166_entry_expansion_4way_360d.py
      - .github/workflows/backtest-v166-entry-expansion-4way-360d.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize audited simulator
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py
      - name: Compile and verify lock
        run: |
          python -m py_compile research_v146_backtest.py research_v1544_cache_patch.py research_v1544_180d_backtest.py run_v1544_180d_fixed.py v152_model.py v153_model.py v154_model.py v160_model.py v161_model.py v162_model.py v163_model.py v164_model.py v165_model.py run_v160_365d_2000u.py run_v165_1000d_2000u.py run_v166_entry_expansion_4way_360d.py
          python - <<'PY'
          import run_v166_entry_expansion_4way_360d as x
          assert x.DAYS==360
          assert x.VARIANTS==('baseline','4h_neutral_allowed','macd_only_opposite_block','threshold_5_5','boll_middle_restored')
          assert x.prod.ENTRY_WINDOW_MS==300000
          assert x.base.BE_ENABLED is False
          print('PASS 360D four-way lock: BOLL lifetime exact 5m')
          PY
      - name: Run 360D four-way test
        run: time python run_v166_entry_expansion_4way_360d.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v166_entry_expansion_4way_360d/comparison_360d.json')
          c=json.loads(p.read_text())
          assert c['boll_signal_lifetime']=='5m exact'
          assert len(c['variants'])==5
          print(json.dumps(c,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.6-ENTRY-EXPANSION-4WAY-360D-2000U
          path: backtest_output_v166_entry_expansion_4way_360d/
          if-no-files-found: error
          retention-days: 30
