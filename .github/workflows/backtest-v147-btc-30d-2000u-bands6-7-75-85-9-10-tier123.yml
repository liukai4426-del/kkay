name: Backtest KAYTRADE V1.4.7 BTC SWAP 30D BANDS 6-7 7.5-8.5 9-10 TIER1-2-3

on:
  push:
    branches:
      - research/v147-btc-30d-2000u-bands6-7-75-85-9-10-tier123
    paths:
      - 'research_v146_backtest.py'
      - 'research_v147_1m_2000u_backtest.py'
      - 'research_v147_bands6_7_75_85_9_10_tier123_backtest.py'
      - '.github/workflows/backtest-v147-btc-30d-2000u-bands6-7-75-85-9-10-tier123.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research scenario
        run: python -m py_compile research_v146_backtest.py research_v147_1m_2000u_backtest.py research_v147_bands6_7_75_85_9_10_tier123_backtest.py
      - name: Verify requested score bands, sizing and fixed comparison period
        run: |
          python - <<'PY'
          import research_v147_bands6_7_75_85_9_10_tier123_backtest as s
          assert s.MIN_ENTRY_SCORE == 6.0
          assert s.TIER_CAP == {1: 666.67, 2: 1333.33, 3: 2000.0}
          assert s.tier_custom(5.5) == 0
          assert s.tier_custom(6.0) == 1
          assert s.tier_custom(7.0) == 1
          assert s.tier_custom(7.5) == 2
          assert s.tier_custom(8.5) == 2
          assert s.tier_custom(9.0) == 3
          assert s.tier_custom(10.0) == 3
          assert s.v.STOP_ATR == 1.0
          assert s.v.REWARD_R == 2.0
          assert s.v.CAPITAL == 2000.0
          assert s.START.isoformat() == '2026-08-13T07:40:00+00:00'
          assert s.END.isoformat() == '2026-09-12T07:40:00+00:00'
          print('PASS: min6; bands 6.0-7.0 / 7.5-8.5 / 9.0-10.0; caps 666.67/1333.33/2000 = 1:2:3')
          PY
      - name: Run V1.4.7 BTC 30-day custom bands tier 1-2-3 backtest
        run: python research_v147_bands6_7_75_85_9_10_tier123_backtest.py
      - name: Show result summary
        run: |
          cat backtest_output_v147_bands6_7_75_85_9_10_tier123/metrics.json
          echo '--- REPORT ---'
          cat backtest_output_v147_bands6_7_75_85_9_10_tier123/V147_BTC_SWAP_30D_2000U_BANDS6_7_75_85_9_10_TIER123_Backtest_Report.md
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V147-BTC-SWAP-30D-BANDS6-7-75-85-9-10-TIER123-BACKTEST
          path: |
            backtest_output_v147_bands6_7_75_85_9_10_tier123/V147_BTC_SWAP_30D_2000U_BANDS6_7_75_85_9_10_TIER123_Backtest_Report.md
            backtest_output_v147_bands6_7_75_85_9_10_tier123/V147_BTC_SWAP_30D_2000U_BANDS6_7_75_85_9_10_TIER123_Trades.csv
            backtest_output_v147_bands6_7_75_85_9_10_tier123/V147_BTC_SWAP_30D_2000U_BANDS6_7_75_85_9_10_TIER123_Cycles.csv
            backtest_output_v147_bands6_7_75_85_9_10_tier123/V147_BTC_SWAP_30D_2000U_BANDS6_7_75_85_9_10_TIER123_DailyEquity.csv
            backtest_output_v147_bands6_7_75_85_9_10_tier123/metrics.json
          if-no-files-found: error
          retention-days: 14
