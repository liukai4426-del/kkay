'''
          if marker not in s:
              raise RuntimeError('test_v13 insertion marker missing')
          s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          PY
      - name: Run V1.3 core tests
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Commit final V1.3 source
        run: |
          rm -f apply_v13.py .github/workflows/apply-v13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'V1.3: layered structure strategy and China-day risk guard'
          git push origin HEAD:codex/v1-3-strategy
