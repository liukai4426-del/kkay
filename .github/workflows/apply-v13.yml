name: Apply V1.3 Strategy
on:
  push:
    branches:
      - codex/v1-3-strategy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply confirmed V1.3 source patch
        run: python apply_v13.py
      - name: Apply China natural day refinements
        run: python refine_v13.py
      - name: Run V1.3 core tests
        run: python -m unittest -v test_engine test_v11 test_v13 test_candles test_v122
      - name: Commit final V1.3 source
        run: |
          rm -f apply_v13.py refine_v13.py .github/workflows/apply-v13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'V1.3: layered structure strategy and China-day risk guard'
          git push origin HEAD:codex/v1-3-strategy
