name: Apply V1.3 Layered Strategy
on:
  push:
    branches:
      - codex/v1-3-strategy
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply confirmed V1.3 patch
        run: python apply_v13.py
      - name: Apply China-time and structure refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          # China natural day for both daily drawdown and consecutive-loss guard.
          p=Path('engine.py'); s=p.read_text()
          s=s.replace("ZoneInfo('Asia/Tokyo')","ZoneInfo('Asia/Shanghai')")
          s=s.replace('日本时间','中国时间')
          s=s.replace("day=datetime.now(timezone.utc).strftime('%Y-%m-%d')","day=datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%Y-%m-%d')")
          s=s.replace('达到UTC日内权益回撤上限','达到中国时间日内权益回撤上限')
          p.write_text(s)

          p=Path('app.py'); s=p.read_text()
          s=s.replace('日本时间','中国时间')
          s=s.replace('UTC日内权益回撤上限 USDT','中国时间日内权益回撤上限 USDT')
          p.write_text(s)

          p=Path('RELEASE-1.3.md'); s=p.read_text().replace('日本时间','中国时间')
          p.write_text(s)

          # Only a strong opposite structure (>=3 tests + recency rule) blocks/penalizes forward R-space.
          p=Path('strategy.py'); s=p.read_text()
          old="z=_nearest(zones,price,opposite,ahead)"
          new="z=_nearest([item for item in zones if item.get('strong')],price,opposite,ahead)"
          if s.count(old)!=1:
              raise RuntimeError(f'front strong-zone refinement expected once, got {s.count(old)}')
          s=s.replace(old,new,1)
          # Old structures retain less score than recent ones.
          s=s.replace("score=3 if hnear['strong'] else 2","score=3 if hnear['strong'] else (2 if hnear.get('recency',0)>=.25 else 1)")
          p.write_text(s)

          # Add focused V1.3 safety tests.
          p=Path('test_v13.py'); s=p.read_text()
          s=s.replace('import unittest\n','import unittest\nimport tempfile\nimport time\nfrom datetime import datetime\nfrom zoneinfo import ZoneInfo\nfrom unittest.mock import patch\n',1)
          s=s.replace('from strategy import _environment, _setup, _trigger, _level, SCORE_MAX','from strategy import _environment, _setup, _trigger, _structure_context, _level, SCORE_MAX')
          s=s.replace('from engine import Settings, make_plan','from engine import Engine, Settings, make_plan')
          marker="\n\nif __name__=='__main__': unittest.main(verbosity=2)\n"
          extra=r'''

class V13StructureAndSafetyTests(unittest.TestCase):
    def test_weak_forward_zone_does_not_block(self):
        hour=[{'c':100}]; quarter=[{'c':100}]
        h={'atr':100}; m={'atr':50}
        weak={'kind':'resistance','price':120,'tests':2,'age':2,'recency':.9,'strong':False}
        with patch('strategy._zones',side_effect=[[weak],[]]):
            ctx=_structure_context(hour,quarter,h,m,True,1.0)
        self.assertFalse(ctx['blocked']); self.assertIsNone(ctx['front'])

    def test_strong_forward_zone_under_one_r_blocks(self):
        hour=[{'c':100}]; quarter=[{'c':100}]
        h={'atr':100}; m={'atr':50}
        strong={'kind':'resistance','price':120,'tests':3,'age':2,'recency':.9,'strong':True}
        with patch('strategy._zones',side_effect=[[strong],[]]):
            ctx=_structure_context(hour,quarter,h,m,True,1.0)
        self.assertTrue(ctx['blocked']); self.assertLess(ctx['front_r'],1.0)

