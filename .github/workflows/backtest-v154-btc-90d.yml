name: Backtest KAYTRADE V1.5.4 BTC 90D
on:
  push:
    branches: [research/v154-btc-90d-backtest]
    paths:
      - .github/workflows/backtest-v154-btc-90d.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    name: v154-btc-90d-market
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore OKX public market cache
        uses: actions/cache/restore@v4
        with:
          path: .research_market_cache
          key: v154-btc-90d-market-20260615T0316-20260913T0316-w1600-v1

      - name: Materialize audited replay sources
        run: |
          git fetch --depth=1 origin research/v152-btc-30d-backtest
          git show FETCH_HEAD:research_v152_30d_backtest.py > research_v154_90d_backtest.py
          git show FETCH_HEAD:research_v152_data_cache.py > research_v154_data_cache.py
          git show FETCH_HEAD:research_v152_window_patch.py > research_v154_window_patch.py
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py

      - name: Adapt replay harness to V1.5.4
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('research_v154_90d_backtest.py')
          s=p.read_text()
          replacements=[
            ('import v152_model as model','import v154_model as model'),
            ('import v152_backtest_core as bt','import v153_backtest_core as bt'),
            ('backtest_output_v152_btc_30d','backtest_output_v154_btc_90d'),
            ("'strategy_version':'1.5.2'","'strategy_version':'1.5.4'"),
            ("'days':30","'days':90"),
            ('V152_BTC_SWAP_30D','V154_BTC_SWAP_90D'),
            ('KAYTRADE V1.5.2 — BTC-USDT-SWAP 30天历史回测','KAYTRADE V1.5.4 — BTC-USDT-SWAP 90天历史回测'),
            ('V1.5.2 30D backtest','V1.5.4 90D backtest'),
            ('V152_30D_METRICS','V154_90D_METRICS'),
            ('正式版 `v152_model.py`','正式版 `v154_model.py`'),
            ('（30天）','（90天）'),
            ("'entry_order_type':'LIMIT'","'entry_order_type':'MARKET'"),
            ('当前正式V1.5.2；1H方向→15m固定回调→5m确认→1m触发→6分/Hard Gate→限价开仓；1H ATR×1止损；整仓2R；当前正式版TP/SL触发后市价退出。',
             '当前正式V1.5.4；1H/15m趋势→5m BOLL回调信号→仅首个1m执行窗口→6分/Hard Gate→市价开仓；1m不做技术确认；1H ATR×1止损；整仓2R；TP/SL触发后市价退出。'),
            ('- 限价开仓提交后最多等待5分钟；成交所在1m K线不得用于成交后的TP/SL判断，最早从下一根1m开始。',
             '- 市价开仓在BOLL信号后的首个1m起点执行；以该1m开盘价近似即时成交参考，并施加声明的5bps不利入场滑点。'),
            ('- Maker开仓2bps；TP/SL市价退出Taker 5bps并计5bps声明滑点；Funding按历史费率计入。',
             '- 市价开仓Taker 5bps并计5bps不利滑点；TP/SL市价退出Taker 5bps并计5bps不利滑点；Funding按历史费率计入。'),
          ]
          for old,new in replacements:
              s=s.replace(old,new)

          old_rearm="""def rearm_ready(rearm, close):\n    if not rearm:\n        return True\n    return float(close) < float(rearm['zone_low']) or float(close) > float(rearm['zone_high'])\n"""
          new_rearm="""def rearm_ready(rearm, close_ms):\n    if not rearm:\n        return True\n    return int(close_ms) >= int(rearm.get('rearm_after_ms') or 0)\n"""
          if old_rearm not in s:
              raise SystemExit('old rearm function not found')
          s=s.replace(old_rearm,new_rearm)
          s=s.replace("if sim.rearm and rearm_ready(sim.rearm, bar['c']):","if sim.rearm and rearm_ready(sim.rearm, bar_open):")
          s=s.replace("if result.get('status') == '等待5m确认': sim.stats['waiting_5m_bars'] += 1","if result.get('status') == '等待5m BOLL回调信号': sim.stats['waiting_boll_signal_bars'] += 1")
          s=s.replace("if result.get('status') == '等待1m触发': sim.stats['waiting_1m_bars'] += 1","if str(result.get('status') or '').startswith('BOLL信号执行窗口'): sim.stats['boll_window_bars'] += 1")
          old_pf='        f"| Profit Factor | {m[\'profit_factor\'] if math.isinf(m[\'profit_factor\']) else f\'{m[\'profit_factor\']:.3f}\'} |",\n'
          new_pf='        f"| Profit Factor | {\'∞\' if math.isinf(m[\'profit_factor\']) else format(m[\'profit_factor\'], \'.3f\')} |",\n'
          if old_pf in s:
              s=s.replace(old_pf,new_pf)
          p.write_text(s)

          d=Path('research_v154_data_cache.py')
          d.write_text(d.read_text().replace('V1.5.2','V1.5.4').replace('V152_MARKET_CACHE_DIR','V154_MARKET_CACHE_DIR'))

          w=Path('research_v154_window_patch.py')
          ws=w.read_text().replace('V1.5.2','V1.5.4')
          ws += '''\n\ndef _cw_add(self, other):\n    return list(self) + list(other)\n\ndef _cw_radd(self, other):\n    return list(other) + list(self)\n\nCandleWindow.__add__ = _cw_add\nCandleWindow.__radd__ = _cw_radd\n'''
          w.write_text(ws)
          PY

          cat > research_v154_cache_patch.py <<'PY'
          from __future__ import annotations
          import v152_model as base_model
          import v153_model as signal_model
          import v154_model as model

          _orig_indicators=base_model.indicators
          _orig_zones=base_model.strategy._zones
          _orig_macd_hist=base_model._macd_hist
          _orig_ema50_move=base_model._ema50_move
          _orig_ema=base_model.ema
          _indicator_cache={}; _zone_cache={}; _macd_cache={}; _ema50_cache={}; _one_minute_ema20={}; _one_minute_window=1000

          def _rows_key(rows):
              return (0,0,0) if not rows else (len(rows),int(rows[0]['t']),int(rows[-1]['t']))
          def _is_one_minute(rows):
              return len(rows)>=2 and int(rows[-1]['t'])-int(rows[-2]['t'])==60_000
          def _exact_ema20(rows):
              return float(_orig_ema([float(r['c']) for r in rows],20)[-1])
          def prime_one_minute(rows,window=1000):
              global _one_minute_window
              _one_minute_window=int(window); _one_minute_ema20.clear()
              if not rows: return
              closes=[float(r['c']) for r in rows]; n=min(_one_minute_window,len(rows)); alpha=2.0/21.0; q=1.0-alpha; value=closes[0]
              for x in closes[1:n]: value += alpha*(x-value)
              _one_minute_ema20[int(rows[n-1]['t'])]=float(value)
              if len(rows)<=n: return
              qn=q**n
              for end in range(n,len(rows)):
                  old0=closes[end-n]; old1=closes[end-n+1]; new=closes[end]
                  value=q*value + qn*(old1-old0) + alpha*new
                  _one_minute_ema20[int(rows[end]['t'])]=float(value)
          def indicators_cached(rows):
              key=_rows_key(rows); hit=_indicator_cache.get(key)
              if hit is None:
                  if _is_one_minute(rows):
                      last_t=int(rows[-1]['t']); e=_one_minute_ema20.get(last_t)
                      if e is None or len(rows)!=_one_minute_window: e=_exact_ema20(rows)
                      hit={'ema20':float(e)}
                  else: hit=_orig_indicators(rows)
                  _indicator_cache[key]=hit
              return hit
          def zones_cached(rows,atr,lookback):
              key=(_rows_key(rows),float(atr),int(lookback)); hit=_zone_cache.get(key)
              if hit is None: hit=_orig_zones(rows,atr,lookback); _zone_cache[key]=hit
              return hit
          def macd_hist_cached(rows):
              key=_rows_key(rows); hit=_macd_cache.get(key)
              if hit is None: hit=_orig_macd_hist(rows); _macd_cache[key]=hit
              return hit
          def ema50_move_cached(rows,side):
              key=(_rows_key(rows),str(side)); hit=_ema50_cache.get(key)
              if hit is None: hit=_orig_ema50_move(rows,side); _ema50_cache[key]=hit
              return hit

          signal_model.indicators=indicators_cached
          base_model.indicators=indicators_cached
          base_model.strategy._zones=zones_cached
          base_model._macd_hist=macd_hist_cached
          base_model._ema50_move=ema50_move_cached

          def stats():
              return {'indicator_entries':len(_indicator_cache),'zone_entries':len(_zone_cache),'macd_entries':len(_macd_cache),'ema50_entries':len(_ema50_cache),'precomputed_1m_ema20':len(_one_minute_ema20)}
          PY

          cat > research_v154_market_patch.py <<'PY'
          """Market-entry replay semantics for production V1.5.4.

          A signal is evaluated at a 1m bar OPEN using only candles already closed at
          that instant. If eligible, the market order fills immediately from that bar
          open with adverse declared slippage. This preserves the exact first-minute
          eligibility window and avoids V1.5.3 resting-limit assumptions.
          """
          from __future__ import annotations
          import bisect, math
          import engine

          def install(r):
              original_metrics=r.metrics

              def metrics_v154(sim,first_px,last_px):
                  m=original_metrics(sim,first_px,last_px)
                  m.update({
                      'strategy_version':'1.5.4','days':90,'entry_order_type':'MARKET',
                      'entry_model':'signal evaluated at 1m open; fill at that open plus declared adverse slippage',
                      'entry_taker_bps':r.TAKER_BPS,'entry_slippage_bps':r.SLIPPAGE_BPS,
                      'exit_taker_bps':r.TAKER_BPS,'exit_slippage_bps':r.SLIPPAGE_BPS,
                      'first_minute_only':True,'market_entry_same_bar_exit_allowed':True,
                  })
                  return m
              r.metrics=metrics_v154

              def submit_market(self,result,now_ms,reference_price,bar):
                  side=result.get('side')
                  if side not in ('做多','做空'):
                      return
                  score=(result.get('scores') or {}).get(side) or {}
                  if not score.get('eligible') or float(score.get('total') or 0)<r.model.THRESHOLD:
                      return
                  self.stats['eligible_signals']+=1
                  self.score_counts[f"{float(score['total']):.1f}"]+=1
                  if not self.can_submit(now_ms,reference_price):
                      return
                  opp=result.get('opportunity') or score.get('opportunity')
                  if not isinstance(opp,dict):
                      self.stats['missing_opportunity']+=1; return
                  start=int(opp.get('signal_close_ms') or 0)
                  if not (start<=int(now_ms)<start+r.model.ENTRY_WINDOW_MS):
                      self.stats['expired_before_market_submit']+=1; return

                  buy=side=='做多'; d=1.0 if buy else -1.0
                  planned=float(engine.rounded(float(reference_price),self.meta['tickSz'],buy))
                  stop_distance=float(opp['atr1h'])*r.STOP_ATR
                  stop=float(engine.rounded(planned-d*stop_distance,self.meta['tickSz'],not buy))
                  target=float(engine.rounded(planned+d*stop_distance*r.REWARD_R,self.meta['tickSz'],buy))
                  eq=self.equity(reference_price)
                  daily_remaining=max(0.0,r.DAILY_LOSS-max(0.0,self.daily_peak-eq))
                  risk_capital=min(r.CAPITAL,eq)
                  base_risk=min(r.RISK_USDT,risk_capital*r.RISK_PCT/100.0)
                  risk_budget=min(base_risk,daily_remaining)
                  if risk_budget<=0:
                      self.stats['sizing_or_cost_skips']+=1; return

                  taker=r.TAKER_BPS/10000.0; slip=r.SLIPPAGE_BPS/10000.0
                  per_btc=abs(planned-stop)+planned*(taker+slip)+stop*(taker+slip)
                  raw_btc=min(risk_budget/per_btc,r.POSITION_CAP/planned)
                  btc=r.round_contract_btc(raw_btc,self.meta)
                  if btc<=0:
                      self.stats['sizing_or_cost_skips']+=1; return
                  worst_roundtrip_cost=btc*(planned*(taker+slip)+target*(taker+slip))
                  plan={'px':str(planned),'stop_distance':stop_distance,'btc':btc,'worst_roundtrip_cost':worst_roundtrip_cost}
                  ok,diag,blockers=r.model.execution_checks(plan,opp,score)
                  if not ok:
                      self.stats['execution_gate_blocks']+=1
                      for reason in blockers:self.blockers[reason]+=1
                      return

                  actual_slip=(r.SLIPPAGE_BPS+self.stress_extra_bps)/10000.0
                  actual_entry=planned*(1.0+actual_slip if buy else 1.0-actual_slip)
                  entry_fee=actual_entry*btc*taker
                  self.position=r.bt.Position(
                      opportunity_id=str(opp['id']),side=side,entry=actual_entry,stop=stop,target=target,
                      quantity_btc=btc,score=float(score['total']),filled_bar_t=int(bar['t'])-1,
                      entry_fee=entry_fee,score_components=dict(score.get('layers') or {}),
                      trigger_combination=dict((score.get('confirmations') or {}).get('trigger') or {}),
                      front_r=float(diag.get('front_r',math.inf)),front_space_status=str(diag.get('front_space_status','空间未知')),
                      cost_r=float(diag.get('cost_r',math.inf)),
                  )
                  self.position_open_ms=int(now_ms)
                  self.stats['market_submitted']+=1
                  self.stats['market_filled']+=1
                  self.rearm={'zone_low':float(opp['zone_low']),'zone_high':float(opp['zone_high']),'side':side,'id':opp['id'],
                              'signal_bar_t':int(opp.get('signal_bar_t') or 0),
                              'rearm_after_ms':int(opp.get('signal_close_ms') or now_ms)+5*60_000}
                  self.opportunity=None

              r.Simulator.submit=submit_market

              def run_market(data,ts,meta,funding,stress_extra_bps=0.0):
                  sim=r.Simulator(meta,funding,stress_extra_bps=stress_extra_bps)
                  d1=data['1m']; start_i=bisect.bisect_left(ts['1m'],r.START_MS)
                  if start_i<1: raise RuntimeError('not enough 1m warmup')
                  last_bar=None
                  for i in range(start_i,len(d1)):
                      bar=d1[i]; bar_open=int(bar['t'])
                      if bar_open>=r.END_MS: break
                      last_bar=bar; bar_close=bar_open+60_000

                      sim.apply_funding_until(bar_open,float(bar['o']))
                      if sim.rearm and r.rearm_ready(sim.rearm,bar_open):
                          sim.rearm=None; sim.stats['rearmed']+=1

                      slices={}; valid=True
                      for tf in ('1m','5m','15m','1H','4H'):
                          rows=r.closed_slice(data,ts,tf,bar_open)
                          if rows is None:
                              valid=False; break
                          slices[tf]=rows
                      if valid:
                          old_opp=dict(sim.opportunity) if isinstance(sim.opportunity,dict) else None
                          result,new_opp,transition=r.model.evaluate(
                              slices['1H'],slices['15m'],slices['5m'],slices['1m'],slices['4H'],
                              opportunity=sim.opportunity,stop_atr=r.STOP_ATR,
                              maker_bps=r.MAKER_BPS,taker_bps=r.TAKER_BPS,slippage_bps=r.SLIPPAGE_BPS,
                              now_ms=bar_open,allow_new=(sim.rearm is None and sim.position is None),
                          )
                          sim.opportunity=new_opp
                          if transition:
                              sim.transitions[transition[0]]+=1
                              if transition[0]=='invalidated' and old_opp:
                                  sim.rearm={'zone_low':old_opp['zone_low'],'zone_high':old_opp['zone_high'],'side':old_opp['side'],'id':old_opp['id'],
                                             'signal_bar_t':int(old_opp.get('signal_bar_t') or 0),
                                             'rearm_after_ms':int(old_opp.get('signal_close_ms') or bar_open)+5*60_000}
                                  sim.opportunity=None
                          if result.get('status')=='等待5m BOLL回调信号': sim.stats['waiting_boll_signal_bars']+=1
                          if str(result.get('status') or '').startswith('BOLL信号执行窗口'): sim.stats['boll_window_bars']+=1
                          if result.get('status')=='允许开仓': sim.stats['allow_entry_states']+=1
                          sim.submit(result,bar_open,float(bar['o']),bar)

                      sim.process_exit(bar)
                      sim.apply_funding_until(bar_close,float(bar['c']))
                      sim.mark_risk(bar_close,float(bar['c']))
                      if (i-start_i)%10000==0:
                          print(f"progress {i-start_i:,}, equity={sim.equity(bar['c']):.2f}, trades={len(sim.trades)}, opp={bool(sim.opportunity)}",flush=True)

                  if last_bar is None: raise RuntimeError('no test bars')
                  sim.finish(last_bar)
                  first=next(x for x in d1 if x['t']>=r.START_MS)
                  m=r.metrics(sim,float(first['c']),float(last_bar['c']))
                  return sim,m

              r.run=run_market
          PY

          cat > research_v154_90d_fixed_runner.py <<'PY'
          from datetime import datetime,timezone
          import research_v154_cache_patch as cache_patch
          import research_v154_90d_backtest as r
          import research_v154_data_cache as data_cache
          import research_v154_market_patch as market_patch
          import research_v154_window_patch as window_patch

          END=datetime(2026,9,13,3,16,tzinfo=timezone.utc)
          START=datetime(2026,6,15,3,16,tzinfo=timezone.utc)
          r.END=END; r.START=START; r.END_MS=int(END.timestamp()*1000); r.START_MS=int(START.timestamp()*1000)
          r.base.END=r.END; r.base.START=r.START; r.base.END_MS=r.END_MS; r.base.START_MS=r.START_MS
          data_cache.install(r.base,cache_patch=cache_patch)
          window_patch.install(r)
          market_patch.install(r)
          if __name__=='__main__':
              r.main()
              print('COMPUTE_CACHE_STATS',cache_patch.stats(),flush=True)
              print('MARKET_CACHE_STATS',data_cache.stats(),flush=True)
              print('WINDOW_VIEW_STATS',window_patch.stats(),flush=True)
          PY

      - name: Compile and verify V1.5.4 90-day replay wiring
        run: |
          python -m py_compile research_v146_backtest.py v152_model.py v152_backtest_core.py v153_model.py v153_backtest_core.py v154_model.py research_v154_90d_backtest.py research_v154_cache_patch.py research_v154_data_cache.py research_v154_window_patch.py research_v154_market_patch.py research_v154_90d_fixed_runner.py
          python - <<'PY'
          from pathlib import Path
          import v154_model as m
          import research_v154_window_patch as w
          s=Path('research_v154_90d_backtest.py').read_text()
          p=Path('research_v154_market_patch.py').read_text()
          assert m.VERSION=='1.5.4' and m.THRESHOLD==6.0 and m.ENTRY_WINDOW_MS==60_000
          assert "'days':90" in s and 'import v154_model as model' in s
          assert "'entry_order_type':'MARKET'" in s
          assert 'actual_entry=planned*' in p and 'filled_bar_t=int(bar[\'t\'])-1' in p
          assert "r.closed_slice(data,ts,tf,bar_open)" in p and 'now_ms=bar_open' in p
          sample=[{'t':i} for i in range(5)]; a=w.CandleWindow(sample,0,2); b=w.CandleWindow(sample,2,4); assert a+b==sample[:4]
          print('PASS: V1.5.4 exact 60s model + market/taker/slippage replay wired')
          PY

      - name: Run fixed-window V1.5.4 90-day BTC backtest
        run: time python research_v154_90d_fixed_runner.py

      - name: Verify and summarize 90-day outputs
        run: |
          python - <<'PY'
          import csv,json,math
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          out=Path('backtest_output_v154_btc_90d')
          m=json.loads((out/'metrics.json').read_text())
          assert m['strategy_version']=='1.5.4' and m['days']==90
          assert m['entry_order_type']=='MARKET' and m['first_minute_only'] is True
          assert m['start_utc'].startswith('2026-06-15T03:16:00') and m['end_utc'].startswith('2026-09-13T03:16:00')
          trades=list(csv.DictReader((out/'V154_BTC_SWAP_90D_Trades.csv').open()))
          tz=ZoneInfo('Asia/Shanghai')
          groups={k:defaultdict(list) for k in ('month','week','weekday','hour','path','side','score')}
          for t in trades:
              dt=datetime.fromisoformat(t['entry_time'].replace('Z','+00:00')).astimezone(tz)
              pnl=float(t['net_pnl'])
              groups['month'][dt.strftime('%Y-%m')].append(pnl)
              groups['week'][dt.strftime('%G-W%V')].append(pnl)
              groups['weekday'][dt.strftime('%a')].append(pnl)
              groups['hour'][dt.strftime('%H')].append(pnl)
              groups['side'][t['side']].append(pnl)
              groups['score'][f"{float(t['score']):.1f}"].append(pnl)
              try: path=json.loads(t.get('trigger_combination') or '{}').get('boll_path') or 'unknown'
              except Exception: path='parse_error'
              groups['path'][path].append(pnl)
          def pack(d):
              out={}
              for k,v in sorted(d.items()):
                  gp=sum(x for x in v if x>0); gl=-sum(x for x in v if x<0)
                  out[k]={'trades':len(v),'wins':sum(x>0 for x in v),'win_rate_pct':100*sum(x>0 for x in v)/len(v) if v else 0.0,
                          'net_pnl':sum(v),'avg_pnl':sum(v)/len(v) if v else 0.0,'profit_factor':gp/gl if gl>0 else math.inf}
              return out
          summary={'metrics':m,'by_month':pack(groups['month']),'by_week':pack(groups['week']),
                   'by_weekday':pack(groups['weekday']),'by_hour_cn':pack(groups['hour']),
                   'boll_path':pack(groups['path']),'by_side':pack(groups['side']),'by_score':pack(groups['score'])}
          (out/'summary_90d.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('V154_90D_SUMMARY')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.5.4-BTC-90D-Backtest
          path: backtest_output_v154_btc_90d/
          if-no-files-found: error
          retention-days: 30

      - name: Save OKX public market cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .research_market_cache
          key: v154-btc-90d-market-20260615T0316-20260913T0316-w1600-v1

# trigger: V1.5.4 90D replay
