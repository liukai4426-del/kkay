name: Backtest KAYTRADE V1.5.2 BTC 30D Fixed Fast
on:
  push:
    branches: [research/v152-btc-30d-backtest]
    paths:
      - research_v152_cache_patch.py
      - research_v152_30d_fixed_runner.py
      - .github/workflows/backtest-v152-btc-30d-fixed-fast.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    name: v152-btc-30d-fixed-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize validated OKX public-data loader
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
      - name: Fix report-only formatting typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research_v152_30d_backtest.py')
          s=p.read_text()
          old='        f"| Profit Factor | {m[\'profit_factor\'] if math.isinf(m[\'profit_factor\']) else f\'{m[\'profit_factor\']:.3f}\'} |",\n'
          new='        f"| Profit Factor | {\'∞\' if math.isinf(m[\'profit_factor\']) else format(m[\'profit_factor\'], \'.3f\')} |",\n'
          if old not in s:
              raise SystemExit('expected report formatting line not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Compile fixed-window cached replay
        run: python -m py_compile research_v146_backtest.py v152_model.py v152_backtest_core.py research_v152_30d_backtest.py research_v152_cache_patch.py research_v152_30d_fixed_runner.py
      - name: Verify fixed comparison window and pure caching
        run: |
          python - <<'PY'
          from pathlib import Path
          import v152_model as m
          p=Path('research_v152_30d_fixed_runner.py').read_text()
          c=Path('research_v152_cache_patch.py').read_text()
          assert m.VERSION=='1.5.2' and m.THRESHOLD==6.0 and m.FRONT_MIN_R==1.5
          assert '2026, 9, 13, 3, 16' in p and '2026, 8, 14, 3, 16' in p
          assert '_orig_indicators(rows)' in c and '_orig_zones(rows, atr, lookback)' in c
          assert 'model.indicators = indicators_cached' in c
          print('PASS: exact V1.5.1 comparison window; cache delegates to original deterministic functions')
          PY
      - name: Run V1.5.2 fixed-window 30-day BTC backtest
        run: python research_v152_30d_fixed_runner.py
      - name: Verify outputs and fixed timestamps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('backtest_output_v152_btc_30d')
          m=json.loads((out/'metrics.json').read_text())
          assert m['strategy_version']=='1.5.2'
          assert m['days']==30
          assert m['entry_threshold']==6.0
          assert m['front_space_min_r']==1.5
          assert m['start_utc'].startswith('2026-08-14T03:16:00')
          assert m['end_utc'].startswith('2026-09-13T03:16:00')
          assert (out/'V152_BTC_SWAP_30D_Backtest_Report.md').is_file()
          assert (out/'V152_BTC_SWAP_30D_Trades.csv').is_file()
          print('PASS: V1.5.2 fixed-window outputs verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.5.2-BTC-30D-Fixed-Backtest
          path: backtest_output_v152_btc_30d/
          if-no-files-found: error
          retention-days: 30
