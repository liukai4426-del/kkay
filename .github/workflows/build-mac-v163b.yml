name: Build KAYTRADE Intel Mac 1.6.3b Build1631

on:
  push:
    branches: [release/v1.6.3b]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile V1.6.3b
        run: python -m py_compile v160_model.py v160_update_patch.py v161_model.py v161_update_patch.py v162_model.py v162_update_patch.py v163_model.py v163_update_patch.py v163_ui_patch.py v163b_network_patch.py test_v163_update.py test_v163_ui.py test_v163b_network.py desktop.py
      - name: Preserved regressions
        run: |
          python -m unittest -v test_engine
          python -m unittest -v test_candles
          python -m unittest -v test_v152_strategy
          python -m unittest -v test_v153_strategy
          python -m unittest -v test_v154_strategy
          python -m unittest -v test_v155_update
          python -m unittest -v \
            test_v156_build1561.V156Build1561Tests.test_fixed_loss_control_markers_cover_value_row_and_note \
            test_v156_build1561.V156Build1561Tests.test_identity_and_preserved_flags \
            test_v156_build1561.V156Build1561Tests.test_log_order_helper_is_newest_first_and_capped
          python -m unittest -v test_v160_update
          python -m unittest -v test_v161_update
          python -m unittest -v test_v162_update
          python -m unittest -v test_v163_update
          python -m unittest -v test_v163_ui
          python -m unittest -v test_v163b_network
      - name: Verify V1.6.3b wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import app
          import v163_model as model
          import v163_update_patch as runtime
          import v163_ui_patch as ui
          import v163b_network_patch as hotfix
          spec=Path('OKXLocal.spec').read_text()
          desktop=Path('desktop.py').read_text()
          assert model.VERSION=='1.6.3' and model.THRESHOLD==6.0
          assert hotfix.VERSION=='1.6.3b' and hotfix.BUILD=='1631'
          assert hotfix.RECOVERY_INTERVAL_SECONDS==5.0
          assert hotfix.RECOVERY_WINDOW_SECONDS==60.0
          assert runtime.VERSION=='1.6.3b' and runtime.BUILD=='1631'
          assert ui.VERSION_SUBTITLE=='BTC / USDT   ·   V1.6.3b'
          assert app.App.worker is hotfix._worker_v163b
          assert "'v163b_network_patch'" in spec
          assert "CFBundleShortVersionString': '1.6.3'" in spec
          assert "CFBundleVersion': '1631'" in spec
          assert 'apply_v163b_network_patch' in desktop
          print('PASS V1.6.3b wiring')
          PY

  build:
    needs: unit
    runs-on: macos-15-intel
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install 'pyinstaller==6.16.0' 'certifi==2025.8.3' 'Pillow==11.3.0'
      - run: python -m unittest -v test_v163b_network
      - run: python -m unittest -v test_v163_update
      - run: python -m unittest -v test_v163_ui
      - run: python build_icon.py
      - run: python -m PyInstaller --noconfirm OKXLocal.spec
      - name: Verify Intel bundle and metadata
        run: |
          python verify_bundle.py
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1.6.3'
          /usr/bin/plutil -p dist/KAYTRADE.app/Contents/Info.plist | grep '1631'
          codesign --verify --deep --strict dist/KAYTRADE.app
      - name: Packaged UI smoke test
        run: |
          TMPDIR_CHECK="$(mktemp -d)"
          dist/KAYTRADE.app/Contents/MacOS/KAYTRADE --smoke-test "$TMPDIR_CHECK/smoke.txt"
          cat "$TMPDIR_CHECK/smoke.txt"
          grep 'V1.6.3b' "$TMPDIR_CHECK/smoke.txt"
      - name: Create installer
        run: |
          mkdir -p installer
          ditto dist/KAYTRADE.app installer/KAYTRADE.app
          cp RELEASE-1.6.3b.md installer/RELEASE-1.6.3b.md
          printf 'KAYTRADE V1.6.3b Build1631\nNetwork hotfix: read-only failures retry every 5 seconds for 60 seconds; recovery inside 60 seconds auto-resumes; after 60 seconds new entries stay off; POST uncertainty is never retried. Strategy unchanged from V1.6.3.\n' > installer/RELEASE-1.6.3b.txt
          hdiutil create -volname 'KAYTRADE 1.6.3b' -srcfolder installer -ov -format UDZO KAYTRADE-1.6.3b-Intel-build1631.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-1.6.3b-Intel-build1631
          path: |
            KAYTRADE-1.6.3b-Intel-build1631.dmg
            installer/RELEASE-1.6.3b.md
            installer/RELEASE-1.6.3b.txt
          if-no-files-found: error
