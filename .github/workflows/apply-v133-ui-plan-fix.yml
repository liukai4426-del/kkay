name: Apply KAYTRADE V1.3.3 Plan Score Risk UI Fix
on:
  push:
    branches: [codex/v1-3-3-ui-execution]
    paths:
      - v133_ui_fix_plan.py
      - .github/workflows/apply-v133-ui-plan-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply V1.3.3 UI fix
        run: python v133_ui_fix_plan.py
      - name: Verify scope and syntax
        run: |
          python -m py_compile app.py visual.py
          git diff --exit-code -- engine.py strategy.py exchange.py candles.py
          grep -F "defaults['consecutive_losses']=3" app.py
          grep -F "plan_surface=Card(dash,height=360)" app.py
          grep -F "viewport=max(self.header.winfo_width(),self.canvas.winfo_width(),base_total)" visual.py
      - name: Commit UI fix
        run: |
          git config user.name "liukai4426-del"
          git config user.email "liukai4426@gmail.com"
          git add app.py visual.py RELEASE-1.3.3.md
          git commit -m "ui: fix V1.3.3 trade plan score width and risk controls"
          git push origin HEAD:codex/v1-3-3-ui-execution
