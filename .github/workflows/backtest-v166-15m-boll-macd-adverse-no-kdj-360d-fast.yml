name: Backtest V1.6.6 15m BOLL MACD Adverse-Only No-KDJ 360D Fast

on:
  push:
    branches: [research/v166-15m-boll-macd-adverse-no-kdj-360d-fast]
    paths:
      - run_v166_15m_boll_macd_adverse_no_kdj_360d_fast.py
      - .github/workflows/backtest-v166-15m-boll-macd-adverse-no-kdj-360d-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_MARKET_CACHE: .backtest_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore 360D BTC market cache
        uses: actions/cache@v4
        with:
          path: .backtest_cache
          key: kaytrade-okx-btc-360d-end-20260914-market-v1

      - name: Materialize audited simulator
        run: |
          git fetch --depth=1 origin research/v151-btc-30d-backtest
          git show FETCH_HEAD:research_v146_backtest.py > research_v146_backtest.py
          git fetch --depth=1 origin research/v155-outer-bands-180d
          git show FETCH_HEAD:research_v1544_cache_patch.py > research_v1544_cache_patch.py
          git show FETCH_HEAD:research_v1544_180d_backtest.py > research_v1544_180d_backtest.py
          git show FETCH_HEAD:run_v1544_180d_fixed.py > run_v1544_180d_fixed.py

      - name: Compile and verify research lock
        run: |
          python -m py_compile \
            research_v146_backtest.py \
            research_v1544_cache_patch.py \
            research_v1544_180d_backtest.py \
            run_v1544_180d_fixed.py \
            v152_model.py v153_model.py v154_model.py \
            v160_model.py v161_model.py v162_model.py v163_model.py v164_model.py v165_model.py \
            run_v160_365d_2000u.py run_v165_1000d_2000u.py \
            run_v166_entry_expansion_4way_360d.py \
            research_backtest_data_cache.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast.py \
            run_v166_15m_boll_macd_adverse_only_360d_fast_r2.py \
            run_v166_15m_boll_macd_adverse_no_kdj_360d_fast.py
          python - <<'PY'
          import run_v166_15m_boll_macd_adverse_no_kdj_360d_fast as x
          assert x.src.DAYS == 360
          assert x.src.BOLL_WINDOW_MS == 900000
          assert x.src.THRESHOLD == 6.0
          row={
            'raw':6.0,'total':6.0,'gate':True,'eligible':True,'position_multiplier':1.0,
            'layers':{'kdj5_signal':0.5},
            'items':[('5m信号KDJ对应交叉',0.5,0.5)],
            'confirmations':{}
          }
          x._remove_kdj_score_from_row(row)
          assert row['layers']['kdj5_signal'] == 0.0
          assert row['total'] == 5.5
          assert row['eligible'] is False
          assert row['items'][0][1] == 0.0
          print('PASS: only KDJ +0.5 score removed; threshold remains 6.0')
          PY

      - name: Run 360D no-KDJ-score backtest
        run: time python run_v166_15m_boll_macd_adverse_no_kdj_360d_fast.py

      - name: Verify outputs and anomaly lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest_output_v166_15m_boll_macd_adverse_no_kdj_360d_fast/result_15m_boll_macd_adverse_only_360d.json')
          d=json.loads(p.read_text())
          assert d['window']['days'] == 360
          assert d['changes']['boll_timeframe'] == '15m'
          assert d['changes']['kdj5_signal_score'] == '0.5 -> 0.0'
          assert d['changes']['kdj_hard_gate'] is False
          assert d['unchanged']['score_threshold'] == 6.0
          trades=int(d['metrics']['trades'])
          assert trades > 0, 'ANOMALY: zero trades; reject this research output'
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: KAYTRADE-V1.6.6-15M-BOLL-MACD-ADVERSE-NO-KDJ-360D-FAST
          path: backtest_output_v166_15m_boll_macd_adverse_no_kdj_360d_fast/
          if-no-files-found: error
          retention-days: 30
